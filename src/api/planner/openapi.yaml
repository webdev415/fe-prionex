# Vendored copy of CRM/planner api/openapi.yaml — do not edit by hand.
# planner-commit: 6b6b5b5182ca6fe77bbfd36ddc2ca1da3be8ea80
# Planner story 1.9 (AA-72): types are generated from this file into schema.ts
# by `npm run planner:types`; the drift test in src/api/planner/__tests__ fails
# when schema.ts does not match. Refresh = copy the file from a newer planner
# commit, update the pin above, run `npm run planner:types`.
#
# Контракт API планера — главная копия (AD-9, AR-7). Spec-first: сервер —
# интерфейсы oapi-codegen v2.8.0 (internal/platform/openapi, `go generate ./...`),
# клиенты вендорят этот файл закреплённого коммита и генерируют типы
# openapi-typescript 7.13.x.
#
# Правила файла (джоба contract, cmd/planner/contract_test.go):
#   - база пути одна — servers[0].url = /api/v1/planner, пути ниже короткие;
#   - каждый путь «база + путь» совпадает с регэкспом маршрута planner-routes из
#     api/kong-perimeter.json, путь вне поимённых групп — нет; единственное
#     исключение — лента ICS `/ics/{token}.ics` (4.4, AD-22): она совпадает только
#     с маршрутом planner-ics (ics_route), не с planner-routes, и только у неё
#     `security: []`;
#   - ни один путь не содержит `internal`;
#   - заголовки запросов ⊆ route_cors.headers, заголовки ответов ⊆
#     route_cors.exposed_headers;
#   - info.version = versions.api в ответе GET /meta (openapi.APIVersion);
#   - схемы ответов не запрещают дополнительные поля: следующие истории расширяют
#     ответы, и клиенты, собранные по этой версии, не должны ломаться;
#   - параметры пути и заголовков описаны прямо в операции (заголовки If-Match и
#     X-Planner-Client — якорями YAML, второй раз — ссылкой `*`) и через
#     `content: text/plain`, а не `schema`: oapi-codegen передаёт их хендлеру
#     строкой как есть (у `$ref` на components.parameters он генерирует
#     несобираемый именованный тип), без пакета
#     github.com/oapi-codegen/runtime (новая зависимость Go — только с согласия
#     владельца); разбор и отказы (428, 412, 404) — в хендлерах. По той же
#     причине поля `format: uuid` отображаются на github.com/google/uuid
#     (`x-go-type`), а не на openapi_types из runtime.
#
# История 1.1: GET /meta. История 1.2 (ADR-03 §Аутентификация, AD-10, AD-31):
# каждый путь — под JWT CRM конечного пользователя (401 без токена, в том числе
# /meta), право planner.access на всём, кроме /meta, «View As» — 403 на всём,
# кроме /meta; /meta отвечает `available` для этого человека; GET /me;
# административный API выключателя и списка подготовки с If-Match и ETag.
# История 1.4 (AD-12): GET /people — выбор людей из зеркала оргструктуры CRM
# (поиск по ФИО, сильный ETag списка и If-None-Match → 304); возраст снимка
# оргструктуры в /meta. Cache-Control ставит группа маршрутов: `private, no-cache`
# у 2xx и 304 с ETag, `private, no-store` у всего прочего; тело JSON-запроса
# больше 1 MiB — 413 `payload_too_large` до разбора.
# История 1.7 (AD-37, ADR-06 AA-30, ADR-03 AA-70): командная доска из шаблона —
# POST /boards (Idempotency-Key, право planner.boards.create), GET /boards (свои
# доски, ETag списка), GET /boards/{code} (карточка: конфигурация, участники,
# version, ETag версии, allowed_actions); код 409 `conflict`.
# История 3.3 (ADR-03 §Права, AD-37, PRD A-96, E-9, E-10): доски отделов с
# вычисленными участниками (руководитель отдела — админ, члены отдела — члены) и
# явными админами, членами и гостями — PUT и DELETE /boards/{code}/members/{user_id}
# под If-Match версии доски; у участника source, granted_as и not_in_department, у
# карточки org_snapshot_age_minutes; личная доска — первым GET /me (personal_board);
# роль board_guest.
# История 4.1 (ADR-05 AD-21, ADR-04 AA-78, E-68): событие календаря —
# POST /calendar-events (Idempotency-Key), GET и PATCH /calendar-events/{id}
# (If-Match), POST /calendar-events/{id}/cancel; видят только организатор и
# участники (прочим — 404, в том числе planner.admin), меняет и отменяет только
# организатор (участнику — 403).
# История 3.1 (AD-12, AD-41): административный путь снимка оргструктуры — GET
# /admin/org-snapshot (применённый снимок, кандидат эпохи, задержанный снимок,
# сверка) и команды planner.admin accept-epoch, apply-held и dismiss-candidate
# (журнал orgmirror.journal, 409 conflict с details.reason из закрытого списка).
# Правка куратора 26.09: карточки кандидата и задержанного снимка несут
# устойчивый card_id (отпечаток содержания) и seen; команды сверяют card_id, а не
# номер CRM (он растёт на каждый ответ), и берут последний сохранённый номер
# карточки — ответ команды называет его в `command`.
# История 4.1b (ADR-05 AD-21, CF-5, E-63): «+ Відділ» и «+ Група» — POST и PATCH
# /calendar-events принимают department_ids и group_ids; сервер раскрывает их в
# текущих активных людей зеркала оргструктуры и хранит в событии только людей;
# предел 200 — после раскрытия; параметр запроса dry_run=true отдаёт предпросмотр
# состава CalendarParticipantsPreview (200 без ETag, свой тип содержимого
# application/vnd.prionex.planner.participants-preview+json) и ничего не пишет;
# тело предпросмотра создания — CalendarEventCreateDryRun (без required);
# архивный или неизвестный отдел либо группа — 404 с details.field и details.ids.
# История 4.4 (ADR-05 AD-22, ADR-10 A-37): личная лента ICS — POST /me/ics-feed
# (выпуск: URL с токеном 256 бит один раз, в базе только SHA-256, повторный выпуск
# гасит прежнюю ленту; Idempotency-Key не принимается) и GET /ics/{token}.ics —
# единственный путь без JWT (text/calendar, только VEVENT событий владельца за
# −30…+180 дней; неизвестный и погашенный токен — один и тот же 404; HEAD — как
# GET без тела; предел 60/мин с адреса — 429 `rate_limited`); в /meta —
# ics_feed_available.
# История 1.8 (ADR-01 засев, ADR-03 «Команды задачи» AA-71, AA-70, ADR-04 AA-69):
# задача на доске — POST /boards/{code}/tasks (Idempotency-Key, номер «КОД-n» из
# счётчика доски), PATCH /tasks/{id} (If-Match; статус, причина, порядок в колонке
# и исполнители — единственная команда, пути /move нет), GET /boards/{code}/tasks
# (проекция карточки), GET /tasks/{id}, GET /tasks/resolve?key=, GET
# /tasks/{id}/history, GET /me/tasks?list=assigned; вычисляемые due_state,
# due_deadline_at, read_via и allowed_actions (словарь команд задачи).
# Версия 0.12.0 — 1.8 после мержа поверх 4.1 (0.5.0), 4.1b (0.8.0), 4.4 (0.9.0) и
# 3.1 (0.11.0), свои прежние 0.6.0 и 0.10.0: решение куратора — версия растёт
# монотонно по мере мержа PR.
# Версия 0.13.0 — 3.3 (участники досок, доски отделов, личная доска) после мержа
# поверх 1.8 (0.12.0).
# История 3.4 (AD-23, ADR-06 AA-30, FR-9, FR-10), версия 0.14.0: конфигурация доски
# целиком — PUT /boards/{code}/config под If-Match (статусы, поля семи типов,
# метки, шкала приоритетов из 3–5 уровней, типы задач с нормативом SLA, начальным
# статусом и исполнителем, умолчания доски; перенос задач из удаляемых статусов
# move_tasks_to); dry_run=true — превью BoardConfigPreview своим типом содержимого
# application/vnd.prionex.planner.board-config-preview+json без записи; GET
# /boards/{code}/history — журнал доски (created, member_changed, config_changed);
# событие planner.board.updated.
# История 3.4a (FR-49, AD-36, ADR-03 AA-56), версия 0.15.0: политика доски —
# GET/PUT /boards/{code}/policy (восемь ключей П-1…П-9 без П-5 с умолчанием
# шаблона, закреплением locked[] и editable; П-5 — производное notify_author,
# правится только PUT /config); dry_run=true — превью BoardPolicyPreview своим
# типом содержимого application/vnd.prionex.planner.board-policy-preview+json;
# BoardConfig.policy — только чтение, раздел policy в теле PUT /config — 400
# edit_via_policy; журнал доски policy_changed; planner.board.updated несёт
# data.board.policy.
# История 3.6 (FR-9, FR-10, FR-17, ADR-06), версия 0.16.0: задача целиком — тип,
# приоритет, метки, наблюдатели, значения полей доски, «Задача розробки», копия
# чек-листа; умолчания доски и типа при создании; обязательные поля (details.id);
# PATCH /tasks/{id} правит все поля; editable_fields[] (словарь TaskEditableField);
# TaskPerson.inactive; TaskOrigin.message_url объявлен заранее (заполняет 9.1);
# событие planner.task.updated. Новых путей нет, периметр Kong не меняется.
# Создание задачи ждёт лок доски (ShareBoard) и читает конфигурацию после него:
# параллельный PUT /config больше не даёт ему 409 board_config_changed, задача
# встаёт в новый статус по умолчанию (409 остаётся страховкой).
# TaskFieldValue.person не выводится, если человека поля нет в зеркале
# оргструктуры (crm_user_id у значения поля не хранится; ревью бота PR #20).
# История 3.14 (FR-13, FR-49 П-2, П-3, П-7, П-9, AD-36, AD-39), версия 0.17.0:
# заявки в другие отделы и их разбор. Задача не члена и не админа на доске с
# приёмом заявок — заявка: is_request, author_department_id (отдел автора на
# момент создания), тип заявки П-7 и статус доски по умолчанию; ключи разбора
# (assignee_ids, type_id, priority_id) у автора заявки — 400 triage_only (вместо
# 403 assignee_ids 0.15.0); Task и TaskCard несут is_request и needs_triage, Task —
# author_department_id; allowed_actions неразобранной заявки несёт triage тому, кто
# может её разбирать (разбор — обычный PATCH /tasks/{id}); автор заявки видит
# колонки доски только со своими задачами; GET /boards?can_create=true — доски, где
# актор создаёт задачу, и группа intake с досками для заявок; событие
# planner.task.unassigned_created. Новых путей нет, периметр Kong не меняется.
# История 3.11 (AD-18, AA-27, FR-24, FR-26), версия 0.18.0: `PUT /boards/{code}/tzid`
# (If-Match, `dry_run` → `BoardTzidPreview`,
# `application/vnd.prionex.planner.board-tzid-preview+json`) — смена часового пояса
# доски с пересчётом крайних моментов открытых задач со сроком-датой одной
# транзакцией; журнал доски `tzid_changed`, у пересчитанной задачи — строка
# `updated` с `due_deadline_at`; `due_state` — состояние только срока, просрочка в
# списках — по `least(срок, SLA-срок)`; периметр Kong не меняется.
# История 3.7 (FR-17, AR-31, ADR-04), версия 0.19.0: комментарии задачи — GET и POST
# /tasks/{id}/comments (Idempotency-Key), PATCH и DELETE
# /tasks/{id}/comments/{comment_id} (If-Match версии комментария, `*`);
# CommonMark без сырого HTML, упоминания <@UUID> только вне кода; упомянутые без
# доступа — mentioned_without_access[]; удаление мягкое; события
# planner.task.commented и planner.task.mentioned; следует за 0.18.0 (3.14, 3.11);
# периметр Kong не меняется (группа tasks).
# История 3.5 (ADR-06 AA-30, AD-36, FR-11, FR-49), версия 0.20.0: библиотека
# шаблонов — GET и POST /templates, GET и PUT /templates/{template_id} (dry_run —
# превью TemplatePreview своим типом содержимого
# application/vnd.prionex.planner.template-preview+json), POST
# /templates/{template_id}/archive и «Зберегти як шаблон» POST
# /boards/{code}/save-as-template (тег templates, группы Kong templates и boards
# уже есть). Право planner.templates.manage; список и шаблон — и с
# planner.boards.create (только неархивные). Тело шаблона — BoardConfigInput и
# BoardPolicyPut, как у PUT /boards/{code}/config и /policy; люди в шаблоне — 400
# person_in_template; 409 template_code_taken, template_archived (в том числе
# POST /boards из архивного шаблона), template_assigned. Действие доски
# save_as_template в allowed_actions. Журнал действий шаблона (object =
# template): created, updated, archived; событий нет. Следует за 0.19.0 (3.14,
# 3.11, 3.7).
# История 3.8 (FR-18, NFR-8, AD-29, AD-34, ADR-10), версия 0.21.0: вложения задачи
# до 50 МиБ — GET и POST /tasks/{id}/attachments, GET и DELETE
# /tasks/{id}/attachments/{attachment_id}. Загрузка — multipart/form-data (часть
# file, имя файла — только в теле, не в URL и не в заголовке запроса),
# Idempotency-Key; файл шифруется AES-256-GCM ключом файла, обёрнутым
# PLANNER_ATTACHMENT_KEK, выдача — только через API как вложение
# (Content-Disposition: attachment, nosniff, CSP sandbox), presigned-ссылок нет.
# Удаление мягкое (AD-30). Журнал задачи — attachment_added и attachment_deleted
# без имени файла; событие planner.task.attachment_changed. Новые пути — в
# группе tasks: периметр Kong и CORS не меняются. Нет PLANNER_ATTACHMENT_KEK —
# 503 feature_disabled. Следует за 0.20.0 (3.14, 3.11, 3.7, 3.5).
# История 3.9 (FR-19, NFR-10, ADR-01), версия 0.22.0: чек-лист задачи —
# POST /tasks/{id}/checklist (добавить пункт в конец), PATCH и DELETE
# /tasks/{id}/checklist/{item_id} (отметить и переставить, удалить) под If-Match
# версии задачи (у POST `*` не принимается — 428); ответ — Task с новой версией;
# Task.checklist_progress и TaskCard.checklist_progress («отмечено / всего»);
# checklist — последний в словаре TaskEditableField (право на команды чек-листа).
# Периметр Kong не меняется: пути под группой tasks. Следует за 0.21.0 (3.14,
# 3.11, 3.7, 3.5, 3.8).
openapi: 3.0.3
info:
  title: Prionex Planner API
  version: 0.22.0
  description: >-
    Планер Prionex — единственная система учёта рабочих задач, досок и календаря.
    Каждый запрос идёт под JWT CRM конечного пользователя (Authorization: Bearer),
    кроме `GET /ics/{token}.ics` (AD-22).
    Ошибки приходят в едином конверте Error; клиенты локализуют сообщение по `code`,
    `message` — для разработчика.
servers:
  - url: /api/v1/planner
security:
  - bearerAuth: []
tags:
  - name: meta
    description: Состояние планера для клиентов
  - name: me
    description: Текущий пользователь
  - name: people
    description: Люди из зеркала оргструктуры CRM
  - name: boards
    description: Доски задач — создание, список своих досок, карточка доски, участники
  - name: templates
    description: >-
      Библиотека шаблонов досок — список, шаблон, создание, правка, архив и
      «Зберегти як шаблон» с доски (планер: planner.templates.manage; список и
      шаблон для мастера доски — и с planner.boards.create)
  - name: tasks
    description: >-
      Задачи досок — создание, смена статуса, порядка и исполнителей одной командой
      PATCH, чтение по UUID и по ключу «КОД-n», история, «Поставлені мені»
  - name: calendar
    description: >-
      События календаря — создание, чтение одного события, правка и отмена
      (видят только организатор и участники); выпуск личной ленты ICS
  - name: ics
    description: >-
      Личная лента ICS для внешнего календаря — единственный путь без JWT (токен
      в пути, AD-22)
  - name: admin
    description: >-
      Выключатель planner.mode, список подготовки и снимок оргструктуры (права
      planner.access и planner.admin; сначала проверяется planner.access)
paths:
  /meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Режим планера, доступность для пользователя, версии и флаги модулей
      description: >-
        Под любым валидным JWT CRM, без права planner.access и при любом положении
        выключателя; токен «View As» получает 200 с available=false и
        reason=view_as. Нет строки planner.mode в platform.feature_flags — режим
        `off`. Ошибка чтения флагов — 503 `feature_disabled`; ошибка чтения
        состояния синка оргструктуры — 200 с org_snapshot_age_minutes = null.
        Ответ не кэшируется (Cache-Control: private, no-store).
      responses:
        "200":
          description: Состояние планера для этого пользователя
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Текущий пользователь, его права planner.* и личная доска
      description: >-
        Проходит право planner.access и выключатель. Первый вызов создаёт личную
        доску (E-9, E-10): код — от генератора AD-37 по фамилии и имени из зеркала
        оргструктуры, видна только владельцу; это единственный записанный
        побочный эффект GET (журнал действий и событие planner.board.created,
        клиент — из X-Planner-Client). Повторный вызов второй доски не создаёт.
        Создать доску не удалось (человека нет в зеркале, кандидаты кода
        кончились, сбой) — personal_board = null, а не ошибка. Ответ не
        кэшируется.
      parameters:
        - &xPlannerClient
          name: X-Planner-Client
          in: header
          required: false
          description: >-
            Клиент, который делает изменение: `crm`, `hub-web` или `hub-mobile`. В
            журнал действий идёт значение из этого списка, всё прочее и отсутствие
            заголовка — `unknown`.
          content:
            text/plain:
              schema:
                type: string
      responses:
        "200":
          description: Текущий пользователь
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /people:
    get:
      operationId: getPeople
      tags: [people]
      summary: Поиск людей по ФИО для выбора исполнителя
      description: >-
        Проходит право planner.access и выключатель. Только активные сотрудники
        зеркала оргструктуры CRM (уволенных и неактивных нет), подстрока ФИО без
        учёта регистра (украинские и русские буквы, ё = е, апострофы приведены), не
        больше 20 элементов: сначала совпадения с начала слова, затем по ФИО и
        crm_user_id. Отделы человека — по всем его проектам CRM. До первого
        применённого снимка — пустой список. Ответ несёт сильный ETag (хеш тела):
        совпавший If-None-Match — 304 без тела. Cache-Control: private, no-cache.
      parameters:
        - name: q
          in: query
          required: true
          description: >-
            Строка поиска: после trim от 2 до 100 символов, иначе 400 `validation`
            с details.field = q.
          content:
            text/plain:
              schema:
                type: string
                minLength: 2
                maxLength: 100
        - name: If-None-Match
          in: header
          required: false
          description: >-
            ETag прежнего ответа (список через запятую, `*`, префикс W/ снимается —
            слабое сравнение RFC 9110). Совпал — 304 без тела.
          content:
            text/plain:
              schema:
                type: string
      responses:
        "200":
          description: Найденные люди
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ListETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeopleList"
        "304":
          description: Список не изменился (If-None-Match совпал); тела нет
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ListETag"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /admin/flags/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: Имя флага; административный API знает только `planner.mode`, прочее — 404.
        content:
          text/plain:
            schema:
              type: string
    get:
      operationId: getAdminFlag
      tags: [admin]
      summary: Значение и версия флага (только planner.mode)
      description: >-
        Права planner.access и planner.admin (сначала проверяется planner.access);
        вне выключателя. Строки флага нет — value `off`, version 0. ETag — версия для If-Match.
      responses:
        "200":
          $ref: "#/components/responses/Flag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putAdminFlag
      tags: [admin]
      summary: Переключить planner.mode
      description: >-
        Права planner.access и planner.admin (сначала проверяется planner.access);
        вне выключателя. If-Match обязателен: нет — 428
        `precondition_required`, устаревшая версия — 412 `revision_mismatch` с
        details.current. Версия 0 — вставка строки с версией 1, иначе версия + 1.
        Каждое изменение пишется в журнал действий platform.journal той же
        транзакцией (клиент — из X-Planner-Client, прочее — unknown).
      parameters:
        - &ifMatch
          name: If-Match
          in: header
          required: false
          description: >-
            Версия объекта из ETag в кавычках (`"3"`). Обязателен на изменении: нет —
            428 `precondition_required`, не совпал — 412 `revision_mismatch`.
          content:
            text/plain:
              schema:
                type: string
        - *xPlannerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagUpdate"
      responses:
        "200":
          $ref: "#/components/responses/Flag"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /admin/prep-access:
    get:
      operationId: getPrepAccess
      tags: [admin]
      summary: Список подготовки
      description: >-
        Люди, которые работают с API при planner.mode = prep (кроме держателей
        planner.admin). Права planner.access и planner.admin (сначала
        проверяется planner.access); вне выключателя. ETag — версия
        списка для If-Match (0 — список ни разу не задавался).
      responses:
        "200":
          $ref: "#/components/responses/PrepAccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putPrepAccess
      tags: [admin]
      summary: Заменить список подготовки целиком
      description: >-
        Права planner.access и planner.admin (сначала проверяется planner.access);
        вне выключателя. Тело — crm_user_ids (целые > 0, без
        дублей, не больше 500). If-Match по версии списка: нет — 428, устаревшая —
        412 с details.current. Изменение пишется в журнал действий той же
        транзакцией.
      parameters:
        - *ifMatch
        - *xPlannerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepAccessUpdate"
      responses:
        "200":
          $ref: "#/components/responses/PrepAccess"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /admin/org-snapshot:
    get:
      operationId: getOrgSnapshot
      tags: [admin]
      summary: Снимок оргструктуры — применённый, кандидат эпохи, задержанный, сверка
      description: >-
        Права planner.access и planner.admin (сначала проверяется planner.access);
        вне выключателя. Применённый снимок (эпоха и номер, generated_at, время и
        возраст применения, активные люди, отделы и проекты зеркала, коды
        проектов) рядом с карточкой кандидата новой эпохи (снимок с номером
        меньше применённого: счётчики и коды проектов, без персональных данных) —
        по ней planner.admin отличает восстановление той же базы CRM от
        пересоздания; карточка задержанного снимка (массовая деактивация людей
        или пропажа отделов); последняя ночная сверка. Ответ не кэшируется.
      responses:
        "200":
          description: Состояние снимка оргструктуры
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSnapshotStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /admin/org-snapshot/accept-epoch:
    post:
      operationId: acceptOrgSnapshotEpoch
      tags: [admin]
      summary: Принять кандидата новой эпохи снимка оргструктуры
      description: >-
        Права planner.access и planner.admin; вне выключателя. Кандидата не
        применяет: эпоха +1, пол эпохи — номер кандидата, ожидание первого снимка
        эпохи (он применяется, даже если его номер меньше прежнего применённого;
        защиты массовых изменений для него меряются от карточки кандидата),
        сброс подтверждения таблицы засева досок отделов; будит опрос CRM.
        card_id — карточка, которую видел человек (If-Match по card_id): пока
        опрос приносит снимок того же содержания, карточка обновляется на месте
        (номер растёт, card_id прежний) и команда проходит, полом эпохи
        становится последний сохранённый номер карточки; другое содержание —
        новый card_id и 409 `candidate_moved`. Пишет orgmirror.journal той же
        транзакцией. На PROD команду подают только по решению владельца PROD
        (AD-41). Ответ 200 — состояние целиком и `command` (card_id и взятый
        номер).
      parameters:
        - *xPlannerClient
      requestBody:
        required: true
        description: >-
          JSON-объект {card_id, reason} без лишних полей, не больше 64 KiB. Тело
          длиннее 64 KiB, неверный JSON, лишнее поле или хвост после объекта —
          400 `validation` с details.field = `body`; поле неверного типа или
          значения — 400 с details.field = имя поля. 413 — только тело больше
          общего предела 1 MiB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptEpochRequest"
      responses:
        "200":
          $ref: "#/components/responses/OrgSnapshot"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/OrgSnapshotConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /admin/org-snapshot/apply-held:
    post:
      operationId: applyOrgSnapshotHeld
      tags: [admin]
      summary: Применить задержанный снимок оргструктуры
      description: >-
        Права planner.access и planner.admin; вне выключателя. Применяет ровно
        сохранённый задержанный снимок карточки, которую видел человек, без
        порогов массовой деактивации и пропажи отделов; ушедшие люди получают
        событие planner.person.deactivated (cause `apply_held`). card_id —
        If-Match по карточке: пока опрос приносит снимок с тем же множеством
        ставших бы отсутствующими людей, отделов и групп (у первого снимка эпохи
        opens_epoch — и того же содержания), карточка и снимок обновляются на
        месте (card_id прежний) и применяется последний сохранённый; другое —
        новый card_id и 409 `held_moved`. Первый снимок эпохи без людей или
        членств не применяется — 409 `degenerate_held`. Пишет orgmirror.journal
        той же транзакцией. Ответ 200 — состояние целиком и `command` (card_id и
        применённый номер).
      parameters:
        - *xPlannerClient
      requestBody:
        required: true
        description: >-
          JSON-объект {card_id, reason} без лишних полей, не больше 64 KiB. Тело
          длиннее 64 KiB, неверный JSON, лишнее поле или хвост после объекта —
          400 `validation` с details.field = `body`; поле неверного типа или
          значения — 400 с details.field = имя поля. 413 — только тело больше
          общего предела 1 MiB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyHeldRequest"
      responses:
        "200":
          $ref: "#/components/responses/OrgSnapshot"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/OrgSnapshotConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /admin/org-snapshot/dismiss-candidate:
    post:
      operationId: dismissOrgSnapshotCandidate
      tags: [admin]
      summary: Снять карточку кандидата новой эпохи
      description: >-
        Права planner.access и planner.admin; вне выключателя. Стирает карточку
        кандидата (If-Match по card_id: другое содержание — 409
        `candidate_moved`, карточки нет — 409 `no_candidate`); эпоха, ожидание
        эпохи, задержанный снимок и зеркало не меняются, опрос CRM будится и
        идёт обычным ходом — если CRM снова отдаст номер меньше применённого,
        карточка появится заново. Пишет orgmirror.journal той же транзакцией
        (было — сводка карточки только счётчиками). Ответ 200 — состояние
        целиком и `command` (card_id и номер снятой карточки).
      parameters:
        - *xPlannerClient
      requestBody:
        required: true
        description: >-
          JSON-объект {card_id, reason} без лишних полей, не больше 64 KiB. Тело
          длиннее 64 KiB, неверный JSON, лишнее поле или хвост после объекта —
          400 `validation` с details.field = `body`; поле неверного типа или
          значения — 400 с details.field = имя поля. 413 — только тело больше
          общего предела 1 MiB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissCandidateRequest"
      responses:
        "200":
          $ref: "#/components/responses/OrgSnapshot"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/OrgSnapshotConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /boards:
    get:
      operationId: listBoards
      tags: [boards]
      summary: Доски, где пользователь — участник (с can_create=true — где он создаёт задачу или заявку)
      description: >-
        Проходит право planner.access и выключатель. Неархивные доски, где актор —
        участник: явный (board_admin, board_member или board_guest) или вычисленный
        (руководитель или член отдела доски отдела), и его личная доска, по коду
        доски; у каждой — роль актора и allowed_actions карточки. С can_create=true
        (история 3.14) items — только доски, где актор создаёт задачу как член, админ
        или владелец личной (в allowed_actions есть create_task); доски, где он явный
        гость или не участник, но есть приём заявок (intake_open), — в отдельной группе
        intake (доски отделов и командные, без личных и архивных, по коду) с названием
        отдела, подсказкой П-9 и обязательными полями формы заявки. Без параметра и при
        can_create=false ответ прежний (без intake). Без пагинации: курсор (cursor,
        next_cursor) добавится аддитивно. Ответ несёт сильный ETag (хеш тела):
        совпавший If-None-Match — 304 без тела. Cache-Control: private, no-cache.
      parameters:
        - name: can_create
          in: query
          required: false
          description: >-
            true — выбор доски для новой задачи (история 3.14): items — доски, где актор
            создаёт задачу как член, админ или владелец личной, intake — доски для
            заявок. false, пустое значение (`?can_create=`) или нет параметра — прежний
            список досок участника. Другое значение или повторённый параметр — 400,
            details.field = can_create.
          content:
            text/plain:
              schema:
                type: boolean
        - name: If-None-Match
          in: header
          required: false
          description: >-
            ETag прежнего ответа (список через запятую, `*`, префикс W/ снимается —
            слабое сравнение RFC 9110). Совпал — 304 без тела.
          content:
            text/plain:
              schema:
                type: string
      responses:
        "200":
          description: Доски актора
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ListETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardList"
        "304":
          description: Список не изменился (If-None-Match совпал); тела нет
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ListETag"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createBoard
      tags: [boards]
      summary: Создать командную доску из шаблона
      description: >-
        Право planner.boards.create (нет — 403 `forbidden` до чтения тела). Вид —
        только `team`: `department` — 403 (доску отдела создаёт сверка оргструктуры),
        `personal` и отсутствие вида — 400 (details.field = kind). Код — ^[A-Z]{2,10}$
        (иначе 400, details.field = code), уникален навсегда: занят любой доской, в
        том числе архивной, — 409 `conflict` с details.reason = board_code_taken, в
        резерве засева отделов — 409 с details.reason = board_code_reserved.
        Конфигурация — копия шаблона template_code с новыми id статусов и типов
        (нет шаблона — 400, details.field = template_code; шаблон в архиве — 409
        `conflict` с details.reason = template_archived; конфигурация шаблона в
        базе нарушает инварианты — 500 `internal` без details: сбой сервера, не
        ошибка запроса). Создатель — админ
        доски (board_admin), люди из member_ids (активные в зеркале оргструктуры;
        иначе 400, details.field = member_ids) — члены (board_member). Доска,
        участники, строка журнала действий и событие planner.board.created пишутся
        одной транзакцией. Idempotency-Key (UUID) обязателен: нет или не UUID — 400
        (details.field = Idempotency-Key); повтор с тем же ключом и телом — тот же
        ответ 201 (хранится 24 ч, только 2xx), тот же ключ с другим телом — 409
        `conflict` с details.reason = idempotency_key_reused; ответ 4xx ключ не
        занимает.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            UUID команды от клиента (ненулевой). Уникален на человека; повтор с тем же
            телом отдаёт сохранённый ответ.
          content:
            text/plain:
              schema:
                type: string
        - *xPlannerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardCreate"
      responses:
        "201":
          description: Доска создана (или сохранённый ответ повтора с тем же ключом)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /boards/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: Код доски (^[A-Z]{2,10}$); иной код — 404.
        content:
          text/plain:
            schema:
              type: string
    get:
      operationId: getBoard
      tags: [boards]
      summary: Карточка доски — конфигурация, участники, версия, allowed_actions
      description: >-
        Проходит право planner.access и выключатель. Видят участник доски любой
        роли и держатель planner.admin (личную доску — только владелец); прочим, как
        и несуществующей доске, — 404 `not_found`. ETag — версия доски (для If-Match
        будущих изменений); If-None-Match здесь нет: allowed_actions меняются без
        смены версии. Cache-Control: private, no-cache.
      responses:
        "200":
          description: Карточка доски
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /boards/{code}/members/{user_id}:
    parameters:
