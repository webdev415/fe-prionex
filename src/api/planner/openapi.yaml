        planner.boards.create без planner.templates.manage — только неархивные
        (мастер новой доски); без обоих — 403 `forbidden`. Сводки по коду шаблона:
        статусы (имя и категория), число типов задач и типов с нормативом SLA;
        полная конфигурация — GET /templates/{template_id}. Без пагинации. Ответ
        несёт сильный ETag (хеш тела): совпавший If-None-Match — 304 без тела.
      parameters:
        - name: If-None-Match
          in: header
