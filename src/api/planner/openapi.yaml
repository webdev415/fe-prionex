              type: string
    get:
      operationId: getBoardHistory
      tags: [boards]
      summary: История доски — создание, участники, конфигурация
      description: >-
        Видит тот, кому видна карточка доски (участник любой роли, planner.admin;
        личную доску — только владелец), прочим — 404. Строки журнала действий
        доски по времени: created (after — срез доски), member_changed (before/after
        — роль участника), config_changed (before/after — срезы конфигурации; по at
        строки считается момент смены режима SLA статуса), policy_changed
        (before/after — только изменённые ключи политики), tzid_changed (before
        {tzid}, after {tzid, recomputed_tasks} — смена пояса PUT
        /boards/{code}/tzid). Не больше 500 последних
        строк: truncated = true — более ранние не отданы. Ответ несёт сильный ETag
        (хеш тела): совпавший If-None-Match — 304 без тела.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: >-
            ETag прежнего ответа (список через запятую, `*`, префикс W/ снимается —
            слабое сравнение RFC 9110). Совпал — 304 без тела.
          content:
            text/plain:
              schema:
                type: string
      responses:
        "200":
          description: История доски
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ListETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardHistory"
        "304":
          description: История не изменилась (If-None-Match совпал); тела нет
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ListETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /boards/{code}/save-as-template:
    parameters:
      - name: code
