  /calendar-events:
    post:
      operationId: createCalendarEvent
      tags: [calendar]
      summary: Создать событие календаря
      description: >-
        Проходит право planner.access и выключатель; создатель — организатор. Вид
        (kind) — только подпись: meeting, one_on_one, briefing («нарада»), event
        («Подія»), reminder («Нагадування»), other; правила видимости, уведомлений и
        отмены у всех видов одни, событие любого вида может быть без участников.
        Время — ровно одна форма: starts_at < ends_at (моменты RFC 3339) либо
        all_day = true и start_date < end_date (даты YYYY-MM-DD, end_date в событие
        не входит); tzid — имя IANA (поля нет — Europe/Kyiv). reminder_minutes — 0,
        5, 15, 30 или 60, null — «нет», поля нет — 15. Участники — participant_ids:
        дубли схлопываются, организатор из списка выпадает, после этого не больше
        200 (иначе 400, details.field = participant_ids, details.reason =
        too_many_participants, details.limit = 200); человек не active в зеркале
        оргструктуры или неизвестный — 400 с details.reason = inactive_participant
        и details.user_ids. Описание — подмножество CommonMark без сырого HTML.
        Нарушение формы — 400 `validation` с details.field (неизвестное поле тела,
        в том числе copied_from_id, — тоже 400). Событие, участники, строка журнала
        и факт planner.calendar_event.created (получатели — участники, invited)
        пишутся одной транзакцией. Idempotency-Key (UUID) обязателен: нет, не UUID
        или нулевой — 400 (details.field = Idempotency-Key); повтор с тем же ключом
        и телом — тот же ответ 201 (хранится 24 ч, только 2xx), тот же ключ с другим
        телом — 409 `conflict` с details.reason = idempotency_key_reused; ответ 4xx
        ключ не занимает.
        «+ Відділ» и «+ Група» (4.1b): department_ids и group_ids (до 50 id в каждом
        массиве) сервер раскрывает в текущих активных людей зеркала оргструктуры на
        момент команды; событие хранит только людей (кто придёт в отдел позже, в
        событие сам не попадает); состав = participant_ids ∪ люди всех единиц, дубли
        схлопываются, организатор выпадает, добавленные получают invited. Предел 200
        проверяется после раскрытия: больше — 400, details.field = participant_ids,
        details.reason = too_many_participants, details.limit = details.max = 200,
        details.count — размер состава, details.sources[] {kind, id, count} — число
        активных людей каждой единицы без организатора (как в составе; без единиц —
        []). Отдел или группа не найдены
        или архивные (у группы — и при архивном отделе) — 404 `not_found` с
        details.field (department_ids, если не найден хоть один отдел, иначе
        group_ids) и details.ids (по возрастанию). Порядок отказов: dry_run не true
        и не false или повторён — 400 → ключ и тело — 400 → форма — 400 → повтор с
        тем же ключом (сохранённый ответ без раскрытия, даже если отдел с тех пор
        изменился) или 409 ключа → 404 единицы → предел и неактивные — 400 →
        запись. После предпросмотра форма отправляет итоговый список только в
        participant_ids, без department_ids/group_ids: единицы в команде
        раскрываются заново и возвращают снятых вручную. department_ids/group_ids в
        команде без dry_run — «добавить весь отдел как есть».
        Тело: без dry_run — CalendarEventCreate (required kind и title проверяются,
        иначе 400); с dry_run=true — CalendarEventCreateDryRun (required нет, сервер
        читает только участников). OpenAPI 3.0 не выбирает схему тела по параметру
        запроса, поэтому anyOf по сути равен CalendarEventCreateDryRun: валидатор
        и сгенерированный клиент пропустят и {} без dry_run, а сервер ответит 400.
        Настоящее создание клиенты (5.14, 7.4) типизируют как CalendarEventCreate.
        Ответ предпросмотра — 200 с типом содержимого
        application/vnd.prionex.planner.participants-preview+json (схема
        CalendarParticipantsPreview), создание — 201 application/json.
      parameters:
        - &dryRun
          name: dry_run
          in: query
          required: false
          description: >-
            true — предпросмотр состава для формы (4.1b): ответ 200
            CalendarParticipantsPreview без ETag с типом содержимого
            application/vnd.prionex.planner.participants-preview+json (тип выбирает
            dry_run, заголовок Accept не нужен), ничего не пишется (ни события, ни
            журнала, ни outbox, ни ключа идемпотентности). При dry_run=true сервер не
            проверяет required и поля, кроме участников; клиент может прислать только
            participant_ids/department_ids/group_ids (у создания — тело
            CalendarEventCreateDryRun). Проверяются строгий разбор тела
            и состав: UUID массивов, 404 единицы, предел, неактивные среди
            добавляемых. Значения — true или false; параметра нет или он пуст —
            false; другое значение или повторённый параметр — 400, details.field =
            dry_run первым отказом обработчика (до проверки формы Idempotency-Key,
            If-Match и тела; отсутствующий или повторённый заголовок отклоняет
            обёртка раньше).
          content:
            text/plain:
              schema:
                type: string
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            UUID команды от клиента (ненулевой). Уникален на человека; повтор с тем же
            телом отдаёт сохранённый ответ. С dry_run=true обязателен и проверяется
            на форму, но не читается и не занимается: тот же ключ годится для
            настоящего создания.
          content:
            text/plain:
              schema:
                type: string
        - *xPlannerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # Тело выбирает dry_run: CalendarEventCreate — создание,
              # CalendarEventCreateDryRun — предпросмотр (без required). x-go-type:
              # oapi-codegen собрал бы из anyOf объединение на пакете
              # github.com/oapi-codegen/runtime (правило шапки); тело разбирает
              # хендлер. encoding/json генератор импортирует сам (x-go-type-import
              # дал бы повторный импорт).
              x-go-type: json.RawMessage
              anyOf:
                - $ref: "#/components/schemas/CalendarEventCreate"
                - $ref: "#/components/schemas/CalendarEventCreateDryRun"
      responses:
        "200":
          description: >-
            Предпросмотр состава (только dry_run=true); ничего не записано, ETag нет
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/vnd.prionex.planner.participants-preview+json:
              schema:
                $ref: "#/components/schemas/CalendarParticipantsPreview"
        "201":
          description: Событие создано (или сохранённый ответ повтора с тем же ключом)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /calendar-events/{id}:
    parameters:
      - &calendarEventID
        name: id
        in: path
        required: true
        description: UUID события; не UUID — 404.
        content:
          text/plain:
            schema:
              type: string
    get:
      operationId: getCalendarEvent
      tags: [calendar]
      summary: Событие календаря
      description: >-
        Проходит право planner.access и выключатель. Видят только организатор и
        участники; прочим — в том числе planner.admin и руководителю отдела
        участника, — как и несуществующему событию, 404 `not_found`. ETag — версия
        для If-Match; If-None-Match здесь нет: имена и never_logged_in участников
        меняются без смены версии. Cache-Control: private, no-cache.
      responses:
        "200":
          description: Событие
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCalendarEvent
      tags: [calendar]
      summary: Изменить событие календаря
      description: >-
        Только организатор; участнику — 403 `forbidden`, прочим — 404. Частичная
        правка: поля тела те же, что у создания, участников participant_ids заменяет
        целиком. Поля времени (all_day, starts_at, ends_at, start_date, end_date) —
        одна группа: есть хоть одно — присылается полная форма (обе границы, у «весь
        день» — all_day: true), иначе 400 с details.field первого недостающего
        поля; смена формы обнуляет поля прежней; tzid меняется отдельно.
        Неактивный человек — 400 только среди добавляемых. Порядок отказов: id не
        UUID — 404 → нет If-Match — 428 → тело не разбирается (не JSON-объект,
        лишнее поле, поле не того типа) — 400, всё это до базы → событие не видно —
        404 → актор участник — 403 → устаревшая версия — 412 `revision_mismatch` с
        details.current и ETag текущей версии → отменённое событие — 409 `conflict`
        с details.reason = event_cancelled → прочие 400 validation. Посторонний без
        If-Match получает 428, а не 404: существование события так не раскрывается.
        Версия растёт на 1,
        журнал и факт planner.calendar_event.updated (data.change — time, place,
        participants, other) пишутся одной транзакцией; правка, которая ничего не
        меняет, — 200 с текущим представлением без роста версии.
        «+ Відділ» и «+ Група» (4.1b): department_ids и group_ids раскрываются в
        текущих активных людей; с participant_ids новый состав = participant_ids ∪
        раскрытые, без participant_ids — текущий состав ∪ раскрытые (кнопка только
        добавляет; все уже участники — 200 без роста версии); добавленные получают
        invited. Предел и 404 единицы — как у создания. Порядок отказов: dry_run не
        true и не false или повторён — 400 → id не UUID — 404 → нет If-Match — 428 →
        тело — 400 → событие не видно — 404 → участник — 403 → отдел или группа не
        найдены — 404 (details.field, details.ids) → 412 → 409 → прочие 400 (в том
        числе не UUID, нулевой или больше 50 id в department_ids/group_ids: тогда
        единицы не раскрываются). С dry_run=true — тот же порядок (версия — по
        снимку первого чтения), ответ 200 CalendarParticipantsPreview без ETag:
        итоговый состав без организатора, оставшиеся участники не active — со своим
        статусом; прочие поля тела не проверяются и не применяются, ничего не
        пишется, версия не растёт. Ответ 200 различается типом содержимого, его
        выбирает dry_run: правка — application/json, CalendarEvent с ETag;
        предпросмотр — application/vnd.prionex.planner.participants-preview+json,
        CalendarParticipantsPreview без ETag. Клиенты (5.14, 7.4) фиксируют тип
        содержимого правки (openapi-fetch — createClient<paths, "application/json">),
        иначе data ответа 200 — объединение CalendarEvent | CalendarParticipantsPreview;
        предпросмотр — отдельный вызов со своим типом. После предпросмотра форма
        отправляет итоговый список только в participant_ids, без
        department_ids/group_ids: единицы в команде раскрываются заново и
        возвращают снятых вручную. department_ids/group_ids в команде без dry_run —
        «добавить весь отдел как есть».
      parameters:
        - *dryRun
        - *ifMatch
        - *xPlannerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventPatch"
      responses:
        "200":
          description: >-
            Без dry_run — событие после правки (application/json, ETag — версия); с
            dry_run=true — предпросмотр состава
            (application/vnd.prionex.planner.participants-preview+json, без ETag,
            ничего не записано). Тип содержимого выбирает только dry_run.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              description: >-
                Версия события в кавычках (`"3"`) — значение для If-Match. Только у
                ответа application/json (правка); у предпросмотра ETag нет.
              schema:
                type: string
                pattern: '^"[0-9]+"$'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
            application/vnd.prionex.planner.participants-preview+json:
              schema:
                $ref: "#/components/schemas/CalendarParticipantsPreview"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /calendar-events/{id}/cancel:
    parameters:
      - *calendarEventID
    post:
      operationId: cancelCalendarEvent
      tags: [calendar]
      summary: Отменить событие календаря
      description: >-
        Только организатор; участнику — 403, прочим — 404. Тело пустое или `{}`,
        любое поле, null или не объект — 400. Порядок отказов: id не UUID — 404 →
        нет If-Match — 428 → тело не пусто и не `{}` — 400, всё это до базы →
        событие не видно — 404 → актор участник — 403 → устаревшая версия — 412
        `revision_mismatch` → уже отменённое — 409 `conflict` с details.reason =
        event_cancelled. Посторонний без If-Match получает 428, а не 404. Статус —
        cancelled, версия растёт на 1, allowed_actions пуст; журнал и факт
        planner.calendar_event.cancelled (получатели — участники) пишутся одной
        транзакцией.
      parameters:
