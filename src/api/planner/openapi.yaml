      summary: Архивировать шаблон (только вперёд)
      description: >-
        Право planner.templates.manage (нет — 403). Нет шаблона — 404; уже в архиве —
        409 template_archived; If-Match обязателен: нет — 428, устаревшая или кривая
        версия — 412 с details.current (шаблон); шаблон назначен виду доски (личные
        доски) — 409 template_assigned. Успех — archived_at, версия +1, строка
        журнала действий archived одной транзакцией. Из архивного шаблона доски не
        создаются (POST /boards — 409 template_archived), уже созданные доски не
        меняются; разархивирования нет. Тела нет.
      parameters:
        - *ifMatch
        - *xPlannerClient
      responses:
        "200":
          $ref: "#/components/responses/Template"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /boards/{code}/tasks:
    parameters:
      - name: code
        in: path
        required: true
        description: Код доски (^[A-Z]{2,10}$); иной код — 404.
        content:
          text/plain:
            schema:
              type: string
    get:
      operationId: listBoardTasks
      tags: [tasks]
      summary: Задачи доски — проекция карточки по колонкам
      description: >-
        Проходит право planner.access и выключатель. Видят участник доски любой
        роли и держатель planner.admin (личную доску — только владелец). Не
        участник, у которого на доске есть своя живая заявка (история 3.14), видит
        колонки в гостевом виде — только задачи со своей связью (автор,
        исполнитель, наблюдатель) — на не личной и не архивной
        доске (приём заявок для этого не нужен). Прочим, как и несуществующей
        доске, — 404 `not_found`. Член доски видит карточки по member_visibility:
        при own_and_intake — задачи со своей связью, а если он разбирает заявки (triage_by =
        admins_and_members), то и неразобранные заявки доски. Живые задачи доски: открытые и
        закрытые за 7 дней, по позиции статуса, затем по порядку в колонке, затем
        по id (позиция в ответ не отдаётся — порядок списка и есть порядок). У
        каждой карточки — allowed_actions актора. Не больше limit карточек (1–500,
        по умолчанию 200; иное — 400, details.field = limit); has_more = true —
        за пределом limit на доске есть ещё задачи. Предел общий на всю доску, а
        не на колонку: список режется в порядке колонок, поэтому на доске больше
        limit задач правые колонки урезаются первыми (вплоть до пустых). Курсор
        (keyset) — история 3.21, добавится аддитивно; до него сервер режет ответ
        по limit. Ответ
        несёт сильный ETag (хеш тела): совпавший If-None-Match — 304 без тела.
        Cache-Control: private, no-cache.
      parameters:
        - &listLimit
          name: limit
          in: query
          required: false
          description: >-
            Наибольшее число карточек в ответе: целое 1–500 без знака и ведущих
            нулей, по умолчанию 200 (параметра нет); иное, в том числе пустое
            значение (`?limit=`), — 400 `validation` с details.field = limit.
            Курсора нет до истории 3.21.
          content:
            text/plain:
              schema:
                type: integer
                minimum: 1
                maximum: 500
                default: 200
        - &ifNoneMatch
          name: If-None-Match
          in: header
          required: false
          description: >-
            ETag прежнего ответа (список через запятую, `*`, префикс W/ снимается —
            слабое сравнение RFC 9110). Совпал — 304 без тела.
          content:
            text/plain:
              schema:
                type: string
      responses:
        "200":
          description: Карточки задач доски (не больше limit)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ListETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCardList"
        "304":
          description: Список не изменился (If-None-Match совпал); тела нет
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ListETag"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Создать задачу на доске
      description: >-
        Задачу создаёт участник доски (член или админ); на доске с приёмом
        заявок (intake_open политики доски; у доски отдела — всегда, в том числе
        у доски без строки политики, FR-13, A-100) — любой обладатель
        planner.access. Не участнику доски без приёма заявок — 403 `forbidden`,
        нет доски или она не видна — 404. Задача не члена и не админа (явный гость,
        не участник, planner.admin без участия) на не личной доске — заявка
        (история 3.14): is_request = true, author_department_id — отдел автора на
        момент создания, тип — тип заявки политики доски (intake_default_type, иначе
        тип доски по умолчанию), статус — статус доски по умолчанию (начальный статус
        типа у заявки не применяется), приоритет и исполнитель — по умолчанию.
        Автор заявки, который передаёт assignee_ids (в том числе []), type_id или
        priority_id (в том числе null), — 400 `validation` с details.field = ключ и
        details.reason = triage_only (исполнителя, тип и приоритет заявки выбирает
        разбирающий, FR-13); эта проверка идёт раньше правил состава исполнителей и
        полей ниже. Задача участника
        создаётся в статусе по умолчанию с номером «КОД-n» из счётчика доски;
        постоянная ссылка клиента — planning/t/{key}. Название обязательно (1–300
        символов после обрезки пробелов), описание — до 20 000 символов,
        CommonMark без сырого HTML (details.reason = raw_html), упоминание — токен
        <@UUID>; 0–10 исполнителей из активных участников доски — явных и, на доске
        отдела, руководителя и членов отдела (иначе 400, details.field =
        assignee_ids); на личной доске исполнитель — только её владелец (400,
        details.field = assignee_ids, details.reason = personal_board_owner_only);
        срок — due_date (YYYY-MM-DD, до полуночи в
        часовом поясе доски) или due_at (RFC 3339 со смещением), не оба (400,
        details.field = due_at). Задача, исполнители, строка журнала действий и
        события planner.task.created, (при исполнителях) planner.task.assigned и (у
        заявки без исполнителя) planner.task.unassigned_created пишутся одной
        транзакцией; ответ несёт is_request, author_department_id и needs_triage. Idempotency-Key (UUID) обязателен: нет или не
        UUID — 400 (details.field = Idempotency-Key); повтор с тем же ключом и телом —
        тот же ответ 201 (хранится 24 ч, только 2xx), тот же ключ с другим телом —
        409 `conflict` с details.reason = idempotency_key_reused; ответ 4xx ключ не
        занимает.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            UUID команды от клиента (ненулевой). Уникален на человека; повтор с тем же
            телом отдаёт сохранённый ответ.
          content:
            text/plain:
              schema:
                type: string
        - *xPlannerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Задача создана (или сохранённый ответ повтора с тем же ключом)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /tasks/resolve:
    get:
      operationId: resolveTask
      tags: [tasks]
      summary: Задача по ключу «КОД-n» или по UUID (постоянная ссылка planning/t/{key})
      description: >-
        Проходит право planner.access и выключатель. key — «КОД-n»
        (^[A-Z]{2,10}-[1-9][0-9]{0,17}$) или канонический UUID задачи (нижний
        регистр, не нулевой); псевдонимы после переноса — позже. Иной ключ,
        удалённая задача и задача, которую актор не видит, — одинаковый 404
        `not_found`. Путь чтения выбирает сервер (read_via), allowed_actions и
        проекция — по нему. ETag — версия задачи (для If-Match); If-None-Match
        здесь нет: allowed_actions и due_state меняются без смены версии.
      parameters:
        - name: key
          in: query
          required: true
          description: Ключ «КОД-n» или UUID задачи.
          content:
            text/plain:
              schema:
                type: string
      responses:
        "200":
          $ref: "#/components/responses/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /tasks/{id}:
    parameters:
      - &taskID
        name: id
        in: path
        required: true
        description: UUID задачи (канонический, нижний регистр); иное — 404.
        content:
          text/plain:
            schema:
              type: string
    get:
      operationId: getTask
      tags: [tasks]
      summary: Задача
      description: >-
        Проходит право planner.access и выключатель. Путь чтения выбирает сервер:
        доска → «Огляд» → исходящие заявки; первый разрешённый — в read_via, с его
        проекцией и allowed_actions. Нет задачи, она удалена или не видна — 404
        `not_found` (так же открывается скрытое уведомление planning/t/<uuid>). ETag —
        версия для If-Match; If-None-Match здесь нет.
      responses:
        "200":
          $ref: "#/components/responses/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Сменить статус, порядок в колонке и исполнителей — одна команда задачи
      description: >-
        Единственная команда смены статуса и порядка для трёх клиентов (пути /move
        нет): хоть одно из status_id, position, assignee_ids; пустое тело — 400
        (details.field = body). reason — только вместе со status_id: у статуса с
        requires_reason обязателен (1–1000 символов без HTML), у прочих запрещён
        (400, details.field = reason). position — ровно одно из before_id и
        after_id: сосед — живая задача той же доски в целевом статусе и не сама
        задача (иначе 400 с details.field = position.before_id или
        position.after_id); смена статуса без position ставит задачу в конец
        колонки; перевод в статус категории done закрывает задачу, выход —
        переоткрывает (крайний момент срока-даты — в текущем поясе доски; срок-дата,
        которую этот пояс не выражает, — 400, details.field = status_id,
        details.reason = due_out_of_range, если тот же запрос не несёт новый срок).
        assignee_ids заменяет исполнителей целиком (0–10); 400 —
        только если добавляемый человек не активен или не участник доски (на
        доске отдела участники — и руководитель, и члены отдела), а на личной
        доске — не её владелец (details.reason = personal_board_owner_only). Права по
        полям: статус — change_status, порядок — reorder; исполнителей меняет только
        тот, у кого есть право назначать исполнителей: команда edit его не
        гарантирует (автор задачи, не участник доски, получает edit, но PATCH с
        assignee_ids — 403), точный список правимых полей даст editable_fields[]
        (история 3.6); нет права — 403. Порядок отказов: нет If-Match — 428 → id не UUID — 404 → тело
        (400) → задача не видна — 404 → нет права — 403 → устаревшая версия (и
        кривой If-Match) — 412 `revision_mismatch` с details.current и ETag текущей
        версии → состояние (400) → между соседями нет места — 409 `conflict` с
        details.reason = position_exhausted (позиция ограничена 64 значащими
        цифрами; ничего не пишется, перенумерации колонки в этой версии нет).
        Версия растёт на 1, журнал и события
        planner.task.status_changed и planner.task.assigned пишутся одной
        транзакцией; смена только порядка событий не даёт; правка, которая ничего не
        меняет, — 200 без роста версии. If-Match: * совпадает с любой текущей
        версией (RFC 9110 §13.1.1) — изменение без сверки версии.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: >-
            Версия задачи из ETag в кавычках (`"3"`) или `*` — любая текущая
            версия (RFC 9110 §13.1.1). Обязателен: нет — 428
            `precondition_required`; не совпал, как и кривое значение, — 412
            `revision_mismatch`.
          content:
            text/plain:
              schema:
                type: string
        - *xPlannerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          $ref: "#/components/responses/Task"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /tasks/{id}/history:
    parameters:
      - *taskID
    get:
      operationId: getTaskHistory
      tags: [tasks]
      summary: История задачи — кто, когда, было → стало, клиент
      description: >-
        Проходит право planner.access и выключатель. Задача не видна (как и
        удалённая) — 404; путь чтения без истории в проекции — 403. Строки журнала
        действий задачи по времени: created (after — срез), status_changed,
        assigned, reordered (before/after — только изменённые поля). Не больше 500
        последних строк: truncated = true — более ранние строки не отданы. Курсор
        (keyset) — история 3.21, добавится аддитивно. Ответ несёт сильный ETag
        (хеш тела): совпавший If-None-Match — 304 без тела.
      parameters:
        - *ifNoneMatch
      responses:
        "200":
          description: История задачи
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ListETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskHistory"
        "304":
          description: История не изменилась (If-None-Match совпал); тела нет
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ListETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /tasks/{id}/comments:
    parameters:
      - *taskID
    get:
      operationId: listTaskComments
      tags: [tasks]
      summary: Комментарии задачи — последние живые, от старого к новому
      description: >-
        Проходит право planner.access и выключатель. Задача не видна (как и
        удалённая) — 404; путь чтения без комментариев в проекции (исходящие
        заявки) — 403. Видит комментарии тот, кто видит задачу на пути доски или
        «Огляд» (держатель planner.overview.read без участия читает, но не пишет:
        can_comment = false). Последние limit живых комментариев (1–500, по
        умолчанию 200; иное — 400, details.field = limit) по времени создания, от
        старого к новому, и не больше 8 MiB текста: has_more = true — более
        ранние не отданы (курсор — история 3.21). Удалённые комментарии в список не
        входят. У каждого комментария — allowed_actions актора (edit, delete).
        Ответ несёт сильный ETag (хеш тела): совпавший If-None-Match — 304 без тела.
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            Наибольшее число комментариев в ответе: целое 1–500 без знака и ведущих
            нулей, по умолчанию 200 (параметра нет); иное, в том числе пустое
            значение (`?limit=`), — 400 `validation` с details.field = limit.
          content:
            text/plain:
              schema:
                type: integer
                minimum: 1
                maximum: 500
                default: 200
        - *ifNoneMatch
      responses:
        "200":
          description: Комментарии задачи (не больше limit)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ListETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCommentList"
        "304":
          description: Список не изменился (If-None-Match совпал); тела нет
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ListETag"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createTaskComment
      tags: [tasks]
      summary: Написать комментарий к задаче
      description: >-
        Пишет тот, у кого есть право comment на задаче (член и админ доски,
        исполнитель, автор, наблюдатель; FR-4); держатель «Огляд» и planner.admin
        без участия — 403, задача не видна — 404. Текст — CommonMark без сырого
        HTML (details.reason = raw_html), 1–20 000 символов после обрезки пробелов
        по краям (пусто — details.reason = required). Упоминание — токен <@UUID>
        (канонический UUID в нижнем регистре) вне inline-кода и блоков кода, в том
        числе внутри пунктов и цитат; адрес ссылки и `\<` — не упоминание; не
        больше 20 разных упоминаний (details.reason = too_many_mentions).
        Упомянутый вне зеркала оргструктуры или не активный — 400, details.field =
        text, details.reason = inactive_person, details.id = его user_id. Комментарий,
        строка журнала действий (без текста) и события planner.task.commented и (при
        упоминаниях других людей) planner.task.mentioned пишутся одной транзакцией;
        задача, её версия и история не меняются. Упомянутые, которые задачу не
        видят, получают факт с redact = true и возвращаются в
        mentioned_without_access, чтобы клиент предложил добавить их
        наблюдателями. Idempotency-Key (UUID) обязателен: нет или не UUID — 400
        (details.field = Idempotency-Key); повтор с тем же ключом и телом — тот же
        ответ 201 (хранится 24 ч, событий второй раз нет), тот же ключ с другим
        телом — 409 `conflict` с details.reason = idempotency_key_reused; ответ 4xx
        ключ не занимает. Порядок отказов: ключ — 400 → id не UUID — 404 → тело
        (413, 400) → повтор ключа (409) → задача не видна — 404 → нет права — 403 →
        упомянутые — 400.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            UUID команды от клиента (ненулевой). Уникален на человека; повтор с тем же
            телом отдаёт сохранённый ответ.
          content:
            text/plain:
              schema:
                type: string
        - *xPlannerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCommentCreate"
      responses:
        "201":
          description: Комментарий записан (или сохранённый ответ повтора с тем же ключом); ETag — версия комментария
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCommentWrite"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /tasks/{id}/comments/{comment_id}:
    parameters:
      - *taskID
      - &commentID
        name: comment_id
        in: path
        required: true
        description: UUID комментария этой задачи (канонический, нижний регистр); иное — 404.
        content:
