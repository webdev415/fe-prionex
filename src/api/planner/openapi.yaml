        руководитель отдела и planner.admin). If-Match обязателен: нет — 428,
        устаревшая или кривая версия — 412 с details.current. Явной строки нет —
        404. 409 `conflict`: department_manager (руководителя отдела из CRM снять
        нельзя), org_stale (доска отдела, снятие админа при устаревшем снимке),
        last_admin (последний явный админ командной доски), board_archived (доска в
        архиве — только чтение). Снятие члена или гостя
        идёт без проверки свежести оргструктуры: оно права не выдаёт. Ответ —
