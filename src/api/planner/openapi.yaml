              type: string
    patch:
      operationId: updateTaskComment
      tags: [tasks]
      summary: Править свой комментарий
      description: >-
        Правит только автор комментария, пока у него есть право comment на задаче;
        прочим — 403, задача не видна — 404. Комментарий не найден, удалён или
        принадлежит другой задаче — 404. Текст — по правилам создания; проверяются
        только упоминания, добавленные этой правкой. Версия комментария растёт на 1,
        edited_at — время правки (edited = true); текст не изменился — 200 без
        записи и без роста версии. В mentioned_without_access — только добавленные
        упоминания без доступа. Журнал (без текста) и события
        planner.task.commented (comment_change = edited) и при добавленных
        упоминаниях planner.task.mentioned — одной транзакцией. Порядок отказов:
        нет If-Match — 428 → id не UUID — 404 → тело (413, 400) → задача не видна —
        404 → комментарий не найден — 404 → нет права — 403 → устаревшая версия (и
        кривой If-Match) — 412 `revision_mismatch` с details.current (TaskComment) и
        ETag текущей версии → упомянутые — 400. If-Match: * совпадает с любой
        текущей версией.
      parameters:
        - &ifMatchComment
          name: If-Match
          in: header
          required: false
          description: >-
            Версия комментария из ETag в кавычках (`"3"`) или `*` — любая текущая
            версия (RFC 9110 §13.1.1). Обязателен: нет — 428
            `precondition_required`; не совпал, как и кривое значение, — 412
            `revision_mismatch`.
          content:
            text/plain:
              schema:
                type: string
        - *xPlannerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCommentPatch"
      responses:
        "200":
          description: Комментарий после правки; ETag — его версия
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
