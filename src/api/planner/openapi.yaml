  /boards/{code}/config:
    parameters:
      - name: code
        in: path
        required: true
        description: Код доски (^[A-Z]{2,10}$); иной код — 404.
        content:
          text/plain:
            schema:
              type: string
    put:
      operationId: putBoardConfig
      tags: [boards]
      summary: Заменить конфигурацию доски целиком (или превью dry_run)
      description: >-
        Конфигурация доски — статусы, поля семи типов (обязательность, значение по
        умолчанию), метки, шкала приоритетов из 3–5 уровней с уровнем по умолчанию,
        типы задач (норматив SLA в часах или днях, счёт calendar или weekdays,
        начальный статус, исполнитель по умолчанию; ровно один тип по умолчанию),
        исполнитель доски, чек-лист и образец описания по умолчанию — заменяется
        целиком: элементы сопоставляются по стабильным id (новый элемент приходит с
        UUID клиента, чтобы на него можно было сослаться в том же запросе; id,
        занятый другой доской или удалённым полем и вариантом, — 400 id_taken).
        Порядок элементов — порядок массивов (position в теле нет). Права: админ
        доски и planner.admin (личная доска — владелец); член и гость доски — 403,
        не участник — 404; архивная доска — 409 board_archived. If-Match обязателен:
        нет — 428, устаревшая или кривая версия — 412 `revision_mismatch` с
        details.current (карточка). Правила смены: тип существующего поля не
        меняется (type_immutable), категория статуса с задачами не меняется
        (category_in_use), используемый вариант не удаляется (option_in_use),
        статус с задачами удаляется только с move_tasks_to (status_in_use; цель —
        статус новой конфигурации без requires_reason), у отказа — details.used_count
        и details.id. Исполнитель по умолчанию — активный участник доски
        (not_participant; личная доска — только владелец,
        personal_board_owner_only), умолчание поля «сотрудник» — активный человек
        (inactive_person); проверяются только новые и изменённые значения (id
        отличается от сохранённого у того же элемента), неизменённое значение
        хранится как есть, даже если человек уже не участник или не активен.
        Пределы: статусов и типов ≤ 30, полей ≤ 50, вариантов поля
        ≤ 100 и на доске ≤ 500, меток ≤ 100, срез конфигурации ≤ 256 KiB
        (details.field = config, config_too_large), задач в удаляемых статусах
        (включая «Кошик») ≤ 2000 (details.field = move_tasks_to, move_too_large,
        details.used_count — их число). Перенос из удаляемого статуса done в статус
        не done переоткрывает задачу, крайний момент срока-даты считается в
        текущем поясе доски; срок-дата, которую пояс не выражает, —
        details.field = move_tasks_to.<id статуса>, due_out_of_range. Без dry_run: 400 `validation` —
        details.field, details.reason, details.id, details.used_count первой ошибки и
        details.errors[] — все в той же форме; форма проверяется раньше If-Match
        (412). Успех — конфигурация, перенос задач (строка журнала status_changed у
        каждой, planner.task.status_changed — у неудалённых), версия доски +1,
        config_schema_version 3, строка журнала config_changed и событие
        planner.board.updated одной транзакцией; ответ — карточка с ETag. Та же
        конфигурация — 200 без записи и роста версии. С dry_run=true тот же код
        исполняется в транзакции с откатом: 200 BoardConfigPreview (valid, errors по
        строкам, summary, board — карточка, какой она станет, или null) без ETag,
        ничего не записано; ошибки формы не прерывают превью, If-Match проверяется
        (412). 409 `conflict` board_config_changed — страховка от гонки со сменой
        конфигурации (занятый id элемента, задача в удаляемом статусе или со
        ссылкой на удаляемый элемент); создание задачи ждёт лок доски и читает
        конфигурацию после него, поэтому параллельное создание встаёт в новый
        статус по умолчанию, а не даёт 409. Политика доски этим путём не пишется
        (одна точка записи — PUT /boards/{code}/policy): раздел config.policy в
        теле — 400, details.field = config.policy, details.reason =
        edit_via_policy, в обоих режимах; П-5 (отметки notify_author статусов)
        пишется только здесь. Удалить тип, назначенный политике
        (intake_default_type), нельзя — 400 details.field = config.task_types,
        intake_default_type_in_use, details.id; если тот же тип держат и задачи,
        эта ошибка идёт раньше type_in_use. Сохранение ставит
        config_schema_version 3. Лишнее поле тела — 400,
        details.field = body; поле не того JSON-типа — 400 с путём поля.
      parameters:
        - &dryRunPolicy
          name: dry_run
          in: query
          required: false
          description: >-
            true — превью без записи (у PUT /boards/{code}/policy — 200
            BoardPolicyPreview с типом содержимого
            application/vnd.prionex.planner.board-policy-preview+json; у PUT
            /boards/{code}/tzid — 200 BoardTzidPreview с типом содержимого
            application/vnd.prionex.planner.board-tzid-preview+json); у PUT
            /boards/{code}/config — превью конфигурации без записи (ответ 200 BoardConfigPreview с
            типом содержимого application/vnd.prionex.planner.board-config-preview+json,
            без ETag); false, пустое значение или нет параметра — сохранение. Другое
            значение или повторённый параметр — 400, details.field = dry_run, первым
            отказом после 401 (до If-Match и тела).
          content:
            text/plain:
              schema:
                type: string
        - *ifMatch
        - *xPlannerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardConfigPut"
      responses:
        "200":
          description: >-
            Без dry_run — карточка доски после сохранения (application/json, ETag —
            версия); с dry_run=true — превью
            (application/vnd.prionex.planner.board-config-preview+json, без ETag,
            ничего не записано). Тип содержимого выбирает только dry_run.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              description: >-
                Версия доски в кавычках (`"3"`) — значение для If-Match. Только у
                ответа application/json; у превью ETag нет.
              schema:
                type: string
                pattern: '^"[0-9]+"$'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
            application/vnd.prionex.planner.board-config-preview+json:
              schema:
                $ref: "#/components/schemas/BoardConfigPreview"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /boards/{code}/policy:
    parameters:
      - name: code
        in: path
        required: true
        description: Код доски (^[A-Z]{2,10}$); иной код — 404.
        content:
          text/plain:
            schema:
              type: string
    get:
      operationId: getBoardPolicy
      tags: [boards]
      summary: Политика доски — восемь настроек с умолчанием, закреплением и editable, П-5
      description: >-
        Видит тот, кому видна карточка доски (участник любой роли, planner.admin;
        личную доску — только владелец), прочим — 404. По каждому из восьми ключей
        политики (FR-49: intake_open, triage_by, intake_notify, member_visibility,
        group_lanes, intake_default_type, confidential, intake_hint) — текущее
        значение, умолчание шаблона, признак закрепления шаблоном (locked) и
        editable: может ли этот актор изменить ключ на какое-либо допустимое
        значение (право configure; закреплённое и confidential — только
        planner.admin; intake_open доски отдела не меняет никто; confidential у
        доски с задачами не выключается; у архивной доски — false у всех).
        notify_author — П-5 «Про які статуси сповіщати замовника»: не ключ
        политики, а id статусов с отметкой notify_author, только для чтения
        (edit_via = config — правится PUT /boards/{code}/config). Доска, созданная
        до 3.4a, отдаёт умолчания по виду доски, locked пуст. ETag — версия доски
        (для If-Match PUT /policy и PUT /config).
      responses:
        "200":
          description: Политика доски
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardPolicyView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putBoardPolicy
      tags: [boards]
      summary: Заменить политику доски целиком (или превью dry_run)
      description: >-
        Тело — все восемь ключей политики (замена целиком, частичной правки нет;
        null допустим у intake_default_type — тип доски по умолчанию — и у
        intake_hint — без подсказки; подсказка пустая или из одних пробелов — 400
        length, переводы строк приводятся к \n; пустая строка типа — 400
        unknown_task_type). Ключ
        notify_author (П-5) не принимается — 400, details.field = notify_author,
        details.reason = edit_via_config: он правится PUT /boards/{code}/config;
        прочее лишнее поле — 400 body; нет ключа — 400 с именем ключа. Права:
        админ доски и planner.admin (личная доска — владелец); член и гость — 403,
        не участник — 404; архивная доска — 409 board_archived. Значения:
        intake_default_type — тип задачи этой доски (иначе unknown_task_type);
        intake_hint — до 200 символов; у личной доски intake_open не включается
        (personal_board_no_intake); срез доски не больше предела PUT /config
        (details.field = config, config_too_large). Без dry_run — 400 `validation`
        по первой ошибке, details.errors[] — все. Закреплённый шаблоном ключ и confidential меняет
        только planner.admin — прочим 403 `forbidden`, details.field = ключ,
        details.reason = setting_locked; intake_open доски отдела не меняет никто,
        включая planner.admin (403 setting_locked); confidential включается
        всегда, а выключить его у доски, на которой есть задачи (в том числе
        закрытые и в «Кошику»), нельзя никому — 409 `conflict`,
        details.reason = confidential_board_has_tasks. 403 и 409 политики — в
        обоих режимах. If-Match обязателен: нет — 428, устаревшая или кривая
        версия — 412 `revision_mismatch` с details.current (политика). Успех —
        политика, версия доски +1 (общая с PUT /config и участниками),
        config_schema_version 3, строка журнала policy_changed (before/after —
        только изменённые ключи) и событие planner.board.updated одной
        транзакцией; ответ — политика с ETag. Та же политика — 200 без записи и
        роста версии. С dry_run=true тот же код исполняется в транзакции с
        откатом: 200 BoardPolicyPreview (valid, errors по ключам, changed, policy —
        какой она станет, или null) без ETag, ничего не записано; ошибки значений
        превью не прерывают. Idempotency-Key нет.
      parameters:
        - *dryRunPolicy
        - *ifMatch
        - *xPlannerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardPolicyPut"
      responses:
        "200":
          description: >-
            Без dry_run — политика после сохранения (application/json, ETag —
            версия доски); с dry_run=true — превью
            (application/vnd.prionex.planner.board-policy-preview+json, без ETag,
            ничего не записано). Тип содержимого выбирает только dry_run.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              description: >-
                Версия доски в кавычках (`"3"`) — значение для If-Match. Только у
                ответа application/json; у превью ETag нет.
              schema:
                type: string
                pattern: '^"[0-9]+"$'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardPolicyView"
            application/vnd.prionex.planner.board-policy-preview+json:
              schema:
                $ref: "#/components/schemas/BoardPolicyPreview"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /boards/{code}/tzid:
    parameters:
      - name: code
        in: path
        required: true
        description: Код доски (^[A-Z]{2,10}$); иной код — 404.
        content:
          text/plain:
            schema:
              type: string
    put:
      operationId: putBoardTzid
      tags: [boards]
      summary: Сменить часовой пояс доски (или превью dry_run)
      description: >-
        Тело — {"tzid": "<имя пояса IANA>"} без лишних полей (лишнее поле или не
        объект — 400 body; tzid не строка или нет — 400 tzid). Пояс — имя IANA
        встроенной базы, не длиннее 64 символов; "", Local, служебные имена и
        каталоги tz-базы хоста (posixrules, localtime, posix/…) и неизвестные имена —
        400 tzid, в обоих режимах. Права — как у конфигурации: админ доски и
        planner.admin (личная доска — владелец; чужая личная у planner.admin — 404);
        член и гость — 403, не участник — 404; архивная доска — 409
        board_archived. If-Match обязателен: нет — 428, устаревшая или кривая
        версия — 412 `revision_mismatch` с details.current (карточка). Смена пояса
        пересчитывает крайние моменты (due_deadline_at) открытых задач доски со
        сроком-датой, включая «Кошик», одной транзакцией: due_date не меняется,
        момент — полночь после даты в новом поясе (сутки перевода часов — 23 или
        25 ч); срок-момент (due_at) от пояса не зависит; закрытые задачи хранят
        момент своего пояса, при переоткрытии он пересчитывается в текущем поясе
        доски. У каждой задачи с изменённым моментом — версия +1 и строка журнала
        updated (before/after — только due_deadline_at); событий planner.task.*
        нет. Доска — tzid, версия +1, строка журнала tzid_changed (before {tzid},
        after {tzid, recomputed_tasks}) и одно событие planner.board.updated (срез
        с новым tzid, moved_tasks пуст) в той же транзакции; ответ — карточка с
        ETag. Тот же пояс — 200 без записи и роста версии. Предел — открытых задач
        со сроком-датой ≤ 2000: иначе 400 `validation`, details.field = tzid,
        details.reason = recompute_too_large, details.used_count — их число (в
        обоих режимах, ни одна строка задачи не блокируется); срок-дата, которая в
        новом поясе даёт момент вне годов 1–9999, — 400 tzid, due_out_of_range.
        Форма 400 — как у PUT /boards/{code}/config: details.field,
        details.reason, details.used_count первой ошибки и details.errors[]. С
        dry_run=true тот же код исполняется в транзакции с откатом: 200
        BoardTzidPreview (пояс до и после, сколько задач пересчитается, сколько
        задач доски просрочено до и после на часах сервиса) без ETag, ничего не
        записано; у того же пояса recomputed_tasks = 0, overdue_before =
        overdue_after. Idempotency-Key нет.
      parameters:
        - *dryRunPolicy
        - *ifMatch
        - *xPlannerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardTzidPut"
      responses:
        "200":
          description: >-
            Без dry_run — карточка доски после сохранения (application/json, ETag —
            версия); с dry_run=true — превью
            (application/vnd.prionex.planner.board-tzid-preview+json, без ETag,
            ничего не записано). Тип содержимого выбирает только dry_run.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              description: >-
                Версия доски в кавычках (`"3"`) — значение для If-Match. Только у
                ответа application/json; у превью ETag нет.
              schema:
                type: string
                pattern: '^"[0-9]+"$'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
            application/vnd.prionex.planner.board-tzid-preview+json:
              schema:
                $ref: "#/components/schemas/BoardTzidPreview"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /boards/{code}/history:
    parameters:
      - name: code
        in: path
        required: true
        description: Код доски (^[A-Z]{2,10}$); иной код — 404.
        content:
          text/plain:
