      summary: Создать шаблон доски
      description: >-
        Право planner.templates.manage (нет — 403 `forbidden` до чтения тела и до
        захвата ключа). Тело — код (^[a-z][a-z0-9_]{1,39}$, иначе 400 code), имя
        (1–100 символов, иначе 400 name), конфигурация в форме BoardConfigInput (те
        же правила, что у PUT /boards/{code}/config: шкала из 3–5 уровней, ровно один
        тип по умолчанию, пределы разделов, срез ≤ 256 KiB — config, config_too_large;
        раздел config.policy — 400 edit_via_policy), политика — ключ policy рядом в
        форме BoardPolicyPut (null или нет ключа — раздела нет, доска из шаблона
        получает умолчания по виду; тип заявки — тип этого шаблона, иначе
        policy.intake_default_type, unknown_task_type) и закреплённые ключи locked
        (ключ политики, иначе locked[i], invalid; повтор — duplicate). Людей в
        шаблоне нет: исполнитель по умолчанию доски или типа и умолчание поля
        «сотрудник» — 400 person_in_template. 400 `validation` — details.field,
        details.reason первой ошибки и details.errors[] — все. Код занят (в том
        числе архивным) — 409 template_code_taken. Шаблон пишется с
        config_schema_version 3, версия 1; строка журнала действий шаблона created —
        той же транзакцией. Idempotency-Key (UUID) обязателен: повтор с тем же ключом
        и телом — тот же ответ 201, тот же ключ с другим телом — 409
        idempotency_key_reused; ответ 4xx ключ не занимает.
      parameters:
