        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putTemplate
      tags: [templates]
      summary: Заменить шаблон целиком (или превью dry_run)
      description: >-
        Право planner.templates.manage (нет — 403 до чтения тела). Тело — имя,
        конфигурация, политика и закреплённые ключи по правилам POST /templates
        (код не меняется). Нет шаблона — 404; архивный — 409 template_archived.
        If-Match обязателен: нет — 428, устаревшая или кривая версия — 412
        `revision_mismatch` с details.current (шаблон); форма проверяется раньше
        If-Match. Успех — шаблон с config_schema_version 3 и версией +1, строка
        журнала действий updated (before/after — срезы шаблона); тот же шаблон —
        200 без записи и роста версии. Доски, уже созданные из шаблона, не
        меняются: у доски — своя копия конфигурации и свой config_schema_version
        (FR-11). С dry_run=true ничего не пишется: 200 TemplatePreview (valid,
        errors по строкам, template — шаблон, каким он станет, или null) своим типом
        содержимого без ETag.
      parameters:
        - name: dry_run
          in: query
          required: false
          description: >-
            true — превью без записи (200 TemplatePreview с типом содержимого
            application/vnd.prionex.planner.template-preview+json, без ETag); false,
            пустое значение или нет параметра — сохранение. Другое значение или
            повторённый параметр — 400, details.field = dry_run (после проверки
            права, до If-Match и тела).
          content:
            text/plain:
              schema:
                type: string
        - *ifMatch
