        Значение живого поля доски у задачи (порядок — порядок полей конфигурации;
        значение скрытого поля не отдаётся). value — каноническая форма: text,
        date, link, person, single_select — строка (у списков — id варианта);
        number — число; multi_select — массив id вариантов в порядке
        конфигурации. person — человек поля person (TaskPerson); его нет, если
        человека нет в зеркале оргструктуры (crm_user_id у значения поля не
        хранится): user_id остаётся в value, такой человек неактивен.
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/BoardFieldType"
        value:
          x-go-type: json.RawMessage
          anyOf:
            - type: string
            - type: number
            - type: array
              items:
                type: string
        options:
          type: array
          description: Выбранные варианты с текущей подписью — только у single_select и multi_select.
          items:
            $ref: "#/components/schemas/TaskFieldOption"
        person:
          $ref: "#/components/schemas/TaskPerson"
    TaskChecklistItem:
      type: object
      required: [id, text, done]
      description: >-
        Пункт чек-листа задачи: при создании — копия чек-листа доски; добавить,
        отметить, переставить и удалить — команды /tasks/{id}/checklist (история
        3.9). Порядок пунктов — порядок списка checklist.
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        text:
          type: string
        done:
          type: boolean
    TaskChecklistItemCreate:
      type: object
      additionalProperties: false
      required: [text]
      description: Новый пункт чек-листа — в конец списка, done = false.
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 300
          description: >-
            Текст пункта: 1–300 символов, не из одних пробелов, без управляющих
            символов (иначе 400, details.field = text, reason = length). Нет ключа
            или null — 400 text до чтения задачи. После создания не правится.
    TaskChecklistItemPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Хоть одно из done и position ({} — 400, details.field = body). Текст пункта
        не правится.
      properties:
        done:
          type: boolean
          description: Отметка пункта.
        position:
          $ref: "#/components/schemas/TaskPosition"
    TaskChecklistProgress:
      type: object
      required: [done, total]
      description: Прогресс чек-листа задачи — отмечено / всего (считает сервер).
      properties:
        done:
          type: integer
          minimum: 0
          description: Отмечено пунктов.
        total:
          type: integer
          minimum: 0
          description: Всего пунктов.
    TaskPerson:
      type: object
      required: [user_id, crm_user_id, full_name, inactive]
      properties:
        user_id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        crm_user_id:
          type: integer
          format: int64
        full_name:
          type: string
          nullable: true
          description: ФИО из зеркала оргструктуры CRM; null — человека в зеркале нет.
        inactive:
          type: boolean
          description: >-
            «Виконавець неактивний»: человека нет в зеркале оргструктуры или он не
            активен (считается при чтении; возврат человека в зеркало снимает
            признак).
    TaskBoardRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        code:
          type: string
          pattern: "^[A-Z]{2,10}$"
        name:
          type: string
    TaskStatusRef:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        name:
          type: string
        category:
          type: string
          enum: [todo, in_progress, done]
          x-enum-varnames: [TaskStatusCategoryTodo, TaskStatusCategoryInProgress, TaskStatusCategoryDone]
          description: Категория статуса; done — задача закрыта.
    TaskOrigin:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          description: Происхождение задачи (manual — создана человеком в клиенте).
        message_url:
          type: string
          format: uri
          description: >-
            Ссылка на сообщение-источник задачи из чата (история 9.1). Объявлено
            заранее (CF-16): до 9.1 сервер ключ не отдаёт.
    TaskCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          description: >-
            Название; пробелы по краям обрезаются, после этого 1–300 символов без
            управляющих. Верхний предел считается после обрезки, поэтому maxLength в
            схеме нет: 300 символов с пробелами по краям сервер принимает.
        description:
          type: string
          nullable: true
          description: >-
            Описание — CommonMark без сырого HTML (иначе 400, details.reason =
            raw_html), упоминание — токен <@UUID>; до 20 000 символов после обрезки
            пробелов по краям (потому maxLength в схеме нет); пустое — описания нет.
            Нет ключа — образец описания доски; null — без описания.
        assignee_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          description: >-
            user_id исполнителей (0–10, равноправны) — активные участники доски;
            канонический UUID в нижнем регистре.
          items:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/google/uuid
        due_date:
          type: string
          format: date
          x-go-type: string
          nullable: true
          description: Срок датой (YYYY-MM-DD) — до полуночи в часовом поясе доски; не вместе с due_at.
        due_at:
          type: string
          format: date-time
          nullable: true
          description: Срок моментом (RFC 3339 со смещением); не вместе с due_date.
        type_id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          nullable: true
          description: >-
            Тип задачи этой доски. Нет ключа — тип по умолчанию доски (если он
            отмечен); null — без типа. Задача встаёт в начальный статус типа, иначе
            в статус доски по умолчанию; исполнитель по умолчанию — типа, иначе
            доски (только если ключа assignee_ids нет).
        priority_id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          nullable: true
          description: Уровень шкалы приоритетов доски. Нет ключа — уровень по умолчанию (если шкала есть); null — без приоритета.
        label_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Метки этой доски (без повторов).
          items:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/google/uuid
        watcher_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          description: >-
            Наблюдатели — активные люди зеркала оргструктуры (не обязательно
            участники доски; связь «наблюдатель» даёт чтение задачи); на личной
            доске — только владелец.
          items:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/google/uuid
        fields:
          type: object
          additionalProperties: true
          maxProperties: 50
          description: >-
            Значения полей доски — объект {field_id: значение} (форма значения —
            TaskFieldValue.value); null — без значения. Поле без ключа получает
            значение по умолчанию. Обязательное поле без значения — 400,
            details.field = имя поля, details.reason = required, details.id = id
            поля; значение не по типу — invalid; неизвестный ключ — details.field
            = fields, reason = unknown_field. Ключей больше 50 (предел полей
            доски) — 400, details.field = fields, reason = too_many, до любого
            чтения.
        dev_task_url:
          type: string
          nullable: true
          maxLength: 2048
          description: «Задача розробки» — абсолютный http/https URL (иначе 400 dev_task_url).
    TaskPosition:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: >-
        Место в списке — ровно одно из before_id и after_id (оба или ни одного —
        400, details.field = position). У PATCH /tasks/{id} сосед — задача колонки
        целевого статуса; у PATCH /tasks/{id}/checklist/{item_id} — другой пункт
        чек-листа той же задачи (история 3.9).
      properties:
        before_id:
          type: string
          format: uuid
          description: Поставить непосредственно перед этой задачей колонки (пунктом чек-листа).
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        after_id:
          type: string
          format: uuid
          description: Поставить непосредственно после этой задачи колонки (пункта чек-листа).
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
    TaskPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Хоть одно из status_id, position, assignee_ids, title, description,
        due_date, due_at, type_id, priority_id, label_ids, watcher_ids, fields,
        dev_task_url ({} — 400, details.field = body). Нет права хоть на один ключ —
        403, ничего не пишется.
      properties:
        status_id:
          type: string
          format: uuid
          description: Статус доски задачи.
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        reason:
          type: string
          minLength: 1
          description: >-
            Причина — только со status_id, для статуса с requires_reason; 1–1000
            символов после обрезки пробелов по краям (потому maxLength в схеме нет).
        position:
          $ref: "#/components/schemas/TaskPosition"
        assignee_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          description: Новый состав исполнителей целиком (0–10).
          items:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/google/uuid
        title:
          type: string
          minLength: 1
          description: Название (правила TaskCreate.title).
        description:
          type: string
          nullable: true
          description: Описание (правила TaskCreate.description); null или пустое — снять.
        due_date:
          type: string
          format: date
          x-go-type: string
          nullable: true
          description: >-
            Срок датой. Оба ключа срока со значением — 400 due_at; ровно одно
            значение — эта форма, другая снимается; все присланные ключи срока null
            — срок снимается.
        due_at:
          type: string
          format: date-time
          nullable: true
          description: Срок моментом (правила — due_date).
        type_id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          nullable: true
          description: Тип этой доски или null — снять; снимок норматива SLA — нового типа. Начальный статус и исполнитель типа не применяются.
        priority_id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          nullable: true
          description: Уровень шкалы приоритетов доски или null — снять.
        label_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Метки целиком.
          items:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/google/uuid
        watcher_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          description: Наблюдатели целиком; проверяются только добавляемые.
          items:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/google/uuid
        fields:
          type: object
          additionalProperties: true
          maxProperties: 50
          description: >-
            Значения присланных полей доски {field_id: значение}; null — снять
            (обязательное — 400 required). Обязательность проверяется только у
            присланных полей: смена статуса и другие правки старой задачи без
            значения обязательного поля проходят (A-69). Ключей больше 50 (предел
            полей доски) — 400, details.field = fields, reason = too_many, до
            любого чтения.
        dev_task_url:
          type: string
          nullable: true
          maxLength: 2048
          description: «Задача розробки» — абсолютный http/https URL или null — снять.
    Task:
      type: object
      required: [id, key, number, board, title, description, status, status_reason, author, assignees, due_date, due_at,
                 due_deadline_at, due_state, closed_at, origin, version, read_via, allowed_actions, created_at, updated_at,
                 type, priority, labels, watchers, fields, dev_task_url, checklist, editable_fields, is_request,
                 author_department_id, needs_triage, checklist_progress]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        key:
          type: string
          pattern: "^[A-Z]{2,10}-[1-9][0-9]{0,17}$"
          description: Номер «КОД-n» — неизменен; постоянная ссылка клиента planning/t/{key}.
        number:
          type: integer
          format: int64
          minimum: 1
        board:
          $ref: "#/components/schemas/TaskBoardRef"
        title:
          type: string
        description:
          type: string
          nullable: true
          description: Описание; null — его нет или путь чтения его не отдаёт.
        status:
          $ref: "#/components/schemas/TaskStatusRef"
        status_reason:
          type: string
          nullable: true
          description: Причина статуса с requires_reason; null — причины нет.
        author:
          $ref: "#/components/schemas/TaskPerson"
        assignees:
          type: array
          description: Исполнители по возрастанию crm_user_id.
          items:
            $ref: "#/components/schemas/TaskPerson"
        due_date:
          type: string
          format: date
          x-go-type: string
          nullable: true
          description: >-
            Срок датой (YYYY-MM-DD) — дата в поясе доски, отдаётся без сдвига в
            любом поясе пользователя; крайний момент — полночь после неё в поясе
            доски (due_deadline_at).
        due_at:
          type: string
          format: date-time
          nullable: true
        due_deadline_at:
          type: string
          format: date-time
          nullable: true
          description: Крайний момент срока (вычисляет сервер); null — срока нет.
        due_state:
          $ref: "#/components/schemas/DueState"
        closed_at:
          type: string
          format: date-time
          nullable: true
        origin:
          $ref: "#/components/schemas/TaskOrigin"
        version:
          type: integer
          format: int64
          minimum: 1
          description: Версия задачи — значение ETag и If-Match.
        read_via:
          $ref: "#/components/schemas/ReadVia"
        allowed_actions:
          type: array
          items:
            $ref: "#/components/schemas/TaskAction"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        type:
          description: Тип задачи; null — без типа или путь чтения его не отдаёт.
          x-go-type: "*TaskNamedRef"
          oneOf:
            - $ref: "#/components/schemas/TaskNamedRef"
            - type: object
              nullable: true
              enum: [null]
        priority:
          description: Уровень шкалы приоритетов; null — без приоритета или путь чтения его не отдаёт.
          x-go-type: "*TaskNamedRef"
          oneOf:
            - $ref: "#/components/schemas/TaskNamedRef"
            - type: object
              nullable: true
              enum: [null]
        labels:
          type: array
          description: Метки в порядке конфигурации доски (текущие имена).
          items:
            $ref: "#/components/schemas/TaskNamedRef"
        watchers:
          type: array
          description: Наблюдатели по возрастанию crm_user_id.
          items:
            $ref: "#/components/schemas/TaskPerson"
        fields:
          type: array
          description: Значения живых полей доски в порядке конфигурации.
          items:
            $ref: "#/components/schemas/TaskFieldValue"
        dev_task_url:
          type: string
          nullable: true
          description: «Задача розробки»; null — нет или путь чтения её не отдаёт.
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/TaskChecklistItem"
        editable_fields:
          type: array
          description: >-
            Поля тела PATCH /tasks/{id}, которые актор может править, плюс
            checklist — право на команды /tasks/{id}/checklist (история 3.9);
            пусто — ни одного.
          items:
            $ref: "#/components/schemas/TaskEditableField"
        is_request:
          type: boolean
          description: >-
            Задача — заявка в другой отдел (история 3.14): создана не членом и не админом
            доски; фиксируется при создании и не меняется. Отдаётся на любом пути чтения.
        author_department_id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          nullable: true
          description: Отдел автора заявки на момент создания (история 3.14); null — без отдела или задача не заявка.
        needs_triage:
          type: boolean
          description: >-
            Заявка не разобрана (история 3.14): без исполнителей в статусе доски по умолчанию
            (чип «Нерозібрані»; клиент сам не вычисляет).
        checklist_progress:
          description: >-
            Прогресс чек-листа — отмечено / всего по пунктам checklist (без пунктов
            — {done: 0, total: 0}); null — путь чтения чек-лист не отдаёт.
          x-go-type: "*TaskChecklistProgress"
          oneOf:
            - $ref: "#/components/schemas/TaskChecklistProgress"
            - type: object
              nullable: true
              enum: [null]
    TaskCard:
