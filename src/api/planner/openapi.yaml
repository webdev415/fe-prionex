            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /me/ics-feed:
    post:
      operationId: issueIcsFeed
      tags: [calendar]
      summary: Выпустить личную ленту ICS (URL выдаётся один раз)
      description: >-
        Проходит право planner.access и выключатель; «View As» — 403. Тело пустое
        или `{}`, любое поле, null или не объект — 400 (details.field = body или имя
        поля). Ответ 201 несёт url вида
        `https://<API CRM>/api/v1/planner/ics/<token>.ics`, где токен — 256 бит,
        43 символа base64url; URL выдаётся только в этом ответе, в базе хранится
        лишь SHA-256 токена. Каждый вызов — новый выпуск: прежняя лента владельца
        гаснет той же транзакцией, и её URL сразу отвечает 404. Idempotency-Key не
        принимается и игнорируется (сохранённый ответ хранил бы токен): повтор с
        тем же ключом — тоже новый выпуск. Лента гаснет навсегда и при
        деактивации владельца или 30 днях без входа в планер (гашение ленивое — по
        запросу ленты). Стенд без PLANNER_CRM_API_BASE_URL,
        PLANNER_CRM_WEB_BASE_URL или PLANNER_TRUSTED_PROXIES — 503
        `feature_disabled`. Ответ не кэшируется (Cache-Control: private, no-store).
      parameters:
        - *xPlannerClient
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IcsFeedIssue"
      responses:
        "201":
          description: Лента выпущена; прежняя погашена
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IcsFeedIssued"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /ics/{token}.ics:
    get:
      operationId: getIcsFeed
      tags: [ics]
      summary: Личная лента ICS (text/calendar) для внешнего календаря
      description: >-
        Единственный путь без JWT: доступ даёт токен в пути (43 символа base64url),
        маршрут Kong — planner-ics, а не planner-routes. Лента содержит только
        VEVENT событий владельца (организатор или текущий участник) за −30…+180
        дней: UID = <id>@planner.prionex, SEQUENCE = version, DTSTAMP, SUMMARY,
        LOCATION, URL на событие, время в UTC с `Z`, «весь день» — VALUE=DATE,
        отменённые — STATUS:CANCELLED; DESCRIPTION, ATTENDEE, ORGANIZER, VTODO и
        сроков задач нет. Пустая лента — VCALENDAR без компонентов. Неизвестный,
        погашенный (перевыпуск, деактивация владельца, 30 дней без входа в
        планер, владелец не active в зеркале оргструктуры) или не той формы токен —
        один и тот же 404 `not_found`; тот же 404 — на стенде без
        PLANNER_TRUSTED_PROXIES, PLANNER_CRM_API_BASE_URL или
        PLANNER_CRM_WEB_BASE_URL (лента выключена: без предела, выключателя и
        базы). Выключатель не в положении on (в том числе prep) или не прочитан —
        503 `feature_disabled`. Больше 5000 событий у владельца за окно — 500
        `internal`, а не усечённая лента. Заголовки: Content-Type: text/calendar; charset=utf-8;
        Cache-Control: private, max-age=300 у 200 и private, no-store у прочих
        ответов. Путь с токеном не пишется в журнал планера и в метрики (только
        шаблон маршрута). HEAD по тому же пути отвечает как GET без тела (те же
        статус и заголовки; отдельной операции нет — метод HEAD не входит в
        route.methods периметра). Больше 60 запросов в минуту (ведро на 20) с
        одного адреса клиента — 429 `rate_limited` с Retry-After до выключателя и
        базы; адрес клиента — от доверенного прокси (Kong, PLANNER_TRUSTED_PROXIES)
        правый недоверенный хоп X-Forwarded-For, от прочих собеседников — сам
        собеседник соединения; IPv6 — сеть /64.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: Токен ленты, 43 символа base64url; иначе — 404.
          content:
            text/plain:
              schema:
                type: string
      responses:
        "200":
          description: Лента iCalendar (RFC 5545), строки свёрнуты по 75 октетов
          content:
            text/calendar:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT CRM конечного пользователя (HS256, ключ стенда). Сервисные токены
        (is_service) — 401; живость сессии подтверждает auth-service CRM (кэш не
        дольше 60 с), его недоступность — 503 `session_check_unavailable`.
  headers:
    XRequestID:
      description: >-
        Сквозной идентификатор запроса. Значение клиента принимается, только если
        совпадает с ^[A-Za-z0-9._-]{1,64}$, иначе сервер выдаёт свой UUID.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
    ETag:
      description: Версия объекта в кавычках (`"3"`) — значение для If-Match.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    ListETag:
      description: >-
        Сильный валидатор списка — хеш тела ответа в кавычках; значение для
        If-None-Match, не для If-Match.
      schema:
        type: string
        pattern: '^"[0-9a-f]{16,64}"$'
  responses:
    BoardCard:
      description: Карточка доски после изменения; ETag — её версия
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Board"
    Template:
      description: Шаблон доски; ETag — его версия
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Template"
    TemplateCreated:
      description: Шаблон создан (или сохранённый ответ повтора с тем же ключом); ETag — версия шаблона
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Template"
    Task:
      description: Задача; ETag — её версия
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Task"
    OrgSnapshot:
      description: Состояние снимка оргструктуры после команды
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgSnapshotStatus"
    OrgSnapshotConflict:
      description: >-
        Команда не применима к текущему состоянию — `conflict`, details.reason из
        закрытого списка OrgSnapshotConflictReason: no_candidate (кандидата нет),
        candidate_moved (card_id карточки кандидата сменился — перечитайте статус),
        degenerate_candidate (в карточке 0 людей или 0 членств), no_held
        (задержанного снимка нет), held_moved (card_id задержанной карточки сменился),
        epoch_candidate_pending (есть кандидат эпохи — сначала accept-epoch),
        held_outdated (задержанный снимок уже не следующий по порядку),
        degenerate_held (задержанный первый снимок эпохи без людей или без
        членств — открыть им эпоху нельзя, ждите следующий опрос)
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgSnapshotConflictError"
    Flag:
      description: Флаг и его версия
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Flag"
    PrepAccess:
      description: Список подготовки и его версия
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PrepAccess"
    Validation:
      description: Нарушение схемы или инварианта — `validation`, details.field — поле
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >-
        Нет или протух JWT, неверная подпись, сервисный токен, сессия CRM отозвана —
        `unauthorized`
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        Нет права (planner.access, planner.admin) или токен «View As» —
        `forbidden` (у «View As» details.reason = view_as_not_supported)
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Объекта нет или он не виден — `not_found`
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RevisionMismatch:
      description: >-
        Устаревшая версия в If-Match — `revision_mismatch`, details.current —
        текущее представление объекта; ETag — текущая версия
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >-
        Конфликт — `conflict`: тот же Idempotency-Key с другим телом
        (details.reason = idempotency_key_reused), занятый естественный ключ
        (details.reason называет его: board_code_taken, board_code_reserved),
        отказ изменения участников доски (details.reason: already_member,
        department_manager, org_stale, last_admin, board_archived), конфигурация
        доски сменилась параллельно (details.reason = board_config_changed:
        страховка от гонки со сменой конфигурации доски), нет места
        между соседями задачи (details.reason = position_exhausted); правка или
        отмена отменённого события — details.reason = event_cancelled; библиотека
        шаблонов (3.5) — template_code_taken (код шаблона занят), template_archived
        (шаблон в архиве: не правится и не архивируется снова, доска из него не
        создаётся), template_assigned (шаблон назначен виду доски — не архивируется); у задачи
        уже 100 живых вложений — details.reason = too_many_attachments
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: >-
        Тело JSON больше 1 MiB — `payload_too_large` (до разбора тела); у загрузки
        вложения — файл больше 50 МиБ или тело больше 50 МиБ + 1 МиБ,
        details.max_bytes = 52428800
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionRequired:
      description: Нет If-Match на изменении — `precondition_required`
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: >-
        Планер выключен для этого пользователя (planner.mode ≠ on, при prep — не
        planner.admin и не в списке подготовки) или режим не прочитан —
        `feature_disabled`; CRM не подтвердил сессию — `session_check_unavailable`;
        процесс ещё не готов обслуживать — `service_unavailable`
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >-
        Предел частоты запросов с одного адреса клиента превышен — `rate_limited`;
        заголовок Retry-After (целые секунды) говорит, когда повторить (в
        заголовках ответа не объявлен: CORS маршрута его не выставляет, лента ICS
        идёт мимо CORS).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Ошибка в едином конверте
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Mode:
      type: string
      description: >-
        Положение выключателя planner.mode: off — с API не работает никто (кроме
        /meta и административного API), остальное — 503 feature_disabled; prep —
        работают держатели planner.admin и люди из списка подготовки; on — все с
        planner.access.
      # Значения в кавычках: парсер YAML 1.1 читает голые on/off как булевы.
      enum: ["off", "prep", "on"]
      x-enum-varnames: [ModeOff, ModePrep, ModeOn]
    Meta:
      type: object
      required: [mode, available, versions, flags, org_snapshot_age_minutes, ics_feed_available]
      properties:
        mode:
          $ref: "#/components/schemas/Mode"
        available:
          type: boolean
          description: >-
            Показывать ли раздел этому пользователю: есть planner.access, токен не
            «View As» и (mode = on или mode = prep и пользователь — держатель
            planner.admin или в списке подготовки).
        reason:
          type: string
          enum: [view_as]
          x-enum-varnames: [MetaReasonViewAs]
          description: Почему available = false, если причина — не режим и не право.
        versions:
          $ref: "#/components/schemas/Versions"
        flags:
          type: object
          description: Флаги модулей (без planner.mode), имя → значение.
          additionalProperties:
            type: string
        org_snapshot_age_minutes:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Возраст применённого снимка оргструктуры CRM в целых минутах; null —
            снимок ещё ни разу не применялся или состояние синка не прочитано
            (ответ всё равно 200: доступность решают только флаги). При сбое
            синка остаётся последний применённый снимок, и возраст растёт.
        crm_web_base_url:
          type: string
          description: >-
            Адрес фронта CRM соседнего стенда (схема и хост без завершающего `/`,
            env PLANNER_CRM_WEB_BASE_URL); поля нет — клиент ссылку в CRM не
            показывает.
        ics_feed_available:
          type: boolean
          description: >-
            Стенд выдаёт личную ленту ICS: заданы PLANNER_CRM_API_BASE_URL,
            PLANNER_CRM_WEB_BASE_URL и PLANNER_TRUSTED_PROXIES. false — POST
            /me/ics-feed отвечает 503 `feature_disabled`, лента — 404
            `not_found` (какой бы из трёх переменных ни было), клиент не
            показывает «подписаться». Положение выключателя сюда не входит — его
            отражают mode и available.
    Versions:
      type: object
      required: [api, build]
      properties:
        api:
          type: string
          description: info.version этого файла.
        build:
          type: string
          description: Коммит сборки образа (ldflags), `dev` у локальной сборки.
    Me:
      type: object
      required: [user_id, crm_user_id, permissions, personal_board]
      properties:
        user_id:
          type: string
          format: uuid
          description: UUIDv5 от crm_user_id (тот же, что в HUB).
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        crm_user_id:
          type: integer
          format: int64
          description: auth_db.users.id CRM.
        permissions:
          type: array
          description: Права planner.* из JWT, без дублей, по возрастанию.
          items:
            type: string
        personal_board:
          description: >-
            Личная доска пользователя; null — её нет и создать её не удалось (человека
            нет в зеркале оргструктуры, кандидаты кода кончились, сбой).
          # oneOf с явной веткой null (ревью бота PR #10, раунд 1): по OpenAPI 3.0.3
          # `nullable` действует только рядом с `type` на том же уровне, и связка
          # `nullable` + `allOf`/`$ref` null не пропускает (TestContract_NullableAdmitsNull).
          # x-go-type — поле остаётся *BoardRef, без union-обёртки oapi-codegen.
          x-go-type: "*BoardRef"
          oneOf:
            - $ref: "#/components/schemas/BoardRef"
            - type: object
              nullable: true
              enum: [null]
    BoardRef:
      type: object
      description: Ссылка на доску — id, код и название.
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        code:
          type: string
          pattern: "^[A-Z]{2,10}$"
        name:
          type: string
          minLength: 1
          maxLength: 100
    Flag:
      type: object
      required: [name, value, version]
      properties:
        name:
          type: string
        value:
          type: string
          description: Для planner.mode — off, prep или on.
        version:
          type: integer
          format: int64
          minimum: 0
          description: Версия для If-Match; 0 — строки ещё нет.
    FlagUpdate:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          $ref: "#/components/schemas/Mode"
    PrepUser:
      type: object
      required: [user_id, crm_user_id]
      properties:
        user_id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        crm_user_id:
          type: integer
          format: int64
    PrepAccess:
      type: object
      required: [version, users]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: Версия для If-Match; 0 — список ни разу не задавался.
        users:
          type: array
          description: Люди списка по возрастанию crm_user_id.
          items:
            $ref: "#/components/schemas/PrepUser"
    PrepAccessUpdate:
      type: object
      additionalProperties: false
      required: [crm_user_ids]
      properties:
        crm_user_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
    PeopleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Person"
    Person:
      type: object
      required: [user_id, crm_user_id, full_name, never_logged_in, departments]
      properties:
        user_id:
          type: string
          format: uuid
          description: UUIDv5 от crm_user_id (тот же, что в HUB).
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        crm_user_id:
          type: integer
          format: int64
          description: auth_db.users.id CRM.
        full_name:
          type: string
        never_logged_in:
          type: boolean
          description: Человек ни разу не входил в планер (учёт входов истории 1.2).
        departments:
          type: array
          description: Отделы человека по всем его проектам CRM (отдел роли членства).
          items:
            $ref: "#/components/schemas/PersonDepartment"
    PersonDepartment:
      type: object
      required: [department_id, name, project_id, group]
      properties:
        department_id:
          type: string
          format: uuid
          description: UUIDv5 отдела по схеме HUB.
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        name:
          type: string
        project_id:
          type: string
          format: uuid
          description: UUIDv5 проекта CRM по схеме HUB.
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        group:
          $ref: "#/components/schemas/PersonGroup"
    PersonGroup:
      type: object
      nullable: true
      description: Группа CRM человека в этом отделе; null — группы нет.
      required: [group_id, name]
      properties:
        group_id:
          type: string
          format: uuid
          description: UUIDv5 группы по схеме HUB.
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        name:
          type: string
    OrgSnapshotStatus:
      type: object
      required: [epoch, epoch_pending, epoch_floor, applied, candidate, held, last_attempt_at, last_error_code, last_error_detail, reconcile]
      properties:
        epoch:
          type: integer
          minimum: 1
          description: Эпоха планера (поднимает только accept-epoch).
        epoch_pending:
          type: boolean
          description: Эпоха принята и ждёт первого снимка не ниже epoch_floor.
        epoch_floor:
          type: integer
          format: int64
          nullable: true
          description: >-
            Пол эпохи — номер принятого кандидата; null — эпоху не принимали. После
            accept-epoch куратор перезакрепляет этим числом пол пробы шва
            PLANNER_<ENV>_CRM_SNAPSHOT_FLOOR.
        applied:
          $ref: "#/components/schemas/OrgSnapshotApplied"
        candidate:
          $ref: "#/components/schemas/OrgSnapshotCandidate"
        held:
          $ref: "#/components/schemas/OrgSnapshotHeld"
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        last_error_code:
          type: string
          nullable: true
          description: >-
            Код последней попытки синка: stand, version_regress (кандидат, блок
            кандидатом, номер ниже пола), deactivation_guard (задержка),
            invalid_snapshot, crm_unavailable, crm_bad_response, store; null —
            применён или повтор.
        last_error_detail:
          type: string
          nullable: true
          description: >-
            Уточнение last_error_code (правка куратора 26.09): degenerate_candidate —
            снимок с номером меньше применённого без людей или без членств
            карточкой кандидата не стал (метрика
            planner_org_snapshot_rejected_total{reason="degenerate"}), зеркало
            осталось на применённом снимке и опрос продолжается; null — уточнения
            нет.
        reconcile:
          $ref: "#/components/schemas/OrgSnapshotReconcile"
        command:
          $ref: "#/components/schemas/OrgSnapshotCommand"
    OrgSnapshotCommand:
      type: object
      description: >-
        Только в ответе команды: что она взяла — последний сохранённый номер
        карточки card_id (accept-epoch — пол эпохи, apply-held — применённый
        номер, dismiss-candidate — номер снятой карточки).
      required: [action, card_id, version]
      properties:
        action:
          type: string
          enum: [accept_epoch, apply_held, dismiss_candidate]
          x-enum-varnames: [CommandAcceptEpoch, CommandApplyHeld, CommandDismissCandidate]
        card_id:
          $ref: "#/components/schemas/OrgSnapshotCardID"
        version:
          type: integer
          format: int64
    OrgSnapshotCardID:
      type: string
      pattern: "^[0-9a-f]{32}$"
      description: >-
        Устойчивый id карточки — отпечаток содержания (правка куратора 26.09).
        Снимок того же содержания с большим номером обновляет карточку на месте
        с тем же card_id; другое содержание — новая карточка с новым card_id.
    OrgSnapshotApplied:
      type: object
      nullable: true
      description: Применённый снимок; null — применения ещё не было.
      required: [epoch, version, generated_at, applied_at, age_minutes, people, departments, projects, project_codes]
      properties:
        epoch:
          type: integer
          minimum: 1
          description: Эпоха применённого номера (номера сравнимы только внутри эпохи).
        version:
          type: integer
          format: int64
          description: snapshot_version CRM.
        generated_at:
          type: string
          format: date-time
          nullable: true
          description: generated_at снимка; null — применён до истории 3.1.
        applied_at:
          type: string
          format: date-time
        age_minutes:
          type: integer
          minimum: 0
        people:
          type: integer
          description: Активных людей в зеркале.
        departments:
          type: integer
          description: Активных отделов в зеркале.
        projects:
          type: integer
          description: Активных проектов в зеркале.
        project_codes:
          type: array
          items:
            type: string
    OrgSnapshotCandidate:
      type: object
      nullable: true
      description: >-
        Карточка кандидата новой эпохи — последний снимок с номером меньше
        применённого (или ниже пола ожидающей эпохи); null — кандидата нет. Без
        персональных данных. Пока кандидат есть, не применяется ни один снимок.
      required: [card_id, version, generated_at, seen_at, seen, people, departments, projects, groups, memberships, project_codes]
      properties:
        card_id:
          $ref: "#/components/schemas/OrgSnapshotCardID"
        version:
          type: integer
          format: int64
          description: Номер последнего снимка этого содержания.
        generated_at:
          type: string
          format: date-time
        seen_at:
          type: string
          format: date-time
          description: Когда планер последний раз увидел снимок этого содержания.
        seen:
          type: integer
          minimum: 1
          description: >-
            Сколько раз опрос видел это содержание (отпечаток — множество id CRM
            людей, коды проектов и счётчики; id людей в карточке нет).
        people:
          type: integer
        departments:
          type: integer
        projects:
          type: integer
        groups:
          type: integer
        memberships:
          type: integer
        project_codes:
          type: array
          items:
            type: string
    OrgSnapshotHeld:
      type: object
      nullable: true
      description: >-
        Карточка задержанного снимка; null — задержанного нет. Права идут по
        предыдущему состоянию, пока planner.admin не выполнит apply-held.
      required: [card_id, version, generated_at, seen_at, seen, reason, opens_epoch, people_active, people_absent, people_short, memberships_active, memberships_lost, missing_departments]
      properties:
        card_id:
          $ref: "#/components/schemas/OrgSnapshotCardID"
        version:
          type: integer
          format: int64
          description: Номер последнего сохранённого снимка этой карточки.
        generated_at:
          type: string
          format: date-time
        seen_at:
          type: string
          format: date-time
        seen:
          type: integer
          minimum: 1
          description: >-
            Сколько раз опрос приносил снимок с тем же отпечатком card_id: то же
            множество ставших бы отсутствующими людей, отделов и групп при той же
            основе — у обычной задержки применённый номер, у opens_epoch эпоха,
            карточка-основа и содержание самого снимка (правка по верификации
            26.09: снимок другого состава первой эпохи — новый card_id).
        reason:
          type: string
          enum: [people_deactivation, departments_missing, memberships_wiped]
          x-enum-varnames: [HeldReasonPeopleDeactivation, HeldReasonDepartmentsMissing, HeldReasonMembershipsWiped]
          description: >-
            people_deactivation — снимок сделал бы отсутствующими больше 10 %
            активных людей; departments_missing — пропало больше одного активного
            отдела, а его люди остаются активными; memberships_wiped — применение
            сняло бы больше 10 % активных членств (пар «человек — проект») или все
            (у opens_epoch — членств меньше карточки кандидата больше чем на 10 %
            или ни одного). Проверяются в этом порядке, причина — одна.
        opens_epoch:
          type: boolean
          description: >-
            Первый снимок принятой эпохи (защиты меряются от карточки кандидата:
            счётчиками людей и отделов, а не строками зеркала). У такого снимка
            missing_departments всегда пуст.
        people_active:
          type: integer
          description: База порога — активные люди зеркала (у opens_epoch — люди карточки).
        people_absent:
          type: integer
          description: >-
            Сколько активных людей зеркала применение сделает отсутствующими
            (столько событий planner.person.deactivated уйдёт). У opens_epoch —
            все люди прежней эпохи, которых нет в снимке, а не недостача против
            карточки (она — people_short).
        people_short:
          type: integer
          nullable: true
          description: >-
            Только у opens_epoch: насколько людей в снимке меньше, чем в
            карточке-основе (epoch_baseline) — по этой недостаче сработал порог
            10 %. null у обычной задержки (правка по верификации 26.09).
        memberships_active:
          type: integer
          description: >-
            База порога членств: членства активных людей зеркала (у opens_epoch —
            memberships карточки-основы). В карточке, записанной до появления
            поля, — 0.
        memberships_lost:
          type: integer
          description: >-
            Сколько членств применение сняло бы: у активных людей зеркала,
            остающихся в снимке, — пары «человек — проект», которых в снимке нет
            (перевод в другой проект не считается), и пары, у которых снят отдел
            или группа, оставшиеся в снимке; смена отдела, группы или роли на
            другую — не потеря, пары уходящих людей не считаются. У opens_epoch —
            недостача членств против карточки-основы.
        missing_departments:
          type: array
          description: >-
            Активные отделы зеркала, пропавшие из снимка, пока их люди остаются
            (обычное применение). У opens_epoch список пуст: пропажа меряется
            счётчиками карточки кандидата, отделы прежней эпохи по именам не
            сопоставляются — недостача отделов равна разнице departments карточки
            кандидата (epoch_baseline) и числа отделов снимка.
          items:
            $ref: "#/components/schemas/OrgSnapshotMissingDepartment"
