      summary: Шаблон целиком — конфигурация, политика, закреплённые ключи, версия
      description: >-
        Право planner.templates.manage или planner.boards.create (без обоих — 403);
        держателю только planner.boards.create архивный шаблон — 404, как и
        несуществующий. ETag — версия шаблона (для If-Match PUT и архива).
      responses:
        "200":
