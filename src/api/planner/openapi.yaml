                $ref: "#/components/schemas/TaskAttachmentList"
        "304":
          description: Список не изменился (If-None-Match совпал); тела нет
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ListETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
