    post:
      operationId: uploadTaskAttachment
      tags: [tasks]
      summary: Загрузить файл к задаче
      description: >-
        Проходит право planner.access и выключатель. Тело — multipart/form-data с
        частью file (части до неё пропускаются); имя файла — из заголовка части
        (1–255 символов после обрезки пробелов, без управляющих, bidi- и
        невидимых символов U+200B, U+2060, U+FEFF;
        иначе 400, details.field = file, details.reason = required |
        invalid_name). Тип содержимого определяется по первым 512 байтам,
        заявленный клиентом тип не участвует. Порядок отказов: вложения выключены
        — 503 feature_disabled; нет Idempotency-Key или не UUID — 400
        (details.field = Idempotency-Key); id не UUID — 404; Content-Length больше
        50 МиБ + 1 МиБ — 413 payload_too_large до чтения тела; не multipart или
        нет части file — 400 (details.field = body); задача не видна — 404; нет
        права add_attachment — 403 (до чтения содержимого); файл больше 50 МиБ
        (52 428 800 байт) — 413 payload_too_large с details.max_bytes; пустой файл
        — 400 (details.field = file, details.reason = empty); тот же ключ с другим
        файлом — 409 conflict, details.reason = idempotency_key_reused, с тем же —
        сохранённый ответ 201; у задачи уже 100 живых вложений — 409 conflict,
        details.reason = too_many_attachments. Файл шифруется AES-256-GCM ключом
        файла, обёрнутым PLANNER_ATTACHMENT_KEK, и хранится в томе планера вместе
        с SHA-256 содержимого. Строка вложения, запись attachment_added в истории
        задачи (без имени файла) и событие planner.task.attachment_changed
        пишутся одной транзакцией; версия задачи не меняется. Ответ 201 без ETag.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            UUID команды от клиента (ненулевой). Уникален на человека; повтор с тем же
            файлом отдаёт сохранённый ответ.
          content:
            text/plain:
              schema:
                type: string
        - *xPlannerClient
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Файл до 50 МиБ; имя — из заголовка части (filename).
                  # Тело разбирает хендлер потоком (r.MultipartReader), модель
                  # обёртке не нужна: без x-go-type oapi-codegen тянул бы пакет
                  # runtime/types, которого нет в go.mod.
                  x-go-type: string
      responses:
        "201":
          description: Файл загружен (или сохранённый ответ повтора с тем же ключом)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAttachment"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
