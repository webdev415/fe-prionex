      summary: Добавить пункт чек-листа задачи — в конец списка
      description: >-
        Пункт встаёт в конец чек-листа, done = false (история 3.9, FR-19). Право —
        команда чек-листа (editable_fields содержит checklist: участник доски и
        исполнитель — не член; автор-не член, наблюдатель-не член и planner.admin
        без участия — 403). If-Match — конкретная версия задачи: без него и с `*`
        — 428 `precondition_required`. Так повтор после потерянного ответа
        получает 412 `revision_mismatch` с details.current, где пункт уже есть, и
        второго пункта не создаёт (NFR-10; Idempotency-Key у этой команды нет).
        Порядок отказов: нет If-Match или `*` — 428 → id не UUID — 404 → тело
        (413; нет text или text: null — 400, details.field = text) → задача не
        видна — 404 → нет права — 403 → устаревшая версия (и кривой If-Match) —
        412 с details.current и ETag текущей версии → состояние (400): текст 1–300
        символов не из одних пробелов (details.field = text, reason = length),
        пункт сверх 50 (details.field = checklist, reason = too_many). Версия
        растёт на 1, строка журнала updated и событие planner.task.updated
        (changed: [checklist]) пишутся одной транзакцией.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: >-
            Версия задачи из ETag в кавычках (`"3"`). Обязателен: нет или `*` —
            428 `precondition_required`; не совпал, как и кривое значение, — 412
            `revision_mismatch`.
          content:
            text/plain:
              schema:
                type: string
        - *xPlannerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskChecklistItemCreate"
