      tags: [tasks]
      summary: Удалить пункт чек-листа задачи
      description: >-
        Пункт удаляется физически; ответ — задача с новой версией. Право — как у
        addTaskChecklistItem. Порядок отказов: нет If-Match — 428 → id или item_id
        не UUID — 404 → задача не видна — 404 → нет права — 403 → устаревшая
        версия — 412 с details.current → пункта нет или он чужой задачи — 404
        (повторный DELETE с новой версией — тоже 404). Версия растёт на 1, строка
        журнала updated и событие planner.task.updated (changed: [checklist])
        пишутся одной транзакцией. If-Match: * — любая текущая версия.
      parameters:
