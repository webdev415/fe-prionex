    parameters:
      - *taskID
      - &checklistItemID
        name: item_id
        in: path
        required: true
        description: UUID пункта чек-листа этой задачи (канонический, нижний регистр); иное — 404.
        content:
          text/plain:
            schema:
              type: string
    patch:
      operationId: updateTaskChecklistItem
      tags: [tasks]
      summary: Отметить и (или) переставить пункт чек-листа задачи
      description: >-
        Хоть одно из done и position (пустое тело — 400, details.field = body).
        position — ровно одно из before_id и after_id: сосед — другой пункт той же
        задачи (иначе 400, details.field = position.before_id или
        position.after_id); перестановка события не даёт. Право — как у
        addTaskChecklistItem. Порядок отказов: нет If-Match — 428 → id или item_id
        не UUID — 404 → тело (413, 400) → задача не видна — 404 → нет права — 403
        → устаревшая версия — 412 с details.current → пункта нет или он чужой
        задачи — 404 → состояние (400) → между соседями нет места — 409
        `conflict` с details.reason = position_exhausted (так же, если позиция
        соседа в базе не число — сбой данных: место появится после
        перенумерации). Та же отметка и пункт уже на месте (в том числе повтор той
        же перестановки) — 200 без роста версии. Иначе версия растёт на 1, одна строка
        журнала updated (checklist_item, у перестановки — и position) и, если
        сменилась отметка, событие planner.task.updated (changed: [checklist]).
        If-Match: * — любая текущая версия (повтор команды идемпотентен).
