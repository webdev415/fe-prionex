              type: string
    post:
      operationId: saveBoardAsTemplate
      tags: [templates]
      summary: «Зберегти як шаблон» — новый шаблон из конфигурации доски
      description: >-
        Разрешено только админу доски (руководитель отдела или явный админ; личную
        доску — владельцу) с правом planner.templates.manage (действие доски
        save_as_template в allowed_actions карточки): не видна карточка — 404,
        член, гость, админ без planner.templates.manage и planner.admin без роли
        админа — 403. Шаблон (config_schema_version 3) — копия разделов
        конфигурации доски с новыми id, политика и закреплённые ключи доски; людей
        нет (исполнители по умолчанию и умолчания полей «сотрудник» снимаются); у
        личной доски раздела policy нет (null), locked пуст. Доска без шкалы
        приоритетов — 400 details.field = config.priorities, priority_count; без типа
        по умолчанию — 400 config.task_types, default_count (все нарушения —
        details.errors[]). Код шаблона занят (в том числе архивным) — 409
        template_code_taken. Порядок: 401 → 400 Idempotency-Key → 400 тело (code,
        name) → 404 → 403 → повтор ключа → 400 → 409 → 201. Idempotency-Key (UUID)
        обязателен: повтор с тем же ключом и телом — тот же ответ 201, тот же ключ с
        другим телом — 409 idempotency_key_reused. Строка журнала действий шаблона
        created — той же транзакцией; доска не меняется.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID команды от клиента (ненулевой); повтор с тем же телом отдаёт сохранённый ответ.
          content:
            text/plain:
              schema:
                type: string
        - *xPlannerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAsTemplate"
      responses:
        "201":
          $ref: "#/components/responses/TemplateCreated"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /templates:
