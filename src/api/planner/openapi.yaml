          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              description: >-
                Версия шаблона в кавычках (`"3"`) — значение для If-Match. Только у
                ответа application/json; у превью ETag нет.
              schema:
                type: string
                pattern: '^"[0-9]+"$'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
            application/vnd.prionex.planner.template-preview+json:
              schema:
                $ref: "#/components/schemas/TemplatePreview"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /templates/{template_id}/archive:
    parameters:
