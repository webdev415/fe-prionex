          name: If-Match
          in: header
          required: false
          description: >-
            Версия задачи из ETag в кавычках (`"3"`) или `*` — любая текущая
            версия (RFC 9110 §13.1.1). Обязателен: нет — 428
            `precondition_required`; не совпал, как и кривое значение, — 412
            `revision_mismatch`.
          content:
            text/plain:
              schema:
                type: string
        - *xPlannerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskChecklistItemPatch"
      responses:
        "200":
          $ref: "#/components/responses/Task"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
    delete:
