      description: >-
        Явный админ (заместитель, «диспетчер заявок», запасной), член или гость
        (source = explicit). Решает политика доски: участников меняют админ доски и
        planner.admin; явного админа доски отдела назначают и снимают только
        руководитель отдела и planner.admin, явный админ — 403; чужая личная доска —
        404, своя — 403. If-Match обязателен: нет — 428 `precondition_required`,
        устаревшая или кривая версия — 412 `revision_mismatch` с details.current
        (карточка). Цель — активный человек зеркала оргструктуры (иначе 400,
        details.field = user_id); роль вне списка — 400, details.field = role. 409
        `conflict`: already_member (член или гость, который сейчас вычисленный член
        отдела), department_manager (руководитель отдела из CRM), org_stale (доска
        отдела: снимок оргструктуры старше 15 минут — при смене админов и
        добавлении члена или гостя), last_admin (командная доска теряет последнего
        явного админа), board_archived (доска в архиве — только чтение, участники не
        меняются; не участнику архивной доски — те же 403/404, что у неархивной).
        Админу доски отдела сервер записывает granted_as: staff —
        член отдела, fallback — не из отдела. Та же роль — 200 без изменения
        версии, кроме явного члена или гостя, который сейчас вычисленный член
        отдела: 409 already_member. Изменение, версия +1, строка журнала действий
        и событие planner.board.member_changed пишутся одной транзакцией.
      parameters:
