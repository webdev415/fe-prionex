        add_attachment) и у админа доски; can_attach — актор может загрузить файл.
        Имя файла отдаётся только в ответах API. Вложения выключены (нет
        PLANNER_ATTACHMENT_KEK) — 503 feature_disabled. Ответ несёт сильный ETag
        (хеш тела): совпавший If-None-Match — 304 без тела.
      parameters:
        - *ifNoneMatch
