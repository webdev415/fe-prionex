name: Build and Publish Image

# Story 3.1 created this file: the first workflow that writes into
# git.crm-prionex.com/crm/fe-prionex. Story 3.2 gave it the tagging scheme
# (FR7) and rewrote the fail-closed assertion and the concurrency key.
#
# Trigger is workflow_dispatch ONLY, with a `ref` input, and nothing else.
# Story 3.4 owns the push/tag triggers (FR6) — adding them here is out of scope
# for both 3.1 and 3.2. (FR6 was misattributed to 3.2 in this comment until
# 2026-08-15; corrected by Story 3.1's code review.)
#
# 🔴 Tag shapes are governed by a retention rule that exists ONLY in the Forgejo
# database — no API, no CLI, not restorable from this repository. Some shapes it
# protects forever (`latest`, `buildcache`, `prod-current`, `preprod-current`,
# `v?\d+\.\d+\.\d+.*`, `(pre)?prod-<7-64 hex>`, `sha-<7-64 hex>-(pre)?prod`);
# everything else under `fe-prionex/` expires at 14 days. Removing a protected
# tag needs an authorised DELETE plus a write:package token, which on this
# project has twice required the operator in person. Before adding a tag here,
# compile the rule against it — see docs/migration-decisions.md, section
# "Восстановление правила очистки реестра".
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA).'
        required: true
        type: string
      environment:
        description: 'Target environment. Its API and WebSocket URLs are read from OpenBao and baked into the bundle.'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - preprod
          - prod

  # Story 3.4: this file is now also a CALLABLE workflow, so the automatic path
  # (`ci.yml`, after lint/typecheck/test pass) and the manual path (the dispatch
  # above) run the SAME ~150 lines rather than two copies of them. Two copies of
  # the `keep_pattern` guard is how it drifts from the database.
  #
  # Measured property by property before being relied on — D21. Three things
  # about this block are not stylistic:
  #
  # 1. `environment` is `string` here, not `choice`. `choice` is not a legal
  #    `workflow_call` input type; declaring it makes Forgejo reject the whole
  #    FILE at pre-execution, taking the dispatch half down with it. The
  #    dropdown survives on the dispatch half above. Losing `choice`'s
  #    constraint costs nothing: the `case` in the OpenBao step has always had a
  #    fail-closed `*)` default.
  # 2. There is no `secrets:` block, and there cannot be — the parser rejects
  #    `on.workflow_call.secrets` outright. Callers pass `secrets: inherit`.
  # 3. 🚨 The `concurrency:` block below DOES NOT APPLY when this workflow is
  #    called. The run carries the CALLER's group instead, silently. Every
  #    caller owns its own serialization; see the note on that block.
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref to build. OPTIONAL on this path: leave it unset and the branch
          is derived from GITHUB_REF inside the tag step. See the note there —
          `${{ github.ref_name }}` in a caller''s `with:` came back empty.
        required: false
        default: ''
        type: string
      environment:
        description: 'Target environment: dev, preprod or prod. Validated by the OpenBao step, not by this declaration.'
        required: true
        type: string
      reuse_published_image:
        description: >-
          `'true'` asks this run NOT to rebuild a commit whose
          `sha-<12>-<environment>` image is ALREADY in the registry: the
          `predigest` step below (which runs on every path anyway) becomes the
          decision, the build and the AC2 attach are skipped, and the mutable
          branch tag is re-pointed registry-side at the image that already
          exists. Anything else — including the default — keeps the historical
          behaviour byte for byte.

          Why this exists: `dev-branch-autodeploy.yml`. 🔴 The original reason
          — the weekly reset force-updating `dev` onto an already-published
          `main` commit — turned out to be impossible on this instance (plan
          §12), and the reset now lands a fresh catch-up commit that has no
          image. The case that remains, and the one this input is for, is a
          fast-forward-only merge into `dev` of a branch CI has already built:
          autodeploy then rebuilds a commit that is already published; `vite.config.ts:8` bakes a fresh `Date.now()` into
          every cache-missing build, the digests differ, and the AC2 guard
          below correctly refuses to repoint the protected tag — a red run that
          means nothing, every week, on a stand that is in fact correct. The fix
          is not to weaken the guard (Prohibition 3) but to stop asking it to
          approve a rebuild nobody wants. See
          `docs/dev-weekly-reset-plan.md` §4.1.

          🔴 STRING, not boolean, and compared against the literal `'true'`:
          the same reason `environment` above is a string — this file does not
          spend a pre-execution parse failure (which takes the dispatch half
          down with it) to find out which scalar types this instance's
          `workflow_call` parser accepts. The dispatch half deliberately does
          NOT declare this input: an unset input reads as empty, which is not
          `'true'`, so the manual path keeps the old behaviour with no
          declaration at all.
        required: false
        default: 'false'
        type: string

# Workflow-level concurrency, per Story 3.1 AC5. Story 1.3 proved queueing works
# at workflow level and is silently ignored at job level
# (docs/migration-decisions.md#d8) — this block MUST stay outside `jobs:`.
#
# Keyed on `inputs.ref` since Story 3.2. It was `github.ref` — the ref the
# DISPATCH was issued against — while the content built comes from `inputs.ref`.
# Because this file lives only on `main`, `github.ref` was in practice a
# constant, so the group was one global mutex: it serialised unrelated builds
# and did not guard the collision it existed for.
#
# ⚠️ Story 3.2 could not key this on the built COMMIT, which is what it would
# take to guard the `sha-` tag completely: `concurrency` is evaluated before the
# job starts, so nothing resolved after `actions/checkout` is available here.
# `inputs.ref` is the closest expression that is. Residual gap, recorded rather
# than hidden: two DIFFERENT refs pointing at the SAME commit still land in
# different groups and can race for the same `sha-<short>` tag. Two dispatches
# of the same ref — the common case, and the one AC5 names — are now serialised.
#
# 🚨 Story 3.4 / D21: THIS BLOCK IS DEAD ON THE CALL PATH. When this workflow is
# invoked via `workflow_call`, its run carries the CALLER's concurrency group,
# not this one — measured on the same file: `concurrency_type = 1` when
# dispatched, `0` when called, with no error either way. It is the same silent
# drop already recorded for `jobs.<id>.concurrency` in D8.
#
# So this block governs the DISPATCH path only. Each caller is responsible for
# its own serialization, and each caller's file says which policy it chose and
# why. Do not read the presence of this block as a guarantee for automatic
# builds — it is not one.
concurrency:
  group: build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push
    # 🔴 LABEL DECISION (Story 3.1, Task 2.1 — see the FR5 amendment in
    # _bmad-output/planning-artifacts/epics.md, searchable as "FR5:", and
    # 1-8-prove-action-compatibility-with-a-smoke-workflow.md, "Trap 1").
    # Cited by search string, not by line number: this comment outlives every
    # edit to those files, and the line numbers it originally carried
    # (epics.md:1248, :77-92) were invalidated within the same commit range
    # that shipped it — by this story's own reflow of epics.md. Corrected
    # 2026-08-15 by Story 3.1's code review. The epic's own AC and FR5 name the
    # `docker-build` label. That label resolves to
    # code.forgejo.org/oci/docker:cli, which carries NO Node runtime, so no
    # `uses:` step of any kind executes under it — not actions/checkout, not
    # any docker/* action. Story 1.8 proved this and ran every probe job on
    # `node-20` instead; its own code review filed the unamended epic text as
    # a defect against this story by name. `node-20` loses nothing: the
    # nested dind daemon is reachable from every job container regardless of
    # label, via DOCKER_HOST in container.options (docs/runners/config.yml).
    # Do NOT "correct" this back to docker-build — the job will not fail
    # informatively, it will simply not run any step.
    runs-on: node-20
    # The only ceiling before this was the runner's own `timeout: 2h`, on a host
    # with capacity 2 shared with another tenant's production. A hung build held
    # half the CI capacity for two hours. 30 minutes is generous against the
    # 168 s this job actually takes and against Story 3.1's 170 s.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      # docker-build has no Node runtime, so docker/* actions must run on
      # node-20 instead; that label has no docker CLI of its own, so it is
      # installed here. The nested dind daemon is already reachable via
      # DOCKER_HOST in container.options regardless of label
      # (docs/migration-decisions.md#d12).
      - name: Install docker CLI
        run: |
          apt-get update
          # `jq` joins docker.io here for the fail-closed assertion, which reads
          # the manifest's Descriptor digest by field name rather than by
          # position. Both remain unpinned and unretried — a Debian mirror
          # hiccup fails the build. That is one of four robustness gaps
          # `deferred-work.md` addressed to "whoever next opens build.yml";
          # Story 3.2's review pointed out that 3.2 opened the file and neither
          # did them nor declined them. Declining them here, deliberately:
          # pinning and retry logic want their own run to validate, and this
          # change already needs one for the tagging fixes. `timeout-minutes`
          # below is the one of the four that costs nothing to take now.
          apt-get install -y --no-install-recommends docker.io jq

      - name: Verify docker CLI reaches the nested daemon
        run: docker version

      # 🚨 LOAD-BEARING: driver: docker. The action's default
      # (driver=docker-container) builds and pushes from its OWN BuildKit
      # container, which does NOT inherit this job container's
      # --add-host git.crm-prionex.com:10.67.0.1 mapping — the push dies
      # with a bare `EOF` against the registry's TLS endpoint (recorded in
      # deferred-work.md, Story 3.1 blocker, and 1-8-…md:657-659). Setting
      # driver: docker routes the build AND the push through the nested
      # `dind` daemon itself, which resolves git.crm-prionex.com correctly
      # on its own (10.70.0.1) because container.options' --add-host applies
      # to job containers, not to the daemon's containers, and the daemon's
      # own resolution is what actually carries the push. Do not remove this
      # line to "simplify" the step — the story that proved it found no
      # working alternative except native `docker build`/`docker push`.
      # 🚨 LOAD-BEARING, and for a DIFFERENT reason than four stories recorded.
      #
      # The comment above says the push fails under `docker-container` because a
      # BuildKit container does not inherit the job container's `--add-host`.
      # That is true and it is not the mechanism. Measured 2026-08-16, Story 3.5:
      # the dind container's own `/etc/hosts` holds ONLY localhost entries.
      # `git.crm-prionex.com` arrives by DNS — `nameserver 127.0.0.11`, Docker's
      # embedded resolver, forwarding to the s1 host's resolver, which serves
      # `10.70.0.1 git.crm-prionex.com` from the HOST's `/etc/hosts`.
      #
      # So the real failure was: a BuildKit container on the default bridge loses
      # the embedded resolver, falls back to public DNS, reaches the wrong address
      # and dies with the bare `EOF` Story 1.8 spent a story on. `network=host`
      # puts it in the dind's namespace where 127.0.0.11 is reachable, and the
      # name resolves.
      #
      # 🔴 `network=host` is therefore NOT cosmetic and NOT removable. Take it
      # away and the push dies exactly as it did in Story 1.8. Note also that it
      # reduces isolation — the BuildKit container shares the dind daemon's
      # network namespace. That was weighed and accepted: the alternative is no
      # registry cache at all.
      #
      # Proven by run 660: both tags in `package_version`, full export in the log.
      # This is what unblocked FR9 after four stories of `driver: docker` making
      # `cache-to` impossible.
      # Story 3.5, review 2026-08-17. The BuildKit container needs a network on
      # which `git.crm-prionex.com` resolves to the INTERNAL address. A
      # user-defined bridge gives it Docker's embedded resolver; the default
      # bridge does not, because the dind daemon's own resolver is a loopback
      # address and Docker filters loopback nameservers out for bridge
      # containers. Measured on the dind daemon:
      #
      #   default bridge      git.crm-prionex.com -> 185.185.49.127   (public)
      #   user-defined bridge git.crm-prionex.com -> 10.70.0.1        (correct)
      #
      # That is the whole `EOF` failure Story 1.8 spent a story on: the push
      # reached the public address.
      - name: Create the build network
        env:
          BUILD_NETWORK: fe-prionex-build
        run: |
          set -euo pipefail
          if docker network inspect "$BUILD_NETWORK" >/dev/null 2>&1; then
            echo "network ${BUILD_NETWORK} already exists"
          else
            docker network create "$BUILD_NETWORK"
            echo "network ${BUILD_NETWORK} created"
          fi

      # 🔴 Moved ahead of "Set up Docker Buildx" — Epic 3 retro action A1,
      # run 739. `driver-opts: image=` below now points buildx at a
      # PRIVATE image in our own registry, and creating that builder PULLS
      # it — reproduced directly: an unauthenticated `docker buildx create
      # --driver-opt image=<private>` fails the whole builder-creation step
      # with "authorization failed: no basic auth credentials" before any
      # build step ever runs. Login has to exist before that pull is
      # attempted. This is the exact ordering bug that sank run 739's cache
      # check (a *different* job than this file, but the identical class of
      # mistake — "order of steps = hidden dependency"), caught and fixed
      # there before it ever reached this file. See D26.
      - name: Log in to git.crm-prionex.com
        uses: docker/login-action@v3
        with:
          registry: git.crm-prionex.com
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN_RW }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          # 🔴 NOT `network=host`, and the difference is a security boundary.
          #
          # The stock BuildKit image ships no CNI (`/opt/cni` does not exist),
          # so with `network=host` every `RUN` step — `npm ci` and
          # `npm run build`, executing lifecycle scripts from any branch's
          # lockfile — would inherit the dind daemon's namespace. Measured
          # there: `127.0.0.1:2375` reachable, which is an unauthenticated API
          # on a PRIVILEGED daemon and therefore root-equivalent on s1, plus a
          # direct interface on the network that carries the Forgejo database
          # and OpenBao.
          #
          # On a user-defined bridge alone (measured the same way, and this
          # file's own state from Story 3.5 until Epic 3's retro):
          #   docker API 127.0.0.1:2375 ......... NOT reachable
          #   interfaces on the control-plane net  0
          #   OpenBao 172.20.0.5:8200 ........... still reachable ⚠️
          #   dind gateway 172.17.0.1:2375 ...... still reachable ⚠️
          #   wg-private 10.70.0.0/24 ........... still reachable ⚠️
          #
          # ✅ NARROWED to one /16 by CNI netns isolation, Epic 3 retro action
          # A1, [D26](../../docs/migration-decisions.md#d26) — "closed" was
          # this comment's own earlier, imprecise word for it; D26 lists
          # what the default-deny firewall now covers (all of RFC1918 plus
          # link-local) and what it honestly still does not (IPv6 entirely
          # unfiltered; INPUT to the builder itself only latent; MTU
          # unpinned; `host-local` IPAM's ~254-address pool is never
          # pruned) — read it before repeating either word here.
          # `image=` below points at the image `Dockerfile.buildkit-cni`
          # builds — the stock image plus CNI plugin binaries plus a
          # default-deny `iptables FORWARD` ruleset (sandbox subnet ->
          # every RFC1918/link-local range, four DROP rules, not one keyed
          # to a single volatile container IP), giving each RUN step its
          # OWN network namespace instead of sharing the builder
          # container's. `buildkitd-config-inline` — the inline TOML key
          # `networkMode = "cni"` under `[worker.oci]`, NEVER the CLI flag
          # `--oci-worker-net=cni` (measured broken on this buildkitd
          # build, v0.32.2: flags split into argv correctly but
          # `--oci-cni-config-path` is read as an empty string regardless
          # of what is passed — if you are reading this while trying to
          # reproduce this setup on a command line with that flag, stop,
          # that is the exact broken path) — is what turns CNI on.
          #
          # 🚨 Digest-pinned, not tag-pinned — every build here carries a
          # `write:package`-scoped credential, so a floating tag is an
          # unnecessary supply-chain surface. See Dockerfile.buildkit-cni's
          # own header for the full rationale and
          # .forgejo/workflows/build-buildkit-cni-image.yml for the workflow
          # that publishes this digest (single source of truth for the
          # image NAME stays there — `env.IMAGE_REPO`/`PERMANENT_TAG`; this
          # is the one place in THIS file the digest itself is written, on
          # purpose, so a bump touches exactly one line here).
          #
          # 🔴 Bootstrap resolved inside this PR, not by a post-merge
          # follow-up commit — a real deadlock (runs 755/756, D26) forced
          # this: build.yml already referenced the tag before the tag
          # existed, and the ordinary main-only guard on
          # `build-buildkit-cni-image.yml` couldn't run until merge, which
          # couldn't happen while this branch's own CI was red on that same
          # missing tag. Fixed by a bootstrap exception in that workflow's
          # guard (first creation of an absent tag is not the repoint the
          # guard protects against) — dispatched from THIS branch (run 759,
          # success), which built `v1.0.0-buildkit-cni` from this branch's
          # own hardened `Dockerfile.buildkit-cni` and ran the full
          # staging→verify→promote matrix before writing the tag. Digest
          # read from the registry (coordinator, `read:package`, v2 API,
          # all three manifest media types accepted) and pinned below.
          #
          # ⚠️ The digest below is an OCI IMAGE INDEX
          # (`application/vnd.oci.image.index.v1+json`), not a single
          # platform manifest — the promote step in
          # `build-buildkit-cni-image.yml` runs `docker buildx imagetools
          # create` without `--prefer-index=false`, the same shape Story
          # 3.6 (D24) already found and named. Decided deliberately, not
          # overlooked (D26): `driver-opts: image=` pulls by resolving the
          # index to this runner's own platform manifest either way, so
          # this works correctly as pinned. Left as an index on purpose
          # rather than spending an extra dispatch + tag rewrite to match
          # 3.6's single-manifest convention — that rewrite can only happen
          # through the main-only branch of the guard (the bootstrap
          # exception is now closed, the tag exists), i.e. only after
          # merge, and D26 records it as the documented next version bump
          # (which also gives the main-only guard branch, and the E5
          # matrix, their own live proof — see D26).
          driver-opts: |
            network=fe-prionex-build
            image=git.crm-prionex.com/crm/fe-prionex@sha256:d37900f2ebea1d806f87ead450f2ca097205df757d8b6711a90b416eec836317
          buildkitd-config-inline: |
            [worker.oci]
              networkMode = "cni"
              cniConfigPath = "/etc/buildkit/cni.conflist"
              cniBinaryDir = "/opt/cni/bin"

      # 🚨 Cheap, fail-closed runtime isolation assertion — runs on EVERY
      # real build, not just proven once historically (review round 1 item
      # 3; rule E5: a guard that can fail, exercised continuously, not a
      # one-time proof left to go stale). Uses the same promoted diagnostic
      # image (Dockerfile.netns-isolation-check, formerly
      # Dockerfile.network-probe on the throwaway probe branch) the
      # verify-cni-netns-isolation.yml harness and build-buildkit-cni-
      # image.yml's own verify gate both use, against the SAME two targets
      # review round 2 established as the actually-meaningful ones —
      # NEVER `127.0.0.1:2375`, which measured from inside the sandboxed
      # netns is the sandbox's own loopback and cannot fail under any
      # configuration.
      - name: "Assert RUN-step netns isolation: dind gateway and OpenBao must be unreachable"
        run: |
          set -euo pipefail
          docker buildx build --no-cache \
            --file Dockerfile.netns-isolation-check \
            --build-arg PROBE_HOST=172.17.0.1 \
            --build-arg PROBE_PORT=2375 \
            --build-arg EXPECT_REACHABLE=no \
            --build-arg PROBE_LABEL=build-runtime-assert-dind-gateway \
            .
          docker buildx build --no-cache \
            --file Dockerfile.netns-isolation-check \
            --build-arg PROBE_HOST=172.20.0.5 \
            --build-arg PROBE_PORT=8200 \
            --build-arg EXPECT_REACHABLE=no \
            --build-arg PROBE_LABEL=build-runtime-assert-openbao \
            .

      # ─────────────────────────────────────────────────────────────────────
      # Story 3.3 — the environment's URLs, read from OpenBao, baked in (FR8).
      #
      # 🔴 THIS IS NOT THE STEP STORY 1.12 PROVED, AND IT COULD NOT BE.
      # 1.12 proved an OpenBao read on run 486 and recorded it verbatim so this
      # story could copy it. Its install line is `apk add openbao` — Alpine.
      # 1.12's Task 3 chose that route explicitly on the premise that the build
      # job runs on the `docker-build` label; Story 3.1 then established the
      # opposite and shipped it, because `docker-build` resolves to an image
      # with no Node runtime under which no `uses:` step executes at all (D17).
      # Measured on a job-equivalent `node:20-bookworm`: `bao` absent,
      # `apt-cache policy openbao` EMPTY — no such package in Debian bookworm —
      # while `curl http://openbao:8200/v1/sys/seal-status` returns 200.
      # So D15's option (a) is dead here and option (b), the raw HTTP API that
      # D15 rejected, is the route. Recorded as a deviation from D15.
      #
      # What survives the change of transport is not the syntax but the seven
      # properties 1.12 paid for. Each is implemented below and labelled:
      #   (P1) no credential in any argv — the body goes in on stdin
      #   (P2) fetch the JSON once, extract structurally, never re-parse KEY=VALUE
      #   (P3) allowlist AND denylist the key names (PATH matches the allowlist)
      #   (P4) revoke the token in this block, before anything else runs
      #   (P5) mask with percent-escaping, per line
      #   (P6) assertions that can actually fail
      #   (P7) two preflight failures, two distinct messages
      #
      # 🔴 The token is confidential; the URLs are NOT. D15: «Шесть значений
      # `VITE_*` — публичные URL, вшитые в бандл, который любой посетитель
      # читает в devtools.» That asymmetry is why the token never leaves this
      # block while the URLs are allowed to cross into the build step through
      # $GITHUB_OUTPUT. Any statement that these URLs are secret is a defect.
      # ─────────────────────────────────────────────────────────────────────
      # The environment's app URLs — from Forgejo repository VARIABLES.
      #
      # 🔴 REWIRED 2026-08-27, on Oleg's decision, from OpenBao to `vars.`.
      # The step this replaces authenticated to OpenBao per environment, read
      # `secret/fe/<env>/app`, validated its key names, and extracted exactly
      # two values: VITE_API_BASE_URL and VITE_WS_URL. Nothing else in this
      # workflow consumed that KV, so OpenBao's entire role here was those two
      # strings.
      #
      # Why the change: `VITE_API_BASE_URL_{DEV,PREPROD,PROD}` and the matching
      # `VITE_WS_URL_*` already existed as repository variables — the `_PREPROD`
      # pair was added deliberately for Option C (`#d2`) alongside the existing
      # `_DEV`/`_PROD` — and NOTHING READ THEM. Two sources of truth for one
      # build-time value, and they happened to agree, so the divergence was
      # invisible until someone tried to repoint production and edited the one
      # that does nothing (2026-08-27, `#d43` §10a).
      #
      # ⚠️ CONSEQUENCE, NAMED RATHER THAN LEFT TO BE FOUND: the six OPENBAO_*
      # secrets are no longer read by this workflow. Deleting them, and
      # deciding what remains of `#d15`'s provisioning, is a SEPARATE decision
      # and is NOT taken here. What is taken here is the availability win: a
      # build no longer fails because OpenBao is unreachable, for a value the
      # build did not get from it anyway.
      #
      # ⚠️ AND THE ONE THIS DOES NOT TOUCH: `.github/workflows/CD.yml` reads
      # `secrets.VITE_API_BASE_URL_PROD` on the GitHub side and builds what s2
      # serves — where the live users are. `#d7` puts that side out of scope.
      # The two pipelines now read two different stores with the same names.
      #
      # Modelled on the `Select the operator phone URL` step below, which has
      # used `vars.` since Story 3.x — the pattern is not new here, only its
      # application to these two values.
      - name: Select the app URLs for this environment
        id: app_urls
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          API_DEV: ${{ vars.VITE_API_BASE_URL_DEV }}
          API_PREPROD: ${{ vars.VITE_API_BASE_URL_PREPROD }}
          API_PROD: ${{ vars.VITE_API_BASE_URL_PROD }}
          WS_DEV: ${{ vars.VITE_WS_URL_DEV }}
          WS_PREPROD: ${{ vars.VITE_WS_URL_PREPROD }}
          WS_PROD: ${{ vars.VITE_WS_URL_PROD }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev)     API_URL="${API_DEV:-}";     WS_URL="${WS_DEV:-}" ;;
            preprod) API_URL="${API_PREPROD:-}"; WS_URL="${WS_PREPROD:-}" ;;
            prod)    API_URL="${API_PROD:-}";    WS_URL="${WS_PROD:-}" ;;
            *) echo "FAIL: unknown environment '${ENVIRONMENT}'."; exit 1 ;;
          esac

          SUFFIX="$(printf '%s' "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')"

          # Carried over verbatim in intent from the OpenBao step this replaces.
          # AC2: an empty OR MISSING OR PLACEHOLDER value fails the build with the
          # variable named. The placeholder test is a SCHEME test, not a string
          # match -- a literal blocklist ages badly, and the original comment
          # recorded a real placeholder that had sat in the store unnoticed.
          _check_url() {
            _name="$1"; _val="$2"; _want="$3"
            if [ -z "$_val" ]; then
              echo "FAIL: ${_name} is empty or unset for environment '${ENVIRONMENT}'."
              echo "  It comes from the Forgejo repository variable ${_name}_${SUFFIX}."
              echo "  Refusing to bake a build that would ship pointing at nothing."
              return 1
            fi
            if printf '%s' "$_val" | grep -q '[[:space:]]'; then
              echo "FAIL: ${_name}_${SUFFIX} contains whitespace ('${_val}')."
              return 1
            fi
            case "$_val" in
              "${_want}://"?*) ;;
              *) echo "FAIL: ${_name}_${SUFFIX} is '${_val}', which does not start with" \
                      "'${_want}://'. A placeholder or a wrong-scheme value reaches the" \
                      "browser baked into the bundle and cannot be fixed without a rebuild." ; return 1 ;;
            esac
            _host="${_val#*://}"; _host="${_host%%/*}"
            case "$_host" in
              *.*) ;;
              *) echo "FAIL: ${_name}_${SUFFIX} has scheme '${_want}' but no host with a dot in" \
                      "it ('${_host}'). A bare scheme passed the first version of this check."; return 1 ;;
            esac
          }

          _check_url VITE_API_BASE_URL "$API_URL" https || exit 1
          _check_url VITE_WS_URL       "$WS_URL"  wss   || exit 1

          echo "VITE_API_BASE_URL for '${ENVIRONMENT}': ${API_URL}"
          echo "VITE_WS_URL       for '${ENVIRONMENT}': ${WS_URL}"
          { echo "api_url<<__EOF__"; printf '%s\n' "$API_URL"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"
          { echo "ws_url<<__EOF__";  printf '%s\n' "$WS_URL";  echo "__EOF__"; } >> "$GITHUB_OUTPUT"
          echo "OK: both variables present and scheme-checked for '${ENVIRONMENT}'."

      # ─────────────────────────────────────────────────────────────────────
      # Story 3.2 — the tagging scheme (FR7).
      #
      # 🔴 EVERY VALUE IS READ FROM THE CHECKED-OUT TREE, NEVER FROM THE EVENT.
      # Under workflow_dispatch, `github.ref` and `github.sha` describe the ref
      # the DISPATCH was issued against, not `inputs.ref`, which is what the
      # checkout step actually fetched. Dispatch a build of `feature/x` from
      # `main` and an event-derived tag set labels that image `main`. This is
      # the same confusion Story 3.1 shipped in its concurrency key, one step
      # further down, and it is why `docker/metadata-action` is NOT used here:
      # its `type=ref` / `type=sha` sources read the event payload, and the only
      # form ever proven on this instance is `type=raw` (Story 1.8, run 385),
      # which supplies no sanitizer and therefore no reason to add the action.
      #
      # SANITIZER (Story 3.2 AC2), stated so a consumer can reimplement it —
      # Story 4.3 deploys DEV by ref and must derive the same string:
      #   1. replace each run of characters outside [a-zA-Z0-9._-] with one `-`
      #   2. strip leading `.` and `-` (a tag may not start with either)
      #   3. truncate to 100 chars — the OCI ceiling is 128, and the margin is
      #      deliberate: Story 3.3 appends `-preprod` (8) to this string.
      # Validated against all 502 remote branches: 502 distinct outputs, zero
      # collisions, every output valid per [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127},
      # longest 100. NOT the `sed 's/refs\/heads\///'` in .github/workflows/
      # CD.yml, which leaves interior slashes and is a recorded defect.
      #
      # SHORT SHA IS PINNED AT 12, deliberately, and not inherited from
      # `git rev-parse --short` (whose length grows with repository size) nor
      # from metadata-action's `type=sha` (fixed at 7). The retention rule's
      # keep_pattern accepts [0-9a-f]{7,64} for the -prod/-preprod-suffixed
      # shape, so 7 would sit on the floor with zero margin; 12 leaves room and
      # is still short enough to read. 🔴 Stories 5.4 and 6.5 MUST use this same
      # 12-character short SHA when they build `preprod-<sha>` / `prod-<sha>`:
      # the promotion guard compares those strings byte for byte against what is
      # emitted here, and a length mismatch fails every legitimate release.
      # Story 3.6 follow-up, 2026-08-17. NOT a secret, so it comes from a Forgejo
      # CI variable rather than OpenBao — Oleg's call, and correct: a public
      # front-end origin is not a credential.
      #
      # 🔴 Why this step exists at all. `VITE_OPERATOR_PHONE_URL` was outside the
      # Dockerfile's build-arg contract, so every image CI has ever produced had
      # it undefined, and the app fell back to `http://localhost:5173` — the
      # origin it posts its JWT to. That string was verified present in the
      # shipped preprod layer. On an operator's machine that origin is their own
      # machine, and 5173 is Vite's default port.
      #
      # ✅ EMPTY IS THE DECIDED ANSWER for dev and preprod — Oleg, 2026-08-17:
      # those environments do not get an operator phone. It is not a gap waiting
      # to be filled and should not be re-raised. Consistent with the
      # infrastructure: `phone.crm-prionex.online` answers 200,
      # `phone.crm.preprod.crm-prionex.online` is NXDOMAIN.
      #
      # Empty makes the panel not render, which is correct behaviour and not a
      # silent fallback: the alternative was pointing at localhost.
      #
      # 🔴 `prod` is the exception and fails closed. A production build without
      # the phone URL is a functional regression, and the variable exists.
      - name: Select the operator phone URL for this environment
        id: phone
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PHONE_DEV: ${{ vars.VITE_OPERATOR_PHONE_URL_DEV }}
          PHONE_PREPROD: ${{ vars.VITE_OPERATOR_PHONE_URL_PREPROD }}
          PHONE_PROD: ${{ vars.VITE_OPERATOR_PHONE_URL_PROD }}
        run: |
          set -euo pipefail

          case "$ENVIRONMENT" in
            dev)     PHONE_URL="${PHONE_DEV:-}" ;;
            preprod) PHONE_URL="${PHONE_PREPROD:-}" ;;
            prod)    PHONE_URL="${PHONE_PROD:-}" ;;
            *) echo "FAIL: unknown environment '${ENVIRONMENT}'."; exit 1 ;;
          esac

          if [ -n "$PHONE_URL" ]; then
            # Scheme and host, tested as properties rather than by spelling —
            # the same discipline the OpenBao step uses, and for the same reason.
            case "$PHONE_URL" in
              https://?*.?*) ;;
              *) echo "FAIL: VITE_OPERATOR_PHONE_URL for '${ENVIRONMENT}' is" \
                      "'${PHONE_URL}', which is not an https URL with a dotted host." \
                      "This value becomes an iframe origin that receives a JWT."; exit 1 ;;
            esac
            # `if` rather than `&&`: under `set -e` a failing `grep` in an
            # AND-list ends the script. That trap has already cost this file once.
            if printf '%s' "$PHONE_URL" | grep -q '[[:space:]]'; then
              echo "FAIL: VITE_OPERATOR_PHONE_URL contains whitespace."; exit 1
            fi
            echo "operator phone for '${ENVIRONMENT}': ${PHONE_URL}"
          else
            if [ "$ENVIRONMENT" = prod ]; then
              echo "FAIL: a prod build must carry an operator phone URL, and" \
                   "vars.VITE_OPERATOR_PHONE_URL_PROD is empty. Shipping prod with the" \
                   "phone disabled is a regression; shipping it pointing at localhost is" \
                   "the defect this check exists for."; exit 1
            fi
            echo "operator phone for '${ENVIRONMENT}': NOT CONFIGURED — the panel will not render."
          fi

          { echo "phone_url<<__EOF__"; printf '%s\n' "$PHONE_URL"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────────────────
      # OpenReplay session replay — the project key and the ingest URL.
      #
      # The key is PUBLIC by nature: it is inlined into the bundle every browser
      # downloads. So it lives in a repository VARIABLE, like the phone URL above
      # and unlike anything in OpenBao. Treating it as a secret would be theatre.
      #
      # 🔴 THIS STEP NEVER FAILS, deliberately, unlike both steps above it.
      # An absent variable means "the tracker is off for this environment", and
      # that is a real state rather than a misconfiguration: environments are
      # switched on ONE AT A TIME (dev first, then preprod, then prod), and the
      # act of adding the variable IS the switch. A build for an environment that
      # has not been switched on yet must stay green — an `exit 1` here would turn
      # a deliberate rollout order into a wall of red releases.
      #
      # Both halves are required together: an ingest URL with no key, or a key
      # with no ingest URL, is not a usable configuration, so the pair is blanked
      # rather than passed on half-set. src/lib/openreplay/config.ts applies the
      # same rule on its side; this one exists so the build log SAYS which it was.
      #
      # `ingest` is one variable for all three environments on purpose: there is a
      # single OpenReplay backend and three projects inside it. Three copies of one
      # URL would be three places to drift apart.
      - name: Select the OpenReplay project key for this environment
        id: openreplay
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          OR_KEY_DEV: ${{ vars.VITE_OPENREPLAY_PROJECT_KEY_DEV }}
          OR_KEY_PREPROD: ${{ vars.VITE_OPENREPLAY_PROJECT_KEY_PREPROD }}
          OR_KEY_PROD: ${{ vars.VITE_OPENREPLAY_PROJECT_KEY_PROD }}
          OR_INGEST: ${{ vars.VITE_OPENREPLAY_INGEST_URL }}
          OR_PRIV_DEV: ${{ vars.VITE_OPENREPLAY_PRIVATE_MODE_DEV }}
          OR_PRIV_PREPROD: ${{ vars.VITE_OPENREPLAY_PRIVATE_MODE_PREPROD }}
          OR_PRIV_PROD: ${{ vars.VITE_OPENREPLAY_PRIVATE_MODE_PROD }}
        shell: bash
        run: |
          set -euo pipefail

          # `*)` is the only failure in this step, and it is NOT belt-and-braces:
          # the three-value `choice` exists on workflow_dispatch only, while the
          # workflow_call input is a plain string (a callee may not declare
          # `choice`). Any caller can pass anything.
          case "$ENVIRONMENT" in
            dev)     OR_KEY="${OR_KEY_DEV:-}";     OR_PRIV="${OR_PRIV_DEV:-}" ;;
            preprod) OR_KEY="${OR_KEY_PREPROD:-}"; OR_PRIV="${OR_PRIV_PREPROD:-}" ;;
            prod)    OR_KEY="${OR_KEY_PROD:-}";    OR_PRIV="${OR_PRIV_PROD:-}" ;;
            *) echo "FAIL: unknown environment '${ENVIRONMENT}'."; exit 1 ;;
          esac

          OR_INGEST="${OR_INGEST:-}"

          if [ -n "$OR_KEY" ] && [ -n "$OR_INGEST" ]; then
            # 🔴 HISTORY OF THIS SPOT, because two things stood here and both are
            # gone, and a future reader must not have to reconstruct why.
            #
            # 1. A GATE. A prod build carrying a non-empty OpenReplay key failed
            #    here, before `docker build`, naming KAN-KB-54. Its own text said
            #    "remove this gate as part of that task, not around it".
            # 2. A WARNING. The gate was removed on 2026-09-17 by explicit
            #    decision while KAN-KB-54 was still open (KAN-KB-58), and a
            #    `::warning::` took its place. A warning stops nothing; it was an
            #    honest label on an open hole, not a guard.
            #
            # ⚠️ PROD WITH A KEY BEFORE PHASE 6 IS ACCEPTED: A WARNING, NOT A GATE.
            #
            # History, so nobody reconstructs it from the log: a gate stood here
            # (prod build with a key fails, naming KAN-KB-54); it was removed on
            # 2026-09-17 by explicit decision while the task was open (KAN-KB-58)
            # and a `::warning::` took its place; KAN-KB-54 then landed the
            # markup. Code review (rounds 2–4) asked for the gate back until phase
            # 6 — a walk through one real DEV recording — is recorded, and a
            # version of this file did restore it as `exit 1`, keyed to
            # `docs/openreplay-pii-acceptance.md`. Oleg's decision (2026-09-18):
            # a prod build must NOT fail on this. So the same condition emits a
            # warning instead. Recorded as a decision, not disguised as cleanup.
            #
            # What is therefore true, in one sentence a future reader must not
            # have to reconstruct: the markup is in place and `npm run pii-audit
            # -- --check` guards the SOURCE half of it in CI (names and addresses
            # by dictionary, attributes, iframes, HTML sinks; NOT free text,
            # which is advisory, and NOT any value the dictionary has no name
            # for). Acceptance on a real recording is the control still missing,
            # and setting `VITE_OPENREPLAY_PROJECT_KEY_PROD` before it is
            # recorded is a choice this warning makes visible, not one it stops.
            #
            # Committing `docs/openreplay-pii-acceptance.md` (what was checked,
            # on which recording, by whom, when — see
            # docs/openreplay-pii-checklist.md) silences it. Nothing else should.
            if [ "$ENVIRONMENT" = prod ] && [ ! -s docs/openreplay-pii-acceptance.md ]; then
              echo "::warning::OpenReplay is ENABLED for PROD before phase 6 of KAN-KB-54 (acceptance on a real DEV recording) was recorded. The PII markup is in place and CI-guarded; the human pass over a recording is not. Perform it per docs/openreplay-pii-checklist.md and commit docs/openreplay-pii-acceptance.md."
            fi
            # The key is not secret, but there is no reason to print it either.
            echo "OpenReplay for '${ENVIRONMENT}': ENABLED (ingest ${OR_INGEST})"
          else
            echo "OpenReplay for '${ENVIRONMENT}': NOT CONFIGURED - the tracker will not start."
            echo "  key present: $([ -n "$OR_KEY" ] && echo yes || echo no);" \
                 "ingest present: $([ -n "$OR_INGEST" ] && echo yes || echo no)"
            OR_KEY=""; OR_INGEST=""
          fi

          # Passed through as-is: config.ts reads empty as "off", so normalising
          # it here would put the same rule in two places.
          echo "OpenReplay privateMode for '${ENVIRONMENT}': ${OR_PRIV:-<unset> -> OFF}"

          { echo "project_key<<__EOF__"; printf '%s\n' "$OR_KEY";     echo "__EOF__"; } >> "$GITHUB_OUTPUT"
          { echo "ingest<<__EOF__";      printf '%s\n' "$OR_INGEST";  echo "__EOF__"; } >> "$GITHUB_OUTPUT"
          { echo "private_mode<<__EOF__"; printf '%s\n' "${OR_PRIV:-}"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"

      # Credit block in the CRM client card (WS-11, story 14-7).
      #
      # Modelled on the two steps above, with one deliberate difference: this is
      # a BOOLEAN feature flag, not an address. An address that is missing ships
      # a build pointing at nothing, so the URL step fails; a missing flag means
      # "the block is off", which is the correct state for every environment that
      # has not switched it on. So an unset or empty variable defaults to `false`
      # and the build goes on.
      #
      # What DOES fail the build is a value that is neither `true` nor `false`:
      # `import.meta.env.VITE_CREDIT_MODULE_ENABLED === 'true'` silently reads
      # `True`, `1` and `yes` as OFF, and an operator who set the variable would
      # be left looking for a block that the build had quietly dropped.
      - name: Select the credit-block flag for this environment
        id: credit_flag
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CREDIT_DEV: ${{ vars.VITE_CREDIT_MODULE_ENABLED_DEV }}
          CREDIT_PREPROD: ${{ vars.VITE_CREDIT_MODULE_ENABLED_PREPROD }}
          CREDIT_PROD: ${{ vars.VITE_CREDIT_MODULE_ENABLED_PROD }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev)     CREDIT="${CREDIT_DEV:-}" ;;
            preprod) CREDIT="${CREDIT_PREPROD:-}" ;;
            prod)    CREDIT="${CREDIT_PROD:-}" ;;
            *) echo "FAIL: unknown environment '${ENVIRONMENT}'."; exit 1 ;;
          esac

          SUFFIX="$(printf '%s' "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')"
          CREDIT="${CREDIT:-false}"

          case "$CREDIT" in
            true|false) ;;
            *)
              echo "FAIL: VITE_CREDIT_MODULE_ENABLED_${SUFFIX} is '${CREDIT}'."
              echo "  Only 'true' or 'false' are accepted: the bundle compares the"
              echo "  value to the literal string 'true', so anything else silently"
              echo "  means OFF and hides the credit block with no signal."
              exit 1 ;;
          esac

          echo "Credit block for '${ENVIRONMENT}': ${CREDIT} (repository variable VITE_CREDIT_MODULE_ENABLED_${SUFFIX})"
          { echo "credit_enabled<<__EOF__"; printf '%s\n' "$CREDIT"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"

      - name: Compute tags from the checked-out commit
        id: tags
        # 🔴 `inputs.ref` reaches this script through `env:`, NEVER through
        # `${{ }}` inside the `run:` body. A `${{ }}` expression is substituted
        # textually BEFORE bash parses the line, so `REF_IN="${{ inputs.ref }}"`
        # executes whatever a `$(...)`, a backtick or a closing quote in the ref
        # says — and git permits all of them in a branch name
        # (`git check-ref-format --branch 'feat/$(id)'` exits 0). By this point
        # in the job `docker/login-action` has already written REGISTRY_TOKEN_RW
        # into the docker config: an org-scope `write:package` credential over a
        # namespace holding another team's production. Found by Story 3.2's own
        # code review, in Story 3.2's own code. `env:` passes the value as data,
        # after parsing, and cannot execute.
        env:
          REF_IN: ${{ inputs.ref }}
          # Story 3.3's discriminator. Declared here as well as on the OpenBao
          # step because `env:` is per-step — a value set on one step is not
          # visible in the next, and `set -u` turns that into an unbound-variable
          # abort rather than an empty tag. That is the right failure and it
          # still cost a dispatch.
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          FULL_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(printf '%s' "$FULL_SHA" | cut -c1-12)"
          # 🔴 Story 3.4: derive the ref when the caller could not name it.
          #
          # A `workflow_call` caller has no reliable way to pass the branch. The
          # first attempt passed github.ref_name (written with the expression
          # syntax, which is deliberately NOT reproduced here — Forgejo substitutes
          # it inside comments too, and this file's rule is that no such expression
          # appears anywhere in a `run:` body) in `ci.yml`'s
          # `with:` and it arrived EMPTY — run 632 failed here, on the guard
          # below, with `ref '' sanitizes to an empty string`. The expression
          # context available where `with:` is evaluated does not carry
          # `ref_name`, and guessing which expression does carry it costs a
          # ~540s CI run per guess.
          #
          # So it is derived here instead, in bash, from `GITHUB_REF` — a plain
          # runner environment variable that the legacy `.github/workflows/CD.yml`
          # already depended on, and which bash can slice in ways GitHub
          # expressions cannot (there is no substring function in that language).
          #
          # Fail-closed on everything that is not a branch, including a
          # pull-request ref. That is defence in depth, not redundancy: `ci.yml`
          # also keeps this job off pull requests with an `if:`, and this guard
          # holds even if that `if:` stops working — which is exactly what
          # happened once already (D21: a `uses:` job's `if:` is copied down into
          # the callee and re-evaluated there).
          if [ -z "${REF_IN:-}" ]; then
            # 🔴 Review finding 2026-08-16: this fallback was EVENT-BLIND, and that
            # weakened a guarantee that existed before Story 3.4 touched this file.
            # On the dispatch path an empty `ref` used to fail closed. With an
            # unconditional fallback it would instead silently build whatever
            # branch the dispatch was issued against — with the environment the
            # OPERATOR chose, `prod` included, whose `sha-…-prod` tag is permanent
            # and needs a human with a write:package token to remove.
            #
            # The callee's `GITHUB_EVENT_NAME` is reliably `workflow_call` (D21 —
            # it is the one context value Forgejo synthesizes per job), so scoping
            # the fallback to it restores the dispatch path's fail-closed
            # behaviour exactly.
            if [ "${GITHUB_EVENT_NAME:-}" != "workflow_call" ]; then
              echo "FAIL: no ref was supplied and this is not a called run" \
                   "(event '${GITHUB_EVENT_NAME:-}'). Deriving one here would build" \
                   "whatever branch the dispatch was issued against, under the" \
                   "environment you selected. Supply 'ref' explicitly."; exit 1
            fi
            _gr="${GITHUB_REF:-}"
            case "$_gr" in
              refs/heads/*)
                REF_IN="${_gr#refs/heads/}"
                echo "ref: not supplied by the caller; derived '${REF_IN}' from GITHUB_REF." ;;
              refs/pull/*)
                echo "FAIL: this run is on a pull-request ref (${_gr}). Building an image" \
                     "here would tag it after the PR number, not a branch." ; exit 1 ;;
              *)
                echo "FAIL: no ref was supplied and GITHUB_REF ('${_gr}') is not a branch" \
                     "ref. Refusing to invent a tag name." ; exit 1 ;;
            esac
          fi

          SANITIZED="$(printf '%s' "$REF_IN" \
            | sed -E 's/[^a-zA-Z0-9._-]+/-/g' | cut -c1-100)"

          # 🔴 Review finding 2026-08-16, and it was a silent tag-capture bug.
          #
          # This sed used to end `s/^[.-]+//`, stripping any leading dots and
          # dashes left behind by the substitution. That looked like tidying and
          # was not: a ref whose FIRST characters are outside the tag grammar has
          # them collapsed to a single `-`, which the strip then deletes — so the
          # ref's remainder is promoted to a tag it does not own.
          #
          #   тест-main            ->  --main   ->  main            ->  main-dev
          #   фича.main            ->  -.main   ->  main            ->  main-dev
          #   проба-story-3-4-impl ->  ...      ->  story-3-4-impl  ->  (existing tag)
          #   оплата-v2, платеж-v2 ->  -v2      ->  v2              ->  both, one tag
          #
          # Nothing downstream refuses these. `latest_eligible` tests the RAW ref;
          # `main` is not in `keep_pattern`; the digest assertion compares the run
          # against its own tags and passes. The build goes green and a feature
          # branch has overwritten `main-dev` — which is precisely the tag Story
          # 4.6 resets the DEV stand to. In a project whose entire written record
          # is Russian, `фикс-main` is an ordinary branch name, not a contrived one.
          #
          # Refusing is exactly targeted: `git check-ref-format` already forbids a
          # branch beginning with `.` or `-`, so after substitution a leading `.`
          # or `-` can ONLY mean the ref began with characters outside the grammar.
          # No legitimate ASCII branch name reaches this guard.
          case "$SANITIZED" in
            [.-]*)
              _would="$(printf '%s' "$SANITIZED" | sed -E 's/^[.-]+//')"
              echo "FAIL: ref '${REF_IN}' begins with characters that are not legal in a" \
                   "Docker tag. Dropping them would produce the tag '${_would}-<env>', which" \
                   "belongs to a DIFFERENT ref — pushing it would silently overwrite that" \
                   "ref's image. Rename the branch to begin with [a-zA-Z0-9]."; exit 1 ;;
          esac

          # No silent fallback. An empty result means the ref was composed
          # entirely of characters outside the tag grammar — every Cyrillic ref
          # does this, in a project whose whole written record is in Russian.
          # The first version substituted the literal `ref` here, which is a
          # value fallback wearing an `if` instead of a `||`: two commits would
          # land on one meaningless tag and overwrite each other undetected.
          if [ -z "$SANITIZED" ]; then
            echo "FAIL: ref '${REF_IN}' sanitizes to an empty string — nothing in it" \
                 "is legal in a Docker tag. Refusing to invent a tag name."; exit 1
          fi

          IMAGE=git.crm-prionex.com/crm/fe-prionex

          # Story 3.3 — the environment discriminator (FR8, AC3).
          #
          # 🔴 The SHAPE IS FIXED BY LIVE INFRASTRUCTURE, not by the plan. The
          # retention rule protects `sha-[0-9a-f]{7,64}-(pre)?prod` and nothing
          # adjacent, so `-prod` and `-preprod` are PERMANENT and `-dev` falls
          # through and expires at 14 days. That asymmetry is correct policy —
          # DEV images are disposable, release candidates and production images
          # are not — but FR11 describes the rule as removing "`<branch>` tags",
          # which understates it badly. Any other spelling of the discriminator
          # (`_prod`, `-production`, `prod-sha-…`) falls out of protection
          # SILENTLY and takes the Epic 6 rollback target with it.
          #
          # The short SHA stays at 12 (Story 3.2's decision): Stories 5.4 and 6.5
          # compare `preprod-<sha>` byte for byte against what is emitted here.
          ENV_SUFFIX="${ENVIRONMENT}"

          # AC1 of Story 3.2, now discriminated. The bare `sha-<short>` is gone:
          # FR8 requires a discriminator and Story 3.3 AC3 requires that a bare
          # `sha-<short>` never be ambiguous between environments. Under Option C
          # one commit yields up to three images, so the bare form cannot be
          # unambiguous and cannot be kept — Story 3.2 kept it only because it
          # built one image per commit and 3.6 AC2 permitted the repoint.
          # 🔴 Consequence for FR7, NFR4, Story 3.4 AC2 and Story 3.6 AC1, all of
          # which address images by the bare `sha-<short>`: they must now address
          # them by `sha-<short>-<env>`. Recorded as an FR7 deviation.
          TAGS="${IMAGE}:sha-${SHORT_SHA}-${ENV_SUFFIX}"

          # AC2: the branch tag, sanitized above.
          #
          # 🔴 GUARD, not prose. The story's Prohibition 4 says "do not push any
          # tag matching keep_pattern unless it is a recorded decision" — and
          # until Story 3.2's code review, nothing enforced it. `inputs.ref` is
          # documented as "branch, tag, or SHA", every one of these is a legal
          # git branch name, and each sanitizes to ITSELF straight into a
          # permanent tag:
          #
          #   latest  buildcache  prod-current  preprod-current
          #   v1.2.3  1.2.3  1.2.3-anything  prod-<7-64 hex>  preprod-<7-64 hex>
          #   sha-<7-64 hex>-prod  sha-<7-64 hex>-preprod
          #
          # This repository already names branches `release-v1.3.1`…`release-v1.4.2`,
          # so `v1.4.3` as a branch is ordinary, not contrived. Pushing
          # `prod-current` would repoint the production pointer Epic 6 depends on
          # — from an image built with throwaway build-args — and no retention
          # rule will ever remove it: `keep_pattern` is consulted before
          # `remove_pattern`, so protected means protected at any age. Removal
          # costs an authorised DELETE plus a `write:package` token, which on
          # this project has twice required the operator in person.
          #
          # The pattern below is the live rule's `keep_pattern`, minus its
          # `fe-prionex/` prefix and its `sha256:` alternative (a digest can
          # never be a ref name). Keep it in step with the database — the rule
          # lives ONLY there and cannot be restored from this repository.
          # Story 3.3 tightened this from globs to the rule's own regex. The glob
          # form over-refused: `prod-prod` — which is what branch `prod` plus the
          # `-prod` discriminator produces, and branches named `dev`, `preprod`
          # and `prod` have existed since D19 — matched `prod-*` while the actual
          # keep_pattern alternative is `(pre)?prod-[0-9a-f]{7,64}` and requires
          # hex. Refusing is the safe direction, but refusing a legitimate build
          # of the `prod` branch is still a defect. The pattern below is the live
          # rule's keep_pattern minus its `fe-prionex/` prefix and its `sha256:`
          # alternative (a digest can never be a ref name).
          # 🔴 Keep it in step with the database — the rule lives ONLY there.
          KEEP_RE='^(prod-current|preprod-current|latest|buildcache|v?[0-9]+\.[0-9]+\.[0-9]+.*|(pre)?prod-[0-9a-f]{7,64}|sha-[0-9a-f]{7,64}-(pre)?prod)$'
          # ⚠️ `-i` is a deliberate third divergence from the stored pattern, on top
          # of dropping the `fe-prionex/` prefix and the `sha256:` alternative: the
          # registry folds case on write, so a case-sensitive test here would miss
          # `LATEST`. Named because the instruction above is "keep it in step with
          # the database", and an unnamed divergence is how that instruction rots.
          if printf '%s' "$SANITIZED" | grep -Eqi "$KEEP_RE"; then
            echo "FAIL: ref '${REF_IN}' sanitizes to '${SANITIZED}', which matches the" \
                 "registry retention rule's keep_pattern. That tag would be PERMANENT and" \
                 "removable only by an authorised DELETE with a write:package token." \
                 "Refusing. If this is deliberate, it is a decision — record it first."; exit 1
          fi

          TAGS="${TAGS},${IMAGE}:${SANITIZED}-${ENV_SUFFIX}"

          # AC4: `latest` comes only from `main` — computed here, evaluated on
          # every run, and DELIBERATELY NOT PUSHED. Decision recorded in the
          # story and in docs/migration-decisions.md: `latest` is named
          # literally in the retention rule's keep_pattern, so pushing it is
          # PERMANENT, and Story 3.3 AC4 is authorised to decide `latest` should
          # not exist at all. Removing it afterwards needs an authorised DELETE
          # plus a write:package token. So 3.2 implements the rule and leaves
          # the switch off; 3.3 owns the verdict and flips it if it wants one.
          # The evaluated value is published as an image label below, so the
          # negative half of AC4 is provable from the database rather than from
          # an absence — job logs are unreadable on this instance.
          # ⚠️ The test is case-insensitive and accepts the fully-qualified
          # spelling, because the registry folds case and `actions/checkout`
          # accepts `refs/heads/main`. Story 3.2's first version compared
          # `"$SANITIZED" = "main"` only, so `Main`, `refs/heads/main` and a raw
          # SHA of main's tip all produced latest_eligible=false — a false
          # negative on the branch the AC is about, invisible because job logs
          # are unreadable. Its own review caught it; the fix is here rather
          # than in the record because the record cannot be executed.
          case "$(printf '%s' "$REF_IN" | tr 'A-Z' 'a-z')" in
            main|refs/heads/main) LATEST_ELIGIBLE=true ;;
            *)                    LATEST_ELIGIBLE=false ;;
          esac
          # 🔴 STORY 3.3 AC4 — DECIDED: `latest` IS DROPPED. Not deferred again.
          #
          # AC4 asks for the meaning of `latest` to be decided explicitly, "either
          # bound to one environment or dropped entirely", once the discriminator
          # exists. It cannot be bound: under Option C one commit produces up to
          # three images, and a name that must point at exactly one of them has no
          # non-arbitrary answer. Binding it to `prod` would make the most
          # dangerous image the one reachable by the laziest reference.
          #
          # Dropping it costs nothing measurable. `docker-compose.server.yml:8`
          # defaults to `ghcr.io/crm-prionex/fe-prionex:latest` — a **ghcr**
          # reference, not ours, so nothing we publish is consumed through it, and
          # Story 4.1 owns that line. FR19 and Story 4.3 already forbid falling
          # back to `:latest` on pull. Nothing else in Epics 3–7 reads it.
          #
          # And it is the only irreversible option that stays open: `latest` is
          # named literally in the retention rule's keep_pattern, so pushing it
          # once makes it permanent, removable only by an authorised DELETE with a
          # write:package token — which on this project has twice required the
          # operator in person. Not pushing it is reversible; pushing it is not.
          #
          # The evaluation is kept, and its result still ships as an image label,
          # because AC4's second clause — "builds from any other ref never produce
          # `latest`" — is provable from a positive value in the database rather
          # than from an absence, and an absence is equally consistent with the
          # rule never having run at all.
          PUSH_LATEST=false   # DECIDED, not pending. See above.

          # AC3 (semver from v*) is NOT implemented here. The trigger that would
          # produce it is Story 3.4's (FR6, Prohibition 1), no `v*` tag has ever
          # existed in this repository, and Story 6.5's promotion guard extracts
          # a commit SHA from the tag — which a semver string does not carry, so
          # it would reject one by construction. Deferred to 3.4 with that
          # reasoning recorded rather than silently skipped.

          # 🔴 THE GUARD ABOVE TESTS THE WRONG STRING, AND THIS IS WHERE THAT IS FIXED.
          # It compiles `keep_pattern` against $SANITIZED — the ref BEFORE the
          # environment suffix — while what actually reaches the registry is
          # `<sanitized>-<env>` and `sha-<12>-<env>`. The `sha-` tag was never tested
          # at all. Consequence, found by this story's own code review: a `preprod`
          # or `prod` build always produces `sha-<hex>-(pre)?prod`, which the rule
          # protects FOREVER — and one such tag was pushed from a throwaway probe
          # branch during this story's own verification, where it is now
          # unremovable without an authorised DELETE.
          #
          # Permanence is CORRECT for a real release candidate — that is what the
          # retention rule was built for. The defect was that it happened silently,
          # from a probe, past a guard whose comment claimed to prevent it. So the
          # final tags are compiled and the permanent ones are named out loud: the
          # act becomes recorded rather than invisible, and the log — which this
          # story established is readable after all — carries the evidence.
          PERMANENT_TAGS=""
          IFS=',' read -ra _final <<< "$TAGS"
          for _t in "${_final[@]}"; do
            _bare="${_t##*:}"
            if printf '%s' "$_bare" | grep -Eqi "$KEEP_RE"; then
              PERMANENT_TAGS="${PERMANENT_TAGS} ${_bare}"
            fi
          done
          # 🔴 Opus review 2026-08-16: the loop above DETECTED unintended permanence
          # and then only warned, so the detection changed nothing. The guard higher
          # up tests `$SANITIZED` — the string BEFORE the environment suffix — which
          # cannot refuse the two shapes it names in its own comment, because
          # `sha-<hex>-prod` and `sha-<hex>-preprod` only come into existence when
          # the suffix is appended.
          #
          #   dispatch ref='sha-d0759f23c03e', environment=prod
          #     -> SANITIZED='sha-d0759f23c03e'   does NOT match KEEP_RE, guard passes
          #     -> final tag 'sha-d0759f23c03e-prod'  DOES match, and is PERMANENT
          #
          # `sha-<12>` is this project's own naming convention, so a branch cut to
          # investigate a bad image is the natural spelling. The resulting tag is
          # byte-identical to what a legitimate prod build of that commit produces,
          # so it silently pre-empts or overwrites it — and removal needs the
          # authorised DELETE plus a write:package token, which has twice required
          # Oleg in person. It already happened once: `sha-f8f358f43ced-preprod`,
          # pushed from a probe in Story 3.3.
          #
          # Warning was never enough for this. `::warning::` lands in a job log that
          # `ci.yml` documents as unreadable on this instance, and `permanent_tags`
          # is written to $GITHUB_OUTPUT and consumed by nothing. So: exactly ONE
          # permanent tag is legitimate — the intended `sha-<short>-<env>` of a
          # preprod or prod build, which is what the retention rule exists for.
          # Anything else permanent fails the build before the push.
          case "$ENVIRONMENT" in
            preprod|prod) EXPECTED_PERMANENT="sha-${SHORT_SHA}-${ENV_SUFFIX}" ;;
            *)            EXPECTED_PERMANENT="" ;;
          esac

          UNEXPECTED_PERMANENT=""
          for _p in $PERMANENT_TAGS; do
            [ "$_p" = "$EXPECTED_PERMANENT" ] && continue
            UNEXPECTED_PERMANENT="${UNEXPECTED_PERMANENT} ${_p}"
          done

          if [ -n "$UNEXPECTED_PERMANENT" ]; then
            echo "FAIL: this build would push a PERMANENT tag that is not the one this" \
                 "environment is entitled to:${UNEXPECTED_PERMANENT}"
            echo "  Entitled: '${EXPECTED_PERMANENT:-none, because this is a dev build}'."
            echo "  A tag matching the retention rule's keep_pattern is never removed by" \
                 "the rule; removing it needs an authorised DELETE with a write:package" \
                 "token, which on this project has twice required the operator in person."
            echo "  The usual cause is a ref that is itself shaped like a tag the rule" \
                 "protects — e.g. a branch named 'sha-<hex>' built for preprod or prod."
            exit 1
          fi

          if [ -n "$PERMANENT_TAGS" ]; then
            echo "::warning::PERMANENT TAG — the retention rule will never remove:${PERMANENT_TAGS}"
            echo "  Intended for this environment, and correct for a release candidate."
            echo "  Removing it needs an authorised DELETE with a write:package token."
          else
            echo "All tags expire under the retention rule in 14 days."
          fi
          echo "permanent_tags=${PERMANENT_TAGS# }" >> "$GITHUB_OUTPUT"

          # 🔴 Review 2026-08-18: a branch named `sha-<12 hex>` — this
          # project's OWN convention for investigating a bad image, and it has
          # already happened once (`sha-ff416712653e`, cut from commit
          # `ff416712653e`) — sanitizes to exactly `sha-${SHORT_SHA}`, which
          # makes `push_tags` and `sha_tag` below IDENTICAL. `build-push-action`
          # would then push the "protected" tag directly as part of the
          # ordinary build step, bypassing both Story 3.6 AC2 steps entirely —
          # silently, because the permanence guard above tests `$SANITIZED`
          # against `KEEP_RE`, not against `sha_tag`'s shape, and on `dev`
          # nothing else in this file catches it at all.
          if [ "$SANITIZED" = "sha-${SHORT_SHA}" ]; then
            echo "FAIL: ref '${REF_IN}' sanitizes to 'sha-${SHORT_SHA}', which is" \
                 "IDENTICAL to this commit's protected sha-<12>-<env> tag body." \
                 "Building this branch would push that tag directly as the ordinary" \
                 "branch tag, bypassing the Story 3.6 AC2 guard entirely. Rename the" \
                 "branch."; exit 1
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "sanitized_ref=${SANITIZED}" >> "$GITHUB_OUTPUT"
          echo "latest_eligible=${LATEST_ELIGIBLE}" >> "$GITHUB_OUTPUT"
          # Story 3.6 AC2. `TAGS` above stays the full list — the final
          # fail-closed assertion still walks it unchanged. These two outputs
          # split it into its two members so the guard below (and the build
          # step) can treat them differently: `push_tags` is the MUTABLE
          # branch tag, safe to push unconditionally; `sha_tag` is the
          # PROTECTED per-commit tag, which the guard decides whether to
          # touch at all. See the two new steps after this one.
          echo "push_tags=${IMAGE}:${SANITIZED}-${ENV_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE}:sha-${SHORT_SHA}-${ENV_SUFFIX}" >> "$GITHUB_OUTPUT"
          # 🔴 Review 2026-08-18: `push_tags`/`sha_tag` above are RE-DERIVED
          # from the same pieces as `TAGS`, not SPLIT from it — so the
          # "`TAGS` = `sha_tag` + `push_tags`" invariant the comment above
          # promises was not actually enforced by the code. If `PUSH_LATEST`
          # (Story 3.3 AC4's own switch, currently `false`) is ever flipped,
          # `latest` enters `TAGS` while staying silently absent from both
          # `push_tags` and `sha_tag` — never pushed, and the final
          # fail-closed assertion fails pointing at the registry instead of
          # at this drift. Assert the invariant instead of trusting it by
          # construction.
          EXPECTED_TAGS="${IMAGE}:sha-${SHORT_SHA}-${ENV_SUFFIX},${IMAGE}:${SANITIZED}-${ENV_SUFFIX}"
          if [ "$TAGS" != "$EXPECTED_TAGS" ]; then
            echo "FAIL: internal invariant broken — TAGS ('${TAGS}') is not exactly" \
                 "sha_tag,push_tags ('${EXPECTED_TAGS}'). Something upstream changed" \
                 "what gets tagged without updating the Story 3.6 split. Refusing" \
                 "rather than silently pushing the wrong set."; exit 1
          fi
          # The raw ref, unsanitized. `sanitized_ref` is NOT the ref: the
          # sanitizer is not invertible — `a/b` and `a-b` both produce `a-b` —
          # so a label built from it cannot answer "which ref made this image".
          # Story 3.2's record claimed it could, in three documents. One line.
          echo "raw_ref=${REF_IN}" >> "$GITHUB_OUTPUT"
          echo "Computed tags: ${TAGS}"
          echo "latest eligible: ${LATEST_ELIGIBLE}; pushed: ${PUSH_LATEST}"

      # ─────────────────────────────────────────────────────────────────────
      # Story 3.6 AC2, half 1 of 2 — read the "before" state.
      #
      # This has to run BEFORE the build step so it can never observe a digest
      # this run itself produced. `docker buildx imagetools inspect` is
      # already used later in this file (Story 3.5's fail-closed assertion) —
      # no new tooling, per §3 of the story. ⚠️ Review 2026-08-18: `imagetools`
      # talks to the registry client-side and does not depend on the builder
      # driver at all — Story 3.5's own precedent cited here is about `docker
      # manifest inspect` not understanding buildx's OCI media types, a
      # different fact, not "reads OCI correctly under `docker-container`" as
      # an earlier version of this comment claimed. Buildx and the registry
      # login are already set up by this point regardless.
      - name: Query the pre-existing digest of sha-<12>-<env> (Story 3.6 AC2)
        id: predigest
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
        run: |
          set -euo pipefail
          echo "Checking ${SHA_TAG} before this run touches the registry..."
          # 🔴 Review 2026-08-18: stdout and stderr are captured SEPARATELY,
          # not merged with `2>&1` as an earlier version did. A merged stream
          # let arbitrary registry error text flow into `$OUT` on the success
          # path too — `case` globs match across embedded newlines, so
          # `sha256:<hex>` followed by an injected line could pass a loose
          # shape check and corrupt `$GITHUB_OUTPUT` (two `key=value` lines
          # where one was meant — the same re-parse defect already recorded
          # against Story 3.3). Only stdout ever reaches `$OUT`; stderr is
          # read from its own file, only in the failure branch.
          ERR_FILE="$(mktemp)"
          if OUT="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$SHA_TAG" 2>"$ERR_FILE")"; then
            rm -f "$ERR_FILE"
            # 🔴 Review 2026-08-18: this used to accept any `sha256:[0-9a-f]*`
            # — the SAME weak shape the file's final fail-closed assertion
            # (below) rejects in favour of an exact length-71,
            # `^[0-9a-f]\{64\}$` check. This step decides whether anything
            # gets compared at all, so it cannot be the looser of the two.
            if [ "${#OUT}" -ne 71 ] || ! printf '%s' "${OUT#sha256:}" | grep -q '^[0-9a-f]\{64\}$'; then
              echo "FAIL: imagetools resolved ${SHA_TAG}, but '${OUT}' is not sha256:" \
                   "plus 64 hex. A parse failure is not the same as absence — refusing" \
                   "to guess which one this is."; exit 1
            fi
            echo "pre_digest=${OUT}" >> "$GITHUB_OUTPUT"
            echo "${SHA_TAG} already exists at ${OUT}."
          else
            ERR="$(cat "$ERR_FILE")"; rm -f "$ERR_FILE"
            # 🔴 Fail-closed on ambiguity, with exactly one named exception: a
            # real "this manifest has never been pushed" answer from the
            # registry, which is the ONE case this guard is allowed to treat
            # as "nothing to compare against". Every other failure (auth,
            # network, a wedged registry, an unexpected response shape) is
            # refused rather than silently read as absence — treating a tool
            # failure as "absent" would let a broken check attach the tag to
            # a digest it never actually compared against anything, which is
            # the exact silent repoint AC2 forbids, just moved one step
            # earlier and harder to notice because it would look like the
            # normal first-build case.
            #
            # 🔴 Review 2026-08-18: narrowed from four patterns to one — and
            # that narrowing was ITSELF a defect, found by run 719 going red
            # on an ordinary absent tag. The earlier `NAME_UNKNOWN`/bare-`404`
            # alternatives are repository/transport-level, not "this exact
            # manifest reference was never pushed" — a token that lost
            # `read:package`, a deleted package, or a proxy error page whose
            # body happens to contain the digits "404" would all match and be
            # silently read as absent, which is the same silent-repoint
            # failure mode one level up — that reasoning still holds. But the
            # narrowed allowlist assumed the registry's `MANIFEST_UNKNOWN`
            # error CODE reaches stderr, and it does not: containerd folds a
            # 404 into `errdefs.NotFound` before buildx ever prints it, and
            # the code is not carried through. ✅ VERIFIED, not assumed —
            # local experiment against the same buildx v0.35.0:
            #   $ docker buildx imagetools inspect \
            #       alpine:this-tag-does-not-exist-3-6-probe
            #   ERROR: docker.io/library/alpine:this-tag-does-not-exist-3-6-probe: not found
            # — the body never contains `MANIFEST_UNKNOWN` in any form; it is
            # always `<ref>: not found`. Confirmed on THIS registry too,
            # empirically rather than by inference: run 716 (still on the old,
            # wider allowlist that included `*"not found"*`) reached the
            # attach step on an absent tag, so this Forgejo registry's 404
            # also folds to "not found" the same way. Run 719 (this
            # narrower allowlist) then went red on that same absent-tag case,
            # landing in the "could not determine" branch below — the
            # ambiguous-read fail-closed branch actually firing, live, which
            # is itself the kind of proof §6 of this story asks for ("a guard
            # that cannot fail proves nothing"). `": not found"` is added back
            # — not the bare `NAME_UNKNOWN`/`404` this review round already
            # rejected, but the exact suffix errdefs.NotFound produces, scoped
            # with the leading colon so an unrelated "not found" substring
            # elsewhere in a longer message does not match.
            case "$ERR" in
              *MANIFEST_UNKNOWN*|*": not found"*)
                echo "pre_digest=" >> "$GITHUB_OUTPUT"
                echo "${SHA_TAG} does not exist yet — nothing to protect."
                echo "  (imagetools said: ${ERR})" ;;
              *)
                echo "FAIL: could not determine whether ${SHA_TAG} already exists."
                echo "  imagetools said: ${ERR}"
                echo "  Refusing to proceed on an ambiguous read — see the comment" \
                     "above this step for why an unrecognised failure is not treated" \
                     "as absence."
                exit 1 ;;
            esac
          fi

      # ──────────────────────────────────────────────────────────────────────
      # ONE decision, computed ONCE, read by every step that changes behaviour
      # because of it (the build, the AC2 attach, the re-point, the final
      # assertion). Deliberately not four copies of the same `if:` expression
      # over `inputs.reuse_published_image` and `steps.predigest.outputs.
      # pre_digest`: four copies is how three of them stay right and the fourth
      # drifts, and on this instance the drift would show up as a green run that
      # published nothing.
      #
      # Note the ordering this depends on and does not re-establish: `predigest`
      # above is the only reader of the registry that is GUARANTEED to have run
      # before this build touched it (that is its own Story 3.6 AC2 reason for
      # existing). So "already published" here can never mean "published by this
      # very run" — the reuse path cannot be self-confirming.
      #
      # 🔴 The reuse path is NOT a weaker AC2. It is the absence of the event
      # AC2 judges: no second image of this commit is produced at all, so there
      # is nothing to repoint `sha-<12>-<env>` to and the protected tag is never
      # touched by this run. The guard below still stands, unchanged, on every
      # path that does build.
      - name: "Decide: rebuild, or reuse the image already published for this commit"
        id: reuse
        env:
          REUSE_IN: ${{ inputs.reuse_published_image }}
          PRE_DIGEST: ${{ steps.predigest.outputs.pre_digest }}
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          PUSH_TAGS: ${{ steps.tags.outputs.push_tags }}
        run: |
          set -euo pipefail
          # `REUSE_IN` is unset on the dispatch path (the input is declared on
          # the `workflow_call` half only) and `set -u` would abort on it, so it
          # is defaulted here rather than assumed — the same shape the tags step
          # needs for its own per-step `env:`.
          REUSE_REQUESTED="${REUSE_IN:-}"
          PRE="${PRE_DIGEST:-}"

          # Exact match against the literal, not a truthiness test: `false`,
          # `0`, `no` and an empty string must all mean "build", and so must any
          # value nobody anticipated. Only the one spelling opts in.
          if [ "$REUSE_REQUESTED" != "true" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Caller did not request reuse (reuse_published_image='${REUSE_REQUESTED}') — building normally."
            exit 0
          fi

          if [ -z "$PRE" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Reuse requested, but ${SHA_TAG} does not exist yet — there is nothing to"\
                 "reuse, so this run builds it. This is the ordinary first-build case, not a"\
                 "failure."
            exit 0
          fi

          # `predigest` already rejected anything that is not `sha256:` + 64 hex
          # before writing this value, and did so fail-closed. Re-asserting the
          # shape here is not that check repeated for its own sake: this value
          # is about to be the ONLY digest the final assertion compares against,
          # taking the place of the build step's own, and a check that becomes
          # load-bearing in a new place is re-established in that place.
          if [ "${#PRE}" -ne 71 ] || ! printf '%s' "${PRE#sha256:}" | grep -q '^[0-9a-f]\{64\}$'; then
            echo "FAIL: reuse was requested and ${SHA_TAG} resolved, but '${PRE}' is not sha256:"\
                 "plus 64 hex — refusing to skip a build on the strength of a digest this step"\
                 "cannot read."
            exit 1
          fi

          echo "reuse=true" >> "$GITHUB_OUTPUT"
          echo "REUSE: ${SHA_TAG} is already published at ${PRE}. This run will NOT rebuild"
          echo "  (a rebuild of this same commit cannot be byte-identical — vite.config.ts:8"
          echo "   bakes Date.now() — so it could only produce a second image the AC2 guard is"
          echo "   right to refuse). ${SHA_TAG} is left exactly as it is; only the mutable"
          echo "   branch tag ${PUSH_TAGS} is re-pointed at ${PRE}, registry-side."

      # ⚠️ SUPERSEDED by Story 3.5. This used to read "No cache-from/cache-to
      # … `driver: docker` cannot export a registry cache at all". Both clauses
      # are now false: the driver is `docker-container` and the cache keys are
      # set below. Left visible rather than deleted because the FR9 conflict it
      # describes is the reason this story existed. No platforms — s1
      # is native amd64 and cross-build under QEMU kills esbuild. Build-args are
      # explicit non-production literals with no `||` fallback (Dockerfile.prod
      # declares no defaults) — real values are Story 3.3's, from OpenBao.
      #
      # 🔴 Story 3.3 replaced the `build-check-3-1.invalid` literals Story 3.1
      # shipped with the real values, read from OpenBao above. `Dockerfile.prod`
      # declares `ARG VITE_API_BASE_URL` and `ARG VITE_WS_URL` and no defaults —
      # that contract is used UNCHANGED (AC5), and the absence of defaults is what
      # makes AC2's guarantee possible at all.
      #
      # ⚠️ AC2's guarantee covers these TWO variables and no others, and that is a
      # recorded gap rather than an oversight. `src/` reads four: these two plus
      # `VITE_OPERATOR_PHONE_URL` and `VITE_BUILD_TS`. Vite bakes `undefined`
      # for an undeclared `import.meta.env.X`; each of the two has an in-source
      # fallback, and the websocket one falls back to `localhost`. Closing that
      # gap means extending `Dockerfile.prod`, which AC5 forbids without an
      # amendment — so it is deferred with an owner rather than resolved by
      # pretending the contract covers four. See deferred-work.md.
      #
      # `org.prionex.environment` is Story 3.3's, and it answers Story 3.6 AC3:
      # "the environment it was built for is determinable from the image itself,
      # not only from its tag string". Story 3.2 could not emit it because FR8
      # was not its to own.
      #
      # `labels:` is Story 3.2's, and it pre-pays Story 3.6 **AC1 only**: the
      # commit mapping is verifiable from image metadata without a run log.
      # 3.6 AC3 — "the environment it was built for is determinable from the
      # image itself" — is NOT served: no environment label is emitted, because
      # FR8 belongs to Story 3.3 (Prohibition 6). Story 3.2's first version
      # claimed both ACs here; corrected by its own review, because a 3.6 dev
      # reading this file would have believed AC3 was already paid for.
      #
      # ─────────────────────────────────────────────────────────────────────
      # Story 3.6 AC2 — refuse to silently repoint sha-<12>-<env>, don't just
      # detect it after the fact.
      #
      # §2b of the story MEASURED the repoint (2026-08-17/18): the same
      # commit, rebuilt off a cache-miss path, produces a different digest —
      # root cause `vite.config.ts:8` baking a fresh `Date.now()` into the
      # bundle via `define` on every build that is not a full cache hit. That
      # is source-level non-reproducibility and this story does NOT fix it
      # (decided 2026-08-18 — `vite.config.ts` is application source, out of
      # scope for a CI story). What AC2 asks is narrower: whoever rebuilds the
      # same commit must not silently overwrite what `sha-<12>-<env>` already
      # named. "Refuse" was chosen over "document" — Story 3.2 already spent
      # that escape hatch once, and Stories 5.4/6.5/6.6 trust this tag to name
      # exactly one artifact (§5).
      #
      # A check that runs AFTER an all-tags push cannot refuse anything — the
      # tag is already wrong by the time it runs. So this is two steps either
      # side of the build, not one after it:
      #   1. (next step) read what sha-<12>-<env> pointed to BEFORE this run
      #      touches the registry.
      #   2. this step pushes only the MUTABLE branch tag
      #      (`steps.tags.outputs.push_tags`, not `.tags`) — publishing under
      #      a name nobody has promised is stable is unconditionally safe.
      #      ⚠️ Review 2026-08-18: this IS a real publish, not a no-op — on
      #      `main` the tag is `main-dev`, the tag Story 4.6 resets the DEV
      #      stand to. A refused `sha-<12>-<env>` still leaves a fresh,
      #      consumable image live under the branch tag; only the protected
      #      name is withheld. Correct per AC2's letter, worth saying so
      #      "refused" is never read as "nothing was published".
      #   3. (step after) attach sha-<12>-<env> to this run's digest ONLY if
      #      step 1 found it absent or already equal — otherwise fail and
      #      leave it untouched. That is what makes this a refusal and not a
      #      report.
      - name: Build and push image
        id: build
        # The reuse path skips THIS step and the AC2 attach below, and nothing
        # else — every guard before this point (the tag permanence guard, the
        # netns isolation assertion, the OpenBao reads, `predigest` itself) has
        # already run, and the fail-closed assertion at the end of the job still
        # runs and still has to pass. A skipped step's outputs read as empty,
        # which is why the assertion takes its digest from the decision above
        # rather than from `steps.build.outputs.digest` unconditionally.
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.tags.outputs.push_tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tags.outputs.full_sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.short_sha }}
            org.opencontainers.image.source=git.crm-prionex.com/CRM/fe-prionex
            org.prionex.ref=${{ steps.tags.outputs.raw_ref }}
            org.prionex.ref-sanitized=${{ steps.tags.outputs.sanitized_ref }}
            org.prionex.latest-eligible=${{ steps.tags.outputs.latest_eligible }}
            org.prionex.environment=${{ inputs.environment }}
          build-args: |
            VITE_API_BASE_URL=${{ steps.app_urls.outputs.api_url }}
            VITE_WS_URL=${{ steps.app_urls.outputs.ws_url }}
            VITE_OPERATOR_PHONE_URL=${{ steps.phone.outputs.phone_url }}
            VITE_CREDIT_MODULE_ENABLED=${{ steps.credit_flag.outputs.credit_enabled }}
            VITE_OPENREPLAY_PROJECT_KEY=${{ steps.openreplay.outputs.project_key }}
            VITE_OPENREPLAY_INGEST_URL=${{ steps.openreplay.outputs.ingest }}
            VITE_OPENREPLAY_PRIVATE_MODE=${{ steps.openreplay.outputs.private_mode }}

          # 🔴 Story 3.5, decided by measurement rather than by argument.
          #
          # `docker-container` makes buildx default to `provenance=mode=min`,
          # which emits an OCI INDEX of two manifests (image + attestation) even
          # for one platform. Run 660 confirmed the shape exactly — the log shows
          # `exporting manifest`, `exporting attestation manifest`, then
          # `exporting manifest list`.
          #
          # ⚠️ But the failure mode was NOT the one this file predicted. The
          # digest assertion's `__INDEX__` branch never ran: `docker manifest
          # inspect -v` refuses an OCI index outright —
          #
          #   unsupported manifest media type and no default available:
          #   application/vnd.oci.image.manifest.v1+json
          #
          # — so it died before `jq` saw anything, and reported "did not resolve
          # in the registry" for a tag that had just been pushed successfully.
          #
          # Two ways out. Switch the assertion to `docker buildx imagetools
          # inspect`, which reads OCI. Or stop producing the index. This takes
          # the second: it is one line, it leaves a guard that has already caught
          # real defects completely untouched, and nothing in this plan consumes
          # a provenance attestation. It also stops the registry accruing two
          # extra `sha256:` version rows per build, which the index children
          # created.
          provenance: false

          # Story 3.5 AC1. `type=gha` does not exist off GitHub; this is its
          # replacement. Reachable only because `driver: docker-container` above
          # is now proven to push — under `driver: docker` `cache-to` is not
          # supported at all, which is what blocked this story for four stories.
          #
          # `mode=max` exports intermediate layers, not just the final one. That
          # is what AC3 needs: `Dockerfile.prod` installs dependencies in the
          # builder stage, and `mode=min` would not carry that layer.
          #
          # 🚨 `buildcache` is in the retention rule's `keep_pattern` and is
          # never removed. That is deliberate (Story 1.11) — but note it is
          # pattern-read, never observed, and the rule has still never been seen
          # deleting anything (first possible observation 2026-08-29).
          #
          # This tag does NOT go through the tags step, so the permanence guard
          # there never sees it. That is correct: the guard exists to stop an
          # accidental permanent tag, and this one is intended.
          cache-from: type=registry,ref=git.crm-prionex.com/crm/fe-prionex:buildcache
          # 🔴 `ignore-error=true` is BLOCKING-grade, added by review 2026-08-17.
          #
          # BuildKit runs exporters in order: the IMAGE exporter (the push) first,
          # the CACHE exporter second. A `cache-to` failure is fatal and
          # `ignore-error` defaults to false. So a transient registry error during
          # the 280 MB cache export — which includes one 205 MB layer, and which
          # the other runner can be writing to the same `buildcache` tag
          # concurrently — fails the step AFTER the image is already pushed.
          #
          # On a `prod` dispatch that leaves `sha-<12>-prod` in the registry:
          # PERMANENT under the retention rule, removable only by an authorised
          # DELETE with a write:package token that has twice needed Oleg in
          # person. And the digest assertion has no `if:`, so it never runs — the
          # tag is permanent AND unverified, behind a red run that tells the
          # operator nothing was published.
          #
          # Nobody has felt this because no preprod or prod build has run under
          # this driver yet; on `dev` the tag expires in 14 days.
          #
          # A failed cache export is not a reason to fail a build. The cache is an
          # optimisation worth roughly zero seconds (see D22); the image is the
          # product.
          cache-to: type=registry,ref=git.crm-prionex.com/crm/fe-prionex:buildcache,mode=max,ignore-error=true

      # ─────────────────────────────────────────────────────────────────────
      # Story 3.6 AC2, half 2 of 2 — attach the protected tag, or refuse.
      #
      #   pre_digest empty          -> absent, nothing to protect       -> attach
      #   pre_digest == NEW_DIGEST  -> already published, no-op         -> skip
      #   pre_digest != NEW_DIGEST  -> the repoint AC2 forbids          -> FAIL,
      #                                sha_tag left exactly as it was
      #
      # "attach" is `docker buildx imagetools create` — a registry-side retag,
      # not a rebuild or re-upload. The image already exists in the registry
      # under the branch tag the build step just pushed; this only points a
      # second name at the same manifest. That is what makes the FAIL branch
      # a real refusal rather than a report: it `exit 1`s before this command
      # ever runs, so on the forbidden path sha_tag is untouched, not merely
      # flagged as wrong after the damage.
      #
      # 🔴 Legitimate rebuild (Open Question 2, §3 of the story): NO override
      # input is added, on purpose. `short_sha` comes from `git rev-parse
      # HEAD` in the tags step — it cannot change without a new commit. A
      # base-image security bump "for the same release" is mechanically a
      # `Dockerfile.prod` commit, which is a DIFFERENT commit and therefore a
      # DIFFERENT sha-<12>-<env> tag: there is no existing tag to refuse, so
      # this guard does not fire for that case at all. The only rebuild this
      # guard can ever block is one that keeps the SAME commit and produces
      # different bytes — which, per §2b, is not a legitimate case; it is the
      # `Date.now()` bug AC2 exists to catch. So no override is needed, and
      # adding one would only give that bug a bypass.
      - name: Enforce AC2 — attach or refuse sha-<12>-<env>
        # Skipped only on the reuse path, where this step has nothing to decide:
        # no image was built, so there is no new digest to attach and no repoint
        # to refuse. It is NOT skipped on any path that builds — including a
        # reuse-requesting run whose tag turned out to be absent, which the
        # decision step above resolves to `reuse=false` precisely so that this
        # guard keeps covering the build it just authorised.
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        env:
          PRE_DIGEST: ${{ steps.predigest.outputs.pre_digest }}
          NEW_DIGEST: ${{ steps.build.outputs.digest }}
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
        run: |
          set -euo pipefail
          case "${NEW_DIGEST}" in
            sha256:[0-9a-f]*) ;;
            *) echo "FAIL: this run reported no usable digest ('${NEW_DIGEST}')." \
                    "Refusing to attach or compare against one."; exit 1 ;;
          esac

          if [ -z "${PRE_DIGEST}" ]; then
            echo "${SHA_TAG} did not exist before this run — attaching."
          elif [ "${PRE_DIGEST}" = "${NEW_DIGEST}" ]; then
            echo "${SHA_TAG} already points at ${NEW_DIGEST} — nothing to do."
            exit 0
          else
            echo "FAIL: refusing to repoint ${SHA_TAG} (Story 3.6 AC2)."
            echo "  existing digest (before this run): ${PRE_DIGEST}"
            echo "  this run's digest:                 ${NEW_DIGEST}"
            echo "  ${SHA_TAG} is UNCHANGED — this step exits before touching it."
            echo "  This is the class of rebuild the story's §2b measured: on a" \
                 "cache miss, vite.config.ts:8 bakes a fresh Date.now() into the" \
                 "bundle on every build, so two builds of the same commit are not" \
                 "byte-identical. That is a documented property of the source" \
                 "(2026-08-18, not fixed by this story) — this guard's only job is" \
                 "to refuse publishing the second result under the first result's" \
                 "name, not to make the two builds match."
            echo "  Whether this fires is decided by whether THIS build's cache hit:" \
                 "a full cache hit restores the cached bundle byte-for-byte and takes" \
                 "the 'same digest' branch above instead; a cache miss rebuilds and" \
                 "re-evaluates Date.now(), which is what just happened. And the cache" \
                 "that decides it is ':buildcache' — one shared, mutable tag any" \
                 "branch's build can evict (§2b's own side effect 1 did exactly this" \
                 "to main's cache once already). The same rebuild of the same commit" \
                 "can pass today and fail tomorrow with nothing in the commit having" \
                 "changed — documented as known behaviour, not designed away (§2b)."
            exit 1
          fi

          # 🔴 BLOCKING, review 2026-08-18, confirmed live: run 716 (this
          # commit's own push) went red at the fail-closed assertion below.
          # `imagetools create`'s `--prefer-index` DEFAULTS TO TRUE (docker
          # buildx v0.35.0): "when only a single source is specified, prefer
          # outputting an image index ... instead of performing a carbon
          # copy". So the tag this line attached was an OCI INDEX wrapping
          # this run's manifest, never the manifest itself — but `predigest`
          # and the final assertion both read `.Manifest.Digest`, and for an
          # index tag that is the INDEX's digest, which can never equal
          # `NEW_DIGEST` (a single manifest — `provenance: false`,
          # Prohibition 6, confirmed at run 661 in the comment above). Every
          # build failed the final assertion below; every rebuild's "already
          # points at" branch above was unreachable, refused forever with a
          # message blaming `vite.config.ts` — this guard misattributing its
          # own failure, precisely what §6 of the story is about.
          # `--prefer-index=false` makes `create` emit the source manifest
          # verbatim, matching what every reader of this tag downstream
          # (`predigest`, the assertion below, Task 4's label reads) already
          # assumes. Weakens nothing (Prohibition 3) and does not touch
          # `provenance: false` (Prohibition 6) — it makes `create` match the
          # shape the rest of this file already reads.
          IMAGE="${SHA_TAG%%:*}"
          docker buildx imagetools create --prefer-index=false --tag "${SHA_TAG}" "${IMAGE}@${NEW_DIGEST}"

          # 🔴 Review 2026-08-18: the attach used to end with a bare
          # `echo "OK"` — a claim, not a check, and per the finding above it
          # was FALSE on every run. Read the tag back the same way
          # `predigest` and the final assertion do; this alone would have
          # caught the index defect without a live dispatch, which is exactly
          # the gap Task 3.4 was blocked on.
          ATTACHED="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${SHA_TAG}")"
          if [ "$ATTACHED" != "${NEW_DIGEST}" ]; then
            echo "FAIL: attached ${SHA_TAG} but reading it back gives '${ATTACHED}', not" \
                 "this run's '${NEW_DIGEST}'. The attach did not do what it claimed —" \
                 "refusing to report success."; exit 1
          fi
          echo "OK: ${SHA_TAG} -> ${NEW_DIGEST} (verified by read-back)"

      # ──────────────────────────────────────────────────────────────────────
      # The reuse path's ONLY write. It is the mirror image of the attach above
      # — same command, same `--prefer-index=false` for the same measured reason
      # (run 716: `create` defaults to wrapping a single source in an OCI index,
      # and every reader downstream reads `.Manifest.Digest`, which for an index
      # is the index's own digest and can never equal the manifest's) — but it
      # moves the MUTABLE branch tag, never the protected one.
      #
      # 🔴 Why this step is required and not a tidiness: the deploy that follows
      # this build resolves the stand's image from the BRANCH tag
      # (`deploy-stand.yml`, ref-derived: `dev` -> `dev-dev`). Skipping the
      # build without this step would leave `dev-dev` pointing at whatever was
      # last built from the OLD `dev` HEAD — so the weekly reset would report
      # success and deploy the branch it had just discarded. Silent, and exactly
      # the wrong image. The registry-side retag costs one API call and no
      # upload: the manifest it names is already there.
      - name: Re-point the mutable branch tag at the reused image (reuse path only)
        if: ${{ steps.reuse.outputs.reuse == 'true' }}
        env:
          PRE_DIGEST: ${{ steps.predigest.outputs.pre_digest }}
          PUSH_TAGS: ${{ steps.tags.outputs.push_tags }}
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
        run: |
          set -euo pipefail
          # The tags step guarantees exactly two tags and that they are not the
          # same string (it refuses the branch name that would collide), so
          # `PUSH_TAGS` is one tag here, not a list — asserted rather than
          # assumed, because this command would happily accept a comma as part
          # of a tag name and produce a tag nobody can resolve.
          case "$PUSH_TAGS" in
            *,*) echo "FAIL: push_tags ('${PUSH_TAGS}') carries more than one tag. This step"\
                      "retags exactly one. Refusing rather than inventing a split."; exit 1 ;;
          esac
          if [ "$PUSH_TAGS" = "$SHA_TAG" ]; then
            echo "FAIL: the branch tag and the protected tag are the same string"\
                 "('${PUSH_TAGS}'). The tags step is supposed to make this impossible;"\
                 "refusing to retag the protected tag by accident."; exit 1
          fi

          IMAGE="${SHA_TAG%%:*}"
          echo "Re-pointing ${PUSH_TAGS} at ${PRE_DIGEST} (registry-side retag, no upload)..."
          docker buildx imagetools create --prefer-index=false --tag "${PUSH_TAGS}" "${IMAGE}@${PRE_DIGEST}"

          # Read back, for the same reason the attach above reads back: run 716
          # proved that this command can "succeed" and leave the tag pointing at
          # something else entirely, and a claim is not a check.
          RESOLVED="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${PUSH_TAGS}")"
          if [ "$RESOLVED" != "${PRE_DIGEST}" ]; then
            echo "FAIL: re-pointed ${PUSH_TAGS} but reading it back gives '${RESOLVED}', not"\
                 "'${PRE_DIGEST}'. The retag did not do what it claimed — refusing to report"\
                 "success on an image the deploy would then pull."; exit 1
          fi
          echo "OK: ${PUSH_TAGS} -> ${RESOLVED} (verified by read-back). ${SHA_TAG} untouched."

      # Fail-closed assertion. Job logs are not retrievable on this instance
      # (404 on every logs endpoint), so a green job status must itself be the
      # evidence — a client exit code alone was rejected as sufficient in
      # Story 1.10.
      #
      # 🔴 Story 3.2 rewrote this. It used to run `docker manifest inspect` on a
      # fixed literal tag, which asserts that THE TAG EXISTS, not that THIS
      # RUN'S image is under it — and the registry accepts tag overwrite
      # silently, so from the second dispatch onward it passed on the previous
      # run's manifest. That is Story 3.2 AC5: every expected tag must resolve
      # to the SAME DIGEST, which means the digest this build produced.
      #
      # Two guards that look redundant and are not: the digest is validated for
      # shape BEFORE it is compared, because comparing two empty strings
      # succeeds and would restore exactly the vacuous check being replaced —
      # and whether build-push-action populates `digest` under the classic
      # `docker` driver had never been observed on this instance before now.
      # ⚠️ Historical: this used `docker manifest inspect -v` rather than the
      # bare form, because the bare form prints the manifest BODY and diffing
      # bodies passes for any image built from the same Dockerfile. Story 3.5
      # replaced the command entirely with `docker buildx imagetools inspect` —
      # `docker manifest inspect` cannot read the OCI media types buildx writes
      # under `docker-container`. See the note at the command itself; the
      # reasoning below about `.[0].Descriptor.digest` is kept because the
      # mistake it describes is real, but the fix it describes was superseded.
      #
      # Three things the first version got wrong, all found by Story 3.2's own
      # code review and all fixed here:
      #   1. The tag list had none of the validation the digest had. An empty
      #      list expands to nothing under `set -u`, the loop body never runs,
      #      and the step prints "All 0 tags resolve" and exits 0 — restoring
      #      the vacuous check it exists to remove.
      #   2. `grep -o … | head -1` assumes the Descriptor digest is the FIRST
      #      "digest" in the marshalled output. True today by Go struct field
      #      ordering and single-platform output; false the moment buildx emits
      #      an index — which is what Story 3.5 must do to get a registry cache,
      #      since `driver: docker` cannot export one. It would then compare a
      #      child digest against the index digest and fail every correct build.
      #      `jq -r '.[0].Descriptor.digest // .Descriptor.digest'` reads the
      #      field by name. It also removes the SIGPIPE race `head -1` created
      #      under `pipefail`.
      #   3. A parse failure was reported as "did not resolve in the registry",
      #      which sends the next engineer after the wrong cause on an instance
      #      where the log is unreadable. The two are now separate messages.
      - name: Assert every tag resolves to this run's digest (fail-closed)
        # Values arrive through `env:`, like the tag step's — see its comment.
        # These two are workflow-computed rather than dispatch-supplied, so
        # neither is attacker-controlled; they move anyway so the rule is
        # uniform and greppable: **no `${{ }}` appears inside any `run:` body in
        # this file**, which is a gate you can actually run, unlike "be careful".
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          REUSED_DIGEST: ${{ steps.predigest.outputs.pre_digest }}
          REUSE: ${{ steps.reuse.outputs.reuse }}
          TAGS_RAW: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          # 🔴 This assertion stays EXACTLY as strong on the reuse path: every
          # expected tag must still resolve, in the registry, to one digest —
          # only WHICH digest is authoritative changes, from "the one this run
          # built" to "the one this run deliberately did not rebuild". That is
          # the whole difference, and it is one assignment.
          #
          # Crucially the branch below does NOT relax anything when the build
          # was skipped: it substitutes a digest that `predigest` shape-checked
          # and the decision step re-checked, and it still requires BOTH tags to
          # resolve to it — which is what actually proves the re-point step did
          # its job. If that step had silently not run, `dev-dev` would still
          # point at the old image and this assertion would go red here.
          if [ "${REUSE:-}" = "true" ]; then
            DIGEST="${REUSED_DIGEST:-}"
            echo "Reuse path — asserting against the already-published digest: '${DIGEST}'"
          else
            DIGEST="${BUILT_DIGEST:-}"
            echo "Build reported digest: '${DIGEST}'"
          fi
          # Shape-checked before use: comparing two empty strings succeeds, and
          # that is precisely the vacuous check being replaced. The hex class is
          # tested here, not just the length — the first version's message
          # claimed "64 hex" while the check only counted characters.
          case "${DIGEST}" in
            sha256:[0-9a-f]*) ;;
            *) echo "FAIL: no usable digest to assert against ('${DIGEST}')." \
                    "On a building run that means the build step reported none; on a reuse" \
                    "run it means the decision step let an unusable pre-digest through." \
                    "Refusing to compare — an empty digest would make this check vacuous."; exit 1 ;;
          esac
          if [ "${#DIGEST}" -ne 71 ] || printf '%s' "${DIGEST#sha256:}" | grep -qv '^[0-9a-f]\{64\}$'; then
            echo "FAIL: digest '${DIGEST}' is not sha256: plus 64 hex."; exit 1
          fi

          if [ -z "${TAGS_RAW}" ]; then
            echo "FAIL: the tag list is empty. Zero tags verified is not a pass."; exit 1
          fi
          IFS=',' read -ra TAGLIST <<< "${TAGS_RAW}"
          if [ "${#TAGLIST[@]}" -lt 2 ]; then
            echo "FAIL: expected at least the sha- and ref tags, got ${#TAGLIST[@]}."; exit 1
          fi

          VERIFIED=0
          for TAG in "${TAGLIST[@]}"; do
            # 🔴 Story 3.5, run 661. This used `docker manifest inspect -v`
            # piped through jq, and it was wrong about WHY it would break — twice,
            # in comments written with confidence.
            #
            # The first version assumed a manifest index and read `.[0]`. The
            # second replaced that with a directed `__INDEX__` failure, on the
            # theory that dropping `driver: docker` would produce an index. The
            # index part was right, and irrelevant. Run 661 set `provenance:
            # false`, got a SINGLE manifest — the log shows one `exporting
            # manifest` and no list — and the command still failed:
            #
            #   unsupported manifest media type and no default available:
            #   application/vnd.oci.image.manifest.v1+json
            #
            # The real cause: buildx under `docker-container` writes **OCI**
            # media types, and this Docker's `docker manifest inspect` only
            # understands Docker v2 ones. Index or not, it cannot read them.
            #
            # 🚨 And note how it failed: it reported "did not resolve in the
            # registry" for a tag that HAD just been pushed successfully. A
            # fail-closed guard that misattributes its own failure sends the next
            # reader after the registry instead of the tool. The message below
            # now carries what the tool actually said.
            #
            # `docker buildx imagetools inspect` reads OCI natively.
            RESOLVED="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${TAG}" 2>&1)" || {
              echo "FAIL: could not read the manifest for ${TAG}."
              echo "  imagetools said: ${RESOLVED}"
              echo "  This is a TOOL or REGISTRY failure — distinguish them by the message"
              echo "  above before concluding the tag is missing."
              exit 1; }

            case "${RESOLVED}" in
              sha256:[0-9a-f]*) ;;
              *) echo "FAIL: parsed '${RESOLVED}' for ${TAG}, which is not a digest." \
                      "Parse failure, not a registry failure."; exit 1 ;;
            esac
            if [ "${RESOLVED}" != "${DIGEST}" ]; then
              echo "FAIL: ${TAG} resolves to ${RESOLVED}, not this run's ${DIGEST}."; exit 1
            fi
            echo "OK: ${TAG} -> ${RESOLVED}"
            VERIFIED=$((VERIFIED + 1))
          done
          if [ "${VERIFIED}" -ne "${#TAGLIST[@]}" ]; then
            echo "FAIL: verified ${VERIFIED} of ${#TAGLIST[@]} tags."; exit 1
          fi
          echo "All ${VERIFIED} tags resolve to ${DIGEST}."
