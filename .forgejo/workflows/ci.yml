name: CI

# Story 2.2: push is now armed, pull_request is not.
#
# `push` fires on every branch EXCEPT main/staging/development
# (`branches-ignore`), which is FR2's "push on feature branches" read
# literally. It deliberately excludes the three long-lived branches so a
# documentation-only commit landing on any of them does not spend a run —
# four concurrent jobs, ~540s of wall clock and ~918 job-seconds since
# Story 2.3 added coverage (run 522; it was ~468s / ~810 before) — on a
# host shared with another tenant's production. (An earlier version of this
# comment said "four jobs (~487s each)", which overstated the cost roughly
# fourfold: 487s is the whole run, not each job. Measured on run 505: Lint
# 143s, Type Check 86s, Unit Tests 467s, Build 113s.) Verified
# empirically on Forgejo 15.0.5+gitea-1.22.0 that `branches-ignore` is
# honoured (see Story 2.2's Dev Agent Record for the probe-branch evidence:
# a push naming this branch in `branches-ignore` produced zero runs, the same
# push with the branch NOT named produced one).
#
# `pull_request` is intentionally absent. The repository's pull-request unit
# (`has_pull_requests`) is disabled on this instance for a named reason (a PR
# opened from any of ~497 branches whose head commit predates this workflow
# would fall through to legacy `.github/workflows/CI.yml` on another team's
# runner — see `docs/migration-decisions.md` D9). Enabling that unit is out
# of scope for this story; AC2/AC3 (pull_request behaviour) are recorded as
# deferred, not closed, until that decision is made explicitly.
#
# No `concurrency` block: Forgejo already auto-cancels an earlier run of the
# same workflow on the same ref for `push` events by default, without one
# (`docs/migration-decisions.md` D8). Adding a block to get behaviour that is
# already the default was Story 1.12's mistake — a test that cannot fail
# proves nothing.
#
# `workflow_dispatch` is retained alongside `push`: it costs nothing idle,
# and it is the only manual fallback if a trigger turns out not to fire.
# 🚨 LOAD-BEARING: the `branches-ignore` filter is what keeps this workflow off
# tags, not the absence of a `tags:` clause. A ref filter of any kind makes
# Forgejo skip non-branch refs; simplify this to a bare `on: push:` with no
# filter and it fires on every tag push AND on main/staging/development.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - staging
      - development
  # Added 2026-08-14, Story 2.2 AC2/AC3, once Oleg enabled the pull-request unit.
  # FR2 asks for both this and the push trigger above, so a branch that is BOTH
  # pushed and part of an open PR produces TWO runs per push — one `push`, one
  # `pull_request` — at ~468s each. That is measured, not assumed; see the story's
  # Dev Agent Record. If the cost is judged too high, dropping the `push` trigger
  # for PR branches is the lever, not dropping this one: this is the half that
  # gates merges.
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    # node-20, and never `ubuntu-latest`: the CRM org carries an idle runner
    # under that label belonging to ANOTHER TEAM. Naming it here does not fail
    # — it resolves, and runs our CI on their infrastructure, which is worse.
    # node-20 is the label Story 1.7 provisioned for us. (Verification greps
    # for this string must exclude comment lines; the name has to appear here
    # so a future reader knows exactly what is forbidden.)
    runs-on: node-20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Separate step from format:check so the job log shows unambiguously
      # which of the two failed.
      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: node-20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: node-20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # CI runs test:coverage:ci — not test:run:ci, not test:coverage. Five test
      # scripts exist (package.json); this is the only one safe here.
      #
      # Heap: unchanged reasoning from the `test:run:ci` step this replaces.
      # `test:coverage:ci` is pinned to 16384 MB, matching `test:run:ci`'s
      # ceiling — `test:coverage` (the developer-facing script) stays at
      # 8192 MB and is untouched, same as `test:run`. `cross-env` hardcodes the
      # ceiling per-script, so a job-level `env:` cannot raise it; raising it
      # inside `test:coverage` itself would raise it for every developer too,
      # and the machine this repo is developed on has 16 GB of RAM total —
      # telling Node it may take all of it as heap on every pre-commit hook
      # guarantees swapping. The runner has the headroom the laptop does not
      # (job container is not memory-capped in the nested dind; s1 reported
      # ~80 GB available).
      #
      # One pass, not two: this step REPLACES what was `test:run:ci`, it does
      # not run alongside a second, uninstrumented pass. `vitest run --coverage`
      # executes the identical 228-file suite; only instrumentation differs.
      # Running both would roughly double `Unit Tests`, already ~467s of a
      # ~468s whole run (measured run 505) — the suite is serial by config
      # (`pool: 'forks'`, `maxWorkers: 1`, `fileParallelism: false` in
      # vitest.config.ts:30-32), so a second pass amortises nothing. This is a
      # deliberate deviation from the epic's literal Story 2.3 AC1 wording
      # (`npm run test:coverage` after `npm run test:run`), the same shape as
      # the `test:run:ci` deviation Story 2.1 recorded, which this block replaces.
      # Recorded in
      # _bmad-output/implementation-artifacts/2-3-publish-coverage-as-an-artifact-instead-of-uploading-to-codecov.md.
      #
      # No `continue-on-error` here, by design (AC3). The legacy pipeline
      # (.github/workflows/CI.yml:70-72) had `continue-on-error: true` on its
      # coverage step, paired with `fail_ci_if_error: false` on the Codecov
      # upload — that pairing is the exact mechanism that let a coverage step
      # which had never once succeeded (the coverage provider was never
      # installed) report green for the life of this repository. If coverage
      # generation fails, this job fails, full stop.
      - name: Run unit tests with coverage
        run: npm run test:coverage:ci

      # AC4: record observed peak memory for this job. cgroup v2 exposes a
      # running peak at memory.peak; some hosts only carry the cgroup v1
      # memory.max_usage_in_bytes equivalent. Neither path is guaranteed to
      # exist on every kernel/cgroup configuration, so this step must not
      # fail the job when a file is absent — it only ever reports what it
      # can find, in human-readable MB.
      # AC4 of Story 2.1 asked for the peak recorded. The first version printed
      # it — and that number was unreadable for two days, because job logs on
      # this instance reach neither the API (404 on three routes) nor storage
      # (`log_in_storage` stays false; 0 of 4 logs persisted for run 492).
      #
      # 🚨 So the number goes where it CAN be read: into the artifact's NAME,
      # which lands in `action_artifact.artifact_name` in the database. One SQL
      # query returns it, forever, with no log, no browser and no human. This is
      # the project's own rule applied literally — prove it in the database or
      # the filesystem, never in stdout.
      #
      # `$GITHUB_ENV` is used deliberately here and would be forbidden for a
      # secret: the runner creates that file world-readable (0644) before the
      # step body runs. A memory figure is not a secret. `with:` cannot see
      # shell variables, so this is the only route from the measurement to the
      # artifact name.
      #
      # `if: always()` on both steps, unlike the coverage upload below: a run
      # that died is exactly when the peak is most worth having.
      - name: Record peak memory usage
        if: always()
        run: |
          if [ -f /sys/fs/cgroup/memory.peak ]; then
            bytes=$(cat /sys/fs/cgroup/memory.peak)
            mb=$(( bytes / 1024 / 1024 ))
            source="cgroup v2 memory.peak"
          elif [ -f /sys/fs/cgroup/memory.max_usage_in_bytes ]; then
            bytes=$(cat /sys/fs/cgroup/memory.max_usage_in_bytes)
            mb=$(( bytes / 1024 / 1024 ))
            source="cgroup v1 memory.max_usage_in_bytes"
          else
            mb="unknown"
            source="neither cgroup v2 memory.peak nor cgroup v1 memory.max_usage_in_bytes exists on this runner"
          fi
          echo "Peak memory usage (${source}): ${mb} MB"
          echo "PEAK_MB=${mb}" >> "$GITHUB_ENV"
          printf 'peak_mb=%s\nsource=%s\nheap_ceiling_mb=16384\n' "${mb}" "${source}" > peak-memory.txt

      # The payload is three lines; the POINT is the name. `peak-memory-1487mb`
      # in `action_artifact.artifact_name` is the measurement itself, readable
      # by `select artifact_name from action_artifact where run_id = ?`.
      # A run where neither cgroup file exists yields `peak-memory-unknownmb`,
      # which is also a finding rather than a silence.
      - name: Publish peak memory as an artifact name
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: peak-memory-${{ env.PEAK_MB }}mb
          path: peak-memory.txt
          retention-days: 7

      # Archive before upload: `actions/upload-artifact@v3` writes one
      # database row per FILE, not one per upload. Story 2.1 proved this
      # uploading `dist/` unpackaged — 154 rows for 154 files (see the `dist`
      # upload below). `vitest.config.ts:26`'s `html` reporter can emit close
      # to one file per source file the suite touches — up to roughly 1229
      # candidate files, up to ~8x the `dist` upload, and this job runs twice
      # per commit once a PR is open (push + pull_request). Archiving into one
      # file makes the row count exactly 1 regardless of how many files the
      # html reporter produced. No step here runs on failure: if the coverage
      # step above failed, the job is already failing (AC3) and there is
      # nothing trustworthy to archive.
      - name: Archive coverage report
        run: tar -czf coverage.tar.gz coverage/

      # Same @v3 pin as the `dist` upload below, same reason — @v4 does not
      # resolve on this instance (GHESNotSupportedError, Story 1.8).
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage
          path: coverage.tar.gz
          # 7 days, not 1 (raised 2026-08-14 by Oleg's decision). The first
          # rationale for flagging this was wrong: it worried about opening
          # coverage after a FAILED run, but the steps above carry no
          # `if: always()`, so a failed run produces no artifact at all. The
          # real case is a GREEN run consulted later than the same day — 24h
          # covers "next morning" and fails Friday→Monday. Cost of 7 days at
          # 3.9 MB per run and daily cadence is ~28 MB, negligible beside the
          # 154 `dist` rows kept on the same terms.
          retention-days: 7

  build:
    name: Build
    runs-on: node-20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # CI-only literal. The ported line was
          # `${{ secrets.VITE_API_BASE_URL || 'http://localhost:80' }}`
          # (CI.yml:96-99) and that `||` fallback is exactly the construct NFR8
          # and D6 forbid: a missing variable must fail the build, not ship a
          # bundle pointed somewhere silently. This build is a compile-and-bundle
          # check — its output is never deployed anywhere, so a real API base
          # URL is not needed here. Real per-environment values are Story
          # 3.3's job, read from OpenBao at deploy time.
          VITE_API_BASE_URL: http://ci.invalid

      # Pinned to @v3, not @v4: @v4 fails on this instance with
      # GHESNotSupportedError (Story 1.8). @v3 is the version Story 1.8
      # proved works — its own log confirmed "Container for artifact ...
      # successfully created" and "Artifact has been finalized".
      #
      # That proof covers upload only. There is still no Actions-artifacts API
      # on this instance (established by Story 2.3, deferred-work.md:886-898:
      # a token-authenticated call to
      # /api/v1/repos/CRM/fe-prionex/actions/artifacts returns 404) — but the
      # web route /CRM/fe-prionex/actions/runs/{index}/artifacts/{name}
      # exists and gates on a browser session (Story 2.3,
      # deferred-work.md:886-898). It redirects an API token to /user/login —
      # which proves the route exists and is session-gated, NOT that the file
      # comes out the other side. Only a human click proves a download. Never
      # build a script or a
      # later story on programmatic artifact retrieval, it does not work here.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/
          retention-days: 1

  # No Codecov step, no Codecov token, no Codecov secret — anywhere in this
  # file (FR3). Story 2.3 reintroduced coverage generation (`test` job, above:
  # `test:coverage:ci`, single pass) and publishes it as an uploaded workflow
  # artifact — archived to one file first, `actions/upload-artifact@v3` — in
  # place of the third-party upload this comment used to describe as future
  # work. See
  # _bmad-output/implementation-artifacts/2-3-publish-coverage-as-an-artifact-instead-of-uploading-to-codecov.md.
