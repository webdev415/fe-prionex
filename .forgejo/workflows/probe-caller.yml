# PROBE — temporary. Delete once Story 3.4's reuse question is settled.
#
# The caller half. One dispatch of this file measures five separate unknowns
# at once, which is why the whole question costs two runs rather than four:
#
#   1. `needs:` BEFORE a `uses:` job          — job `call` needs `before`
#   2. `with:` — typed inputs into a callee   — `ref` and `environment`
#   3. `secrets:` — explicit key-by-key map   — deliberately NOT `inherit`
#   4. `needs:` AFTER a `uses:` job           — job `after` needs `call`
#   5. a callee output reaching the caller    — `needs.call.outputs.echoed`
#
# Explicit mapping rather than `secrets: inherit` on purpose. Story 1.3's own
# table lists `inherit` under "expectations to test against, not findings" —
# and explicit mapping is the form that works whether or not `inherit` does.
# If explicit mapping works, the design is unblocked and `inherit` is a
# convenience we can measure later or never.
#
# Runs on `main` only. A probe on a side branch cannot distinguish "the
# feature is unsupported" from "the default branch was not carrying it" —
# that confound is exactly what made the `workflow_run` measurement valid.

name: probe-caller

on:
  workflow_dispatch:

jobs:
  before:
    name: Before
    runs-on: node-20
    timeout-minutes: 5
    steps:
      - name: Prove this job ran first
        run: echo "before ok"

  call:
    name: Call
    needs: [before]
    uses: ./.forgejo/workflows/probe-callee.yml
    with:
      ref: probe-from-caller
      environment: dev
    # No `secrets:` mapping on purpose. The callee cannot declare secrets at all
    # on this instance (the parser rejects `on.workflow_call.secrets`), so the
    # first thing worth knowing is whether repository secrets are ambient inside
    # a same-repo callee. `secrets: inherit` is the fallback to try only if this
    # comes back empty.

  after:
    name: After
    needs: [call]
    runs-on: node-20
    timeout-minutes: 5
    env:
      ECHOED: ${{ needs.call.outputs.echoed }}
    steps:
      - name: Assert the callee's output reached the caller
        run: |
          set -euo pipefail
          echo "OUTPUT ACROSS BOUNDARY=[${ECHOED:-}]"
          if [ -z "${ECHOED:-}" ]; then
            echo "FAIL: the callee produced an output and the caller received nothing."
            echo "      Story 4.8's shared deploy definition cannot return a value."
            exit 1
          fi
          if [ "${ECHOED}" != "ref=probe-from-caller;env=dev" ]; then
            echo "FAIL: the output crossed but was mangled."
            echo "      expected [ref=probe-from-caller;env=dev]"
            exit 1
          fi
          echo "PASS: inputs went in typed and the output came back intact."
