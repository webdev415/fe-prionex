name: Probe Downstream

# Story 3.4, Task 1 — does Forgejo 15.0.5+gitea-1.22.0 support workflow_run as a
# TRIGGER? The string is in the binary 16 times, but Gitea 1.22 also has
# workflow_run as a WEBHOOK EVENT, so presence proves nothing about this path.
#
# 🔴 ON MAIN DELIBERATELY. The first probe ran from a feature branch: upstream
# went green, the downstream never fired, and the positive control proved the
# file WAS registered (it dispatched fine). That still did not settle it, because
# on GitHub `workflow_run` only fires for workflows living on the DEFAULT branch
# — and Forgejo copies GitHub's semantics widely. Two hypotheses produced the
# same observation: unsupported, or supported-but-must-be-on-main. Landing the
# pair on main is the only way to tell them apart.
#
# 🔴 The failure is expected to be SILENT: an unsupported trigger does not error,
# the workflow simply never fires. So the probe must be able to tell "did not
# fire" from "fired and did nothing" — which is why the step writes a tag into
# the registry rather than a line into a log. A package_version row is a positive
# fact in the database; an absent log line is not.
on:
  # POSITIVE CONTROL. If this file can be dispatched, Forgejo parsed and
  # registered it — so a missing workflow_run-triggered run means the TRIGGER is
  # unsupported, not that the file was invisible. Without this, the absence of a
  # downstream run proves nothing: it is equally consistent with "unsupported"
  # and with "Forgejo never saw the file". That is the trap Story 2.1 fell into
  # with job logs, and the rule Story 1.11 wrote down — an empty result is not
  # evidence of safety.
  workflow_dispatch:
  workflow_run:
    workflows: ["Probe Upstream"]
    types: [completed]

jobs:
  downstream:
    runs-on: node-20
    steps:
      - name: Report what the event carried
        run: |
          set -eu
          echo "FIRED. event=${GITHUB_EVENT_NAME}"
          echo "--- the fields Story 3.4 will need, printed rather than assumed ---"
          cat "${GITHUB_EVENT_PATH}" 2>/dev/null | head -c 4000 || echo "(no event payload readable)"
