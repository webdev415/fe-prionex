name: DEV branch autodeploy

# Builds and deploys the DEV stand on every push to `dev`.
#
# Build (build.yml) and deploy (deploy-stand.yml, reached via deploy-dev.yml on
# the manual path) are separate, and there is no other push -> build -> deploy
# chain for `dev`, so this thin caller wires the two reusable workflows:
#   build  -> build.yml        (ref=dev, environment=dev) -> sha-<12hex>-dev
#   deploy -> deploy-stand.yml  (the same DEV parameters deploy-dev.yml passes)
#
# `concurrency.group` is the same literal deploy-dev.yml and dev-reset.yml use
# (`deploy-dev-fe-prionex-dev`) so a push deploy, a manual deploy, and the weekly
# reset can never overlap the stand's pull -> up -d window. It must stay a literal
# constant (an expression fails the whole file at pre-execution — D30/D33) and
# must live in this caller (a callee's own concurrency block is void when the
# workflow is called — D21).
#
# The `name:` is deliberately NOT `Deploy DEV Stand`: dev-reset.yml dispatches
# deploy-dev.yml by name and greps the runs API for that literal, so a distinct
# name keeps these runs out of that read.
#
# `ref: dev` is a literal (a github-context expression in a caller's `with:` can
# resolve empty here — see build.yml's workflow_call `ref` note), so build and
# deploy each re-derive `dev` HEAD; `cancel-in-progress: false` plus the stand
# file-lock bound the race to the same window build-main.yml already accepts.
#
# 🔴 ── `reuse_published_image: "true"` — the precondition for the weekly reset ──
# Not an optimisation. This is the ONE caller of build.yml whose pushes are
# routinely pushes of a commit that is ALREADY BUILT: the weekly reset
# (`dev-reset.yml`) force-updates `dev` to a `main` commit whose `sha-<12>-dev`
# image `build-main.yml` published hours earlier. Without this input the push
# rebuilds that commit, `vite.config.ts:8` bakes a fresh `Date.now()` into the
# bundle on the cache miss, the digest differs from the published one, and
# `build.yml`'s Story 3.6 AC2 guard REFUSES to repoint the protected tag —
# correctly. Measured, not predicted: run 1397 (2026-09-21, the manual reset)
# failed at exactly that step, with the stand nevertheless correct.
#
# A weekly red run that means nothing is read for about a month and then not at
# all, so it is fixed here rather than tolerated: with this input, a push of an
# already-published commit resolves `sha-<12>-dev` BEFORE building (build.yml's
# `predigest` step, which already ran on every path — no new resolver), skips
# the build and the attach, re-points only the mutable `dev-dev` tag at the
# image that exists, and goes green. The protected tag is never touched; the
# guard is not weakened, it is simply not asked a question nobody wants answered
# (`docs/dev-weekly-reset-plan.md` §4.1).
#
# It is equally correct for the ordinary case this file was written for: an
# ordinary push to `dev` is a NEW commit, `sha-<12>-dev` does not exist, and
# build.yml's decision step resolves to `reuse=false` — the historical path,
# unchanged. The only behaviour that changes is the re-push of a commit already
# built, which today can only fail.

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev-fe-prionex-dev
  cancel-in-progress: false

jobs:
  build:
    name: Build and Push Image
    uses: ./.forgejo/workflows/build.yml
    with:
      ref: dev
      environment: dev
      # Quoted string, matching the input's own declared type — build.yml
      # compares it against the literal `'true'`. See the block above the `on:`
      # key for why this caller, and only this caller, sets it.
      reuse_published_image: "true"
    secrets: inherit

  deploy:
    name: Deploy DEV via the shared definition
    needs: build
    uses: ./.forgejo/workflows/deploy-stand.yml
    with:
      runner_label: deploy-dev-preprod
      compose_project_name: fe-prionex-dev
      container_name: fe-prionex-dev
      frontend_port: 127.0.0.1:8082
      frontend_network: crm-dev-network
      stand_dir: /root/crm-prionex/fe-prionex-dev
      image_env: dev
      ref: dev
      lock_wait_seconds: "240"
      lock_ttl_seconds: "720"
      health_timeout_seconds: "120"
      expect_unrouted_api: "true"
    secrets: inherit
