name: Deploy PRE-PROD Stand

# Story 5.2 provisioned the PRE-PROD stand; Story 5.3 (this file) is the first CONSUMER of the
# shared `workflow_call` definition's second mode — deploying a pre-built `image_tag` directly,
# with no application `ref` anywhere. `.forgejo/workflows/deploy-stand.yml` (Story 4.8) is
# READ-ONLY to this story (§12) and carries the actual mechanics: compose placement, `down`,
# fail-fast digest-pinned pull, `up -d`, the parameterized health check, the Story 4.4 lock, and
# the Kong guard. This file is a THIN caller — its own name, its own dispatch inputs and its own
# `concurrency:` block, nothing else.
#
# ── The runner label — deliberately NOT the skeleton's `deploy-preprod-preprod` ─────────────────
# `deploy-stand.yml:216`'s commented caller skeleton suggests `runner_label: deploy-preprod-preprod`.
# No such label exists on any runner. Three sources of truth on the deploy runner's own labels
# disagree (`.runner` on disk: four labels; the runner's own `config.yml`: one; Postgres
# `action_runner.agent_labels`, the table the SCHEDULER actually matches `runs-on` against: one —
# `["deploy-dev-preprod"]`, re-confirmed read-only immediately before this file was written,
# 2026-08-24). `deploy-dev-preprod` is the only value present in every source and the only one with
# live dispatch evidence (deploy-dev.yml, dev-reset.yml, runs 1132-1150). This story does NOT edit
# `deploy-stand.yml:216` to fix the comment — every edit to that file re-triggers Epic 5's own
# re-earning of the retro-E5 evidence Story 4.8 paid for, and it sits inside Story 4.9's blast
# radius. The correction lives HERE, in a file that actually executes, and the comment fix is
# routed to Story 6.4 (`docs/migration-decisions.md#d37`, `deferred-work.md`).
#
# ── `concurrency:` — own literal group, never DEV's, never an expression (D21/D30) ──────────────
# `group:` is a LITERAL CONSTANT. A workflow this instance cannot parse fails BEFORE any job
# exists, visible only in `action_run.pre_execution_error_details` (no job, no log, no API route
# for it — D21). Copying DEV's own group would serialize two independent stands and hide it
# (Prohibition 7). This block is real protection only because the shared definition deliberately
# carries no `concurrency:` of its own — a callee's own block would be silently VOID (D21) — so it
# must live here, in the caller, exactly as it does in deploy-dev.yml.
#
# ── `secrets: inherit` — all-or-nothing, named for Oleg before Story 6.4 ships ───────────────────
# The callee receives every org secret this repository holds and references only
# `REGISTRY_USER_RO`/`REGISTRY_TOKEN_RO`. PRE-PROD is the intermediate case between DEV (already
# live) and Story 6.4's PRODUCTION caller, where this question is sharper. Not re-litigated here.
#
# ── `image_tag` mode's first live execution — this file's own first dispatch ────────────────────
# The mode this caller consumes has never executed anywhere. Two blockers Story 4.8's own code
# review found by reading were fixed in the same pass and have never been dispatched — this file's
# first dispatch is the discriminating event, not a confirmation.
#
# ── Naming invariants — deliberately NOT claimed for this file ──────────────────────────────────
# deploy-dev.yml's exact file name and workflow `name:` are load-bearing because `dev-reset.yml`
# dispatches and reads it back by both, silently. Nothing dispatches or reads back
# `deploy-preprod.yml` by name today. If a future PRE-PROD reset or a Story 5.4 recorder starts
# doing so, this header should be upgraded to say so explicitly, the same way deploy-dev.yml's is.
#
# ── `simulate_bad_credential` / `hold_lock_seconds` — added here, not in the epic's skeleton ────
# The skeleton omits both. This caller forwards them byte-for-byte in DEV's own dispatch shapes
# because without them AC4's 401 row and AC3's lock-contention row have no cheap discriminating
# form at all on this stand. Permanent, minimal regression hooks (Story 4.4 Task 5, Story 4.8 Task
# 8.3) — they move into the shared definition, they do not disappear, and that applies to every
# consumer, not only DEV. Full safety argument for both lives in deploy-dev.yml's own header and in
# the shared definition's own `hold-lock` job / digest-resolve step comments; unchanged here.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "A pre-built image tag to deploy directly (e.g. sha-00ef3be4743d-preprod). Required — there is no git ref for PRE-PROD deploys; the tag names the exact artifact being validated."
        required: true
        type: string
      simulate_bad_credential:
        description: 'TESTING ONLY (permanent regression hook, forwarded to the shared definition — see this file''s own header) — if true, the digest-resolve step uses a deliberately WRONG credential value, to exercise the unauthorized fail-closed path on demand. Never reads, modifies, or exposes the real REGISTRY_USER_RO/REGISTRY_TOKEN_RO org secrets. Leave false (the default) for every normal deploy.'
        required: false
        type: boolean
        default: false
      hold_lock_seconds:
        description: "TESTING ONLY (permanent regression hook, forwarded to the shared definition — see this file's own header) — if greater than 0, this dispatch does NOT deploy: it starts the stand lock's holder container for this many seconds and exits, to stage contention for a following dispatch. Bounded to the holder TTL constant (720s). Leave 0 (the default) for every normal deploy."
        required: false
        type: number
        default: 0

concurrency:
  group: deploy-preprod-fe-prionex-preprod
  cancel-in-progress: false

jobs:
  deploy:
    name: "Deploy PRE-PROD via the shared definition"
    uses: ./.forgejo/workflows/deploy-stand.yml
    with:
      runner_label: deploy-dev-preprod
      compose_project_name: fe-prionex-preprod
      container_name: fe-prionex-preprod
      frontend_port: 127.0.0.1:8083
      frontend_network: crm-preprod-network
      stand_dir: /root/crm-prionex/fe-prionex-preprod
      image_env: preprod
      image_tag: ${{ inputs.image_tag }}
      lock_wait_seconds: "240"
      lock_ttl_seconds: "720"
      health_timeout_seconds: "120"
      expect_unrouted_api: "false"
      simulate_bad_credential: ${{ inputs.simulate_bad_credential }}
      hold_lock_seconds: ${{ inputs.hold_lock_seconds }}
    secrets: inherit
