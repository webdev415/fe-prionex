name: Weekly DEV Reset

# 🔴 ── 2026-09-21: this file now RESETS THE BRANCH, not only the stand ───────────────────
# Everything below this block was written when the job's whole destructive surface was a sweep of
# untagged images. It no longer is: the `Reset the dev branch` step force-updates `refs/heads/dev`
# to `main`, and a force-update DESTROYS COMMITS. Read `docs/dev-weekly-reset-plan.md` §4.2 before
# changing anything in that step — in particular:
#
#   • The "no volumes, no data, worst case is DEV serves main" argument below is about THE STAND
#     and does NOT extend to the branch. The manual run of this procedure on 2026-09-21 discarded
#     65 commits; that was a deliberate act under supervision. A schedule does it unwatched. The
#     three things that make it survivable are all in that step and none is decoration: an
#     ANNOTATED archive tag pushed BEFORE the branch moves (so the discarded work is recoverable
#     and the run leaves a permanent record where nothing else on this instance can — job logs
#     404 and no `$GITHUB_STEP_SUMMARY` row has ever been found in this repository's data), a
#     preflight count with a REFUSAL ceiling, and `--force-with-lease` against the exact SHA the
#     count was taken on.
#   • `MAX_DISCARDED` is a blast-radius ceiling in the same sense as `MAX_CANDIDATES` in the sweep,
#     not a tuning knob. Its value is measured (weekly unique-commit volume on the old `dev`,
#     W23–W38 2026: 41–99 normal, 279 peak; a month of the schedule silently not running is
#     ≈260). Raising it is a decision about how much unwatched destruction is acceptable.
#   • The push credential is a REPOSITORY DEPLOY KEY (`dev-weekly-reset`), not a user token, and
#     that choice is the exit plan: a deploy key is deleted by a repository admin in one step,
#     whereas a user token on this instance cannot be revoked by anyone but its owner. Plan §3.2.
#
# ── the original header follows, still accurate for the sweep and the dispatch ────────────
#
# Story 4.6. A TRIGGER, almost nothing else (Dev Notes §1). The deploy already exists and is
# live-proven (`deploy-dev.yml`, runs 929/938/950/962/965/968/973); the image this file asks for is
# published on every merge to `main` by `build-main.yml`, written for exactly this reason
# (`build-main.yml:23-26`). What this file adds: a schedule, a sweep, and a dispatch — nothing that
# deploys.
#
# ── Why a NEW file, not a change to deploy-dev.yml (AC1) ────────────────────────────────────────
# `4-3-…md:225-228`: "Story 4.6 is the story that adds a schedule, deliberately and separately."
# `deploy-dev.yml`'s own `on:` block carries `workflow_dispatch` and NOTHING ELSE, is live-proven
# across four review rounds, and is not touched by this story (Task 9.1) — not even to add a
# default for `ref`, which would delete deploy-dev.yml's own fail-closed "no ref, no deploy"
# property. Both sibling repositories on this instance independently wrote the identical rule for
# themselves (`PRIONEX_HUB/.github/workflows/deploy-dev.yml:4-5`, their AD-4). This file DISPATCHES
# `deploy-dev.yml` with `ref=main` through the Forgejo API and contains no deploy logic of its own
# — no `docker login`, no digest resolution, no `docker compose down`/`up -d`, no health check, no
# Kong guard, no copy of the stand's five variables (AC3). Five alternatives were ranked and
# rejected — `workflow_call` (pre-empts Story 4.8's own decision and disables `deploy-dev.yml`'s
# own concurrency block on the call path, D21), a schedule bolted directly onto `deploy-dev.yml`
# (deletes the fail-closed ref requirement), a host cron on s1 (leaves version control), a
# by-hand weekly dispatch (the honest name for "unsolved"), and duplicating the deploy body (what
# BOTH sibling projects did, and exactly the debt Story 4.8 exists to not inherit). Full argument:
# `docs/migration-decisions.md#d31`.
#
# 🔴 ── What this file's own status CAN and CANNOT tell you (AC6, narrowed — code review DN1) ──
# AC6 as first written promised a red run for two things this mechanism cannot see: `main-dev` not
# existing, and the deploy itself failing — both happen entirely INSIDE the `deploy-dev.yml` run
# this file only REQUESTS. Narrowed, by Oleg's decision, to what this file's own layer can actually
# classify: the DISPATCH REQUEST succeeding (a real `2xx`) AND a real `deploy-dev.yml` run being
# confirmably created as a result (the non-blocking read-back step below) are what this run's own
# colour reports. Whether that spawned run then SUCCEEDS is `deploy-dev.yml`'s own status to carry
# — AC5 reads the stand's digest, not this run's status, for exactly this reason. The two
# deploy-layer causes are covered by `deploy-dev.yml`'s own live-proven classifiers instead (run
# 948, Story 4.3, drove its own 404/AC4 path for real) — this file cannot observe them and does not
# claim to.
#
# 🔴 ── Known residual gap, accepted with a removal trigger (H2) ──────────────────────────────────
# Even with the read-back below, a deploy that the reset successfully TRIGGERS and that then fails
# INSIDE `deploy-dev.yml` produces a run this file marks green — because that failure is real,
# correctly attributed to a different run, and simply invisible from here without polling the
# dispatched run to completion, which is the self-deadlock this file's own header forbids. Until
# Story 4.5 restores Slack notifications, the compensating control is human: DN3(ii) names a
# reader who checks BOTH the reset's own run and the `deploy-dev.yml` run it spawns, by query, every
# Sunday — silence is not evidence of success on this file alone. **Removal trigger: when Story 4.5
# lands, its own failure notification on `deploy-dev.yml` closes this gap and the by-query reader
# in DN3(ii) can stand down.** A cheap detector was considered and declined: having the reset write
# its own "I ran" marker (a file, a second API call, a label) adds a new artifact with its own
# failure modes for a problem the read-back below and DN3(ii)'s human reader already price
# adequately; not worth the weight until 4.5 shows the gap is still open in practice.
#
# ── s1 is multi-tenant — the sweep's prohibition list (AC4) ─────────────────────────────────────
# `CRM/api-prionex`'s own census: 185 containers matching `crm-` alone on this host, including the
# four Forgejo runner containers THIS JOB executes inside, Forgejo's own Postgres, OpenBao, and
# another team's `techno-finance` stack. None of the following ever appears in this file, each for
# a specific measured reason, not caution: `docker image prune` (bare or `-a`) — host-wide, no
# repository filter, deletes another tenant's dangling layers; `docker system|volume|network|
# builder prune` — `crm-dev-network` is `external:` and belongs to `CRM/api-prionex`, volumes are
# other tenants' data, the build cache is a registry-and-host asset; any name filter used as a
# SUBSTRING in a destructive position — `docker ps --filter name=` is a substring match on this
# host (`deferred-work.md:2650-2653`: an unanchored `name=fe-prionex` filter returns the FOUR
# `forgejo-runner-fe-prionex*` containers, including the runner this job runs inside); any
# `xargs`-driven bulk removal — loses per-item failure handling and the ability to say what was
# kept and why; `docker rm -f` on a RUNNING holder — that is a live deploy's lock
# (`deploy-dev.yml:1284-1404`'s H4 warns the human path about exactly this; an unattended job must
# be structurally incapable of it, not merely advised). 🔴 There is also no cap on HOW MANY objects
# one run may remove (code review L11) — a blast-radius ceiling below refuses and reports rather
# than silently acting on an enumeration that has widened past what a routine weekly cycle should
# ever produce.
#
# ── UTC, not local (Task 2.6) ────────────────────────────────────────────────────────────────────
# `action_schedule_spec.time_zone` is empty on this instance (measured), and empty means UTC
# (`models/actions/schedule_spec.go:66-82`). s1 runs CEST/CET (+2h summer, +1h winter). The cron
# below is written in UTC and landed at that value deliberately — see the `- cron:` line's own
# comment for what that is in s1's local clock, for both halves of the year. `TZ=`/`CRON_TZ=`
# prefixes and the `timezone:` YAML key are supported by this Forgejo build and are FORBIDDEN here
# (AC7) — none has ever been exercised on this instance, and a UTC expression has no DST
# transition at all, sidestepping Forgejo's own documented DST skip/double-fire behaviour entirely.
# 🔴 Why the cron line below is load-bearing code, not configuration (AC7, code review L9): a spec
# that fails to parse at TICK time does not merely skip a run — Forgejo **persistently DISABLES**
# the whole workflow (`services/actions/schedule_tasks.go:92-101`), and a pushed fix does not
# revive it, only a human re-enabling it in the UI does. Separately, open issue **codeberg #12566**
# (filed against this major version) reports that an invalid `on.schedule` cron can break
# **push-triggered Actions for the entire repository**, including workflows that carry no schedule
# at all. Validated locally against a 5-field-exact parser before every push to this line
# (Completion Notes) for exactly this reason.
#
# 🚨 ── The concurrency group is SHARED on purpose, and sharing it creates ONE self-deadlock trap
# (Dev Notes §6) ─────────────────────────────────────────────────────────────────────────────────
# This file declares the SAME literal group `deploy-dev.yml` does: `deploy-dev-fe-prionex-dev`.
# What that buys is narrower than it looks: the dispatched deploy is a SEPARATE run that carries
# the group by itself, so sharing it protects THE SWEEP from running while a human deploy is
# mid-flight (the sweep and a deploy's pull→up-d window touch the same object class) — it adds no
# protection to the deploy, which already had it. Because THIS job holds the group while it runs,
# the run it dispatches CANNOT START until this job's own run leaves the group. **Any future change
# that makes this job wait for the deploy it triggered — polling the run to completion, "so the
# weekly run's own status is meaningful", or to sweep AFTER instead of before — is a
# SELF-DEADLOCK**, resolved only by `timeout-minutes` expiring. This is the single most likely
# well-intentioned regression on this file. Fire and exit. The non-blocking read-back below is
# deliberately NOT this mistake: one `GET`, no polling loop, no wait on the group.
#
# ── No volumes, no data — why an UNATTENDED, RECURRING job is safe here (AC5, AC6) ─────────────
# The sibling project's own coordinator disarmed their schedule after a near-miss they called
# "protection by coincidence" — an unrelated blocker happened to stop their run before the
# destructive stage, and the moment it lifted, the schedule would have gone destructive with no
# further human act (`api-prionex_f/.forgejo/workflows/dev-weekly-reset.yml:86-96`). This stand
# carries no volumes and no database — the worst outcome of a spurious reset here is that DEV
# serves `main` instead of somebody's feature branch, which is the exact state this story exists
# to produce on a schedule. That difference is why this file may arm a schedule where theirs could
# not.
#
# 🔴 AMENDED 2026-09-21, and the amendment is the important half: the paragraph above is now only
# HALF of what this job does. It argues that resetting THE STAND unattended is safe because the
# stand holds nothing. That argument is sound and unchanged. It does NOT carry over to resetting
# THE BRANCH, which this job now also does: a branch holds work, the worst outcome there is not
# "DEV serves main" but "somebody's commits are gone", and the sibling project's "protection by
# coincidence" near-miss is therefore live again for the new half. The compensating controls are
# named in the block at the very top of this file and implemented in the reset step itself; they
# are what makes the branch half survivable, not this paragraph.
#
# 🔴 ── Disarm procedure, pre-agreed (DN3(iii)) ─────────────────────────────────────────────────
# To pull this schedule out of production: comment out the ENTIRE `schedule:` block below — never
# leave the key present with zero items (Task 2.7 — an empty `schedule:` key may be rejected
# outright by the parser, and a rejected file surfaces as a run with one job named after the commit
# title and no log at all, `api-prionex`'s own run 442, indistinguishable from success without this
# warning). Push to `main` — every default-branch push wipes and re-registers this repository's
# schedules (Task 2.10), so the push itself is the deregistration; no separate action is needed.
#
# ── Every step is plain `run:` (Task 3.5) ───────────────────────────────────────────────────────
# `uses:` steps do not execute at all on `deploy-base-dev-preprod:2026-08-07` — measured, run 920.
# No `${{ }}` inside any `run:` body, not even inside a shell comment (Task 3.6) — Forgejo
# substitutes inside comments too (`build.yml:812-816`; `api-prionex`'s own Л1: one empty token
# once rejected a whole workflow with no diagnostic). Values arrive through step-level `env:` and
# are referenced as shell variables. `concurrency:`/`on:` are workflow-level keys, not `run:`
# bodies. Every fail-closed guard survives its own command substitution to print its message —
# `deploy-dev.yml:75-88` carries the fixed idiom (4.3's review found seven guards that did not,
# 4.4's found two more) — code review's fix-pass round found this file itself had regressed three
# instances of the M14 shape (`|| true` in a destructive position) and two of the H6 shape
# (destructive command's own stderr discarded); both fixed below, in the same idiom, not a new one.

on:
  # 🔴 ── DISARMED ON MERGE, DELIBERATELY (code review Medium, 2026-09-21) ────────────────────
  # The whole `schedule:` block below is commented out, in this file's own pre-agreed disarm
  # shape (see the disarm note in the header: comment the ENTIRE block, never leave the key with
  # zero items — an empty `schedule:` may be rejected outright, and a rejected file surfaces as a
  # run with one job and no log, indistinguishable from success).
  #
  # Why it ships disarmed rather than armed. A push to `main` re-registers this repository's
  # schedules, so merging an armed block would arm `1 0 * * 1` **immediately** — and the branch
  # half of this job has never executed live. As of this commit the reset step has been exercised
  # only against local fixture repositories; the SSH path, the deploy key, the branch-protection
  # interaction and the leased push have never run end to end from the `deploy-dev-preprod`
  # runner. The plan's own phase 4 requires a manual `workflow_dispatch` as the proof BEFORE any
  # scheduled run, and with Story 4.5 still open there is no failure notification — so an armed
  # merge late in the week would make the first-ever execution of this code both unattended and
  # unwatched. Commit loss is well guarded (the archive tag is written and read back before the
  # branch moves), so the realistic worst case is a red run or a reset without its deploy; that
  # is still not a thing to discover on a Monday at 00:01 UTC.
  #
  # 🔴 THE PRICE OF SHIPPING DISARMED, named because it is easy to miss (code review Low): a
  # push to `main` WIPES and re-registers this repository's schedules, so merging this does not
  # merely fail to arm the new cron — it REMOVES the `0 2 * * 0` row that is registered and live
  # today, and with it the Sunday stand-only reset that has been running since runs 1019-1041.
  # Between this merge and phase 4 the DEV stand is not brought to `main` on any schedule at all,
  # and nothing announces that. Accepted deliberately: the stand reset is recoverable by a manual
  # `workflow_dispatch` of this same file, whereas an armed-but-unproven destructive schedule is
  # not recoverable by anything. Do not let phase 4 slip quietly.
  #
  # ✅ TO ARM: uncomment the two lines below — the `schedule:` key and its single `- cron:` item —
  # and push to `main`. The push itself is the registration; no separate action is needed. Do it
  # only after a manual `workflow_dispatch` of this workflow has driven the branch reset for real
  # (plan §6, phase 4). One line of diff, and it is the whole of phase 4's arming step.
  #
  # schedule:
    # 🔴 2026-09-21, Oleg's decision (`docs/dev-weekly-reset-plan.md` §5): `1 0 * * 1`, replacing
    # `0 2 * * 0`. Literal 00:01 UTC on MONDAY — 02:01 CEST in summer, 01:01 CET in winter. The
    # move from Sunday to Monday is the point: this job now resets the BRANCH, and the week's work
    # should start from a branch that was reset at the start of the week, not two-thirds of the way
    # through the weekend.
    #
    # Why a Monday-UTC expression and not a Monday-LOCAL one: no UTC cron can be "00:01 local
    # Monday" all year, and the two candidates that hit it in one half of the year miss in the
    # other — `1 23 * * 0` is 00:01 CET Monday in winter but 01:01 CEST in summer, and `1 22 * * 0`
    # is 00:01 CEST Monday in summer but 23:01 CET on SUNDAY in winter. This expression is instead
    # read in exactly the scale the instance evaluates it in, and a UTC expression has no DST
    # transition at all: the local hour drifts by one twice a year, but the firing instant never
    # shifts and can neither be skipped nor fired twice, which is the failure mode that actually
    # matters for a destructive job. The night window holds in both halves of the year.
    #
    # Validated against a 5-field-exact parser before this line was pushed — see the load-bearing
    # note in the header: a spec this instance cannot parse AT TICK TIME persistently DISABLES the
    # workflow, a pushed fix does not revive it, and codeberg #12566 reports it can take the whole
    # repository's push triggers down with it.
    #
    # ── the original note on the superseded Sunday value, kept for its measurements ─────────
    # Every Sunday, 02:00 UTC — 04:00 CEST (summer) / 03:00 CET (winter). Task 2.6: this instance's
    # schedule spec carries no time_zone, which Forgejo evaluates as UTC; the value here IS the UTC
    # instant, not a local one converted at read time. Validated locally against a 5-field-exact
    # parser matching `github.com/gdgvda/cron v0.7.0` (`cron.Minute|Hour|Dom|Month|Dow`, no seconds
    # field) before this file was ever pushed (AC7; Completion Notes). Registration and recurrence
    # both confirmed LIVE, not only designed (PR A's own probe window, Task 6.3, and the read-back
    # after PR B, code review H1): **five** scheduled firings total (runs 1019/1023/1032/1038/1041 —
    # the corrected count; two more ticks landed inside the observation window than the story first
    # booked), `trigger_event='schedule'`, system actor, a consistent 44s delay this repository's
    # own — not `PRIONEX_HUB`'s 1s, recorded as this repository's own measurement rather than
    # assumed to generalise. Post-PR-B state re-verified by query: exactly one `action_schedule_spec`
    # row survives (`spec='0 2 * * 0'`), the probe spec is gone.
    # - cron: '1 0 * * 1'
  workflow_dispatch: {}
    # Zero inputs, deliberately (AC1). The epic's own text only asks for "can also be dispatched
    # manually" — this is stronger, and the strength is the point: with no ref/tag/environment a
    # human can steer it at, a manual dispatch and a scheduled firing execute the IDENTICAL job
    # over IDENTICAL inputs, so the manual path becomes real evidence for the scheduled one (proves
    # the body), not a substitute for it (still has to prove the body ran at a moment nobody
    # chose). Precedent, same instance, same team: `PRIONEX_HUB/.github/workflows/reset-dev.yml:
    # 22-23`.

concurrency:
  group: deploy-dev-fe-prionex-dev
  cancel-in-progress: false

env:
  IMAGE_REPO: git.crm-prionex.com/crm/fe-prionex

jobs:
  reset:
    name: "Weekly reset — sweep, reset dev to main, then dispatch deploy-dev.yml"
    runs-on: deploy-dev-preprod
    # Task 3.4: small on purpose. This job dispatches and sweeps; it does not deploy, and it must
    # not be able to sit inside the shared concurrency group for long (see the self-deadlock note
    # above) — 5 minutes was generous for a job whose own steps were a handful of docker/curl
    # calls.
    # 🔴 Raised to 8 on 2026-09-21, with the reason rather than the habit: the branch reset adds a
    # clone (28 MiB packed, seconds on this host's own network) and two pushes, so the headroom
    # shrank while the number of ways to be slow grew. 3 extra minutes of group hold is cheap; a
    # timeout that fires in the middle of the reset step is not — the step is ordered so that a
    # kill at any point leaves a harmless state (the archive tag can exist without the branch
    # having moved; the reverse cannot happen), but that ordering is a safety net, not a plan.
    timeout-minutes: 8
    steps:
      - name: Sweep stale images and lock-holder debris (Task 5, AC4)
        id: sweep
        env:
          MAX_IMAGE_AGE_HOURS: "168"   # 7 days. 🔴 Code review L2: NOT "one reset cycle's worth" —
                                       # because the sweep runs BEFORE the dispatch (Task 4.5), the
                                       # stand's own currently-running image is always excluded by
                                       # the reference check at sweep time regardless of age, so it
                                       # only becomes reclaimable on the CYCLE AFTER the one that
                                       # replaces it — reclamation lags two cycles, not one. The
                                       # threshold still exists to close Task 5.2's own race (a
                                       # freshly pulled, not-yet-referenced digest looks like debris
                                       # for the seconds between pull and `up -d`); 168h is generous
                                       # slack for that race, not a claim about which cycle it frees.
          MAX_HOLDER_AGE_HOURS: "24"   # A holder that finished over a day ago is not "a deploy that
                                       # just ended"; it is debris (M15's own tradeoff, Story 4.4).
          MAX_CANDIDATES: "50"        # Code review L11: a blast-radius ceiling, not a tuning knob —
                                       # a routine weekly cycle produces at most a handful of
                                       # candidates on either side; a count this high means the
                                       # enumeration itself has widened, and the correct response is
                                       # to refuse and report, not to act at unexpected scale.
        run: |
          set -euo pipefail
          # Code review M8: `|| true` on BOTH ends of this purely diagnostic command — it must
          # never be the reason this step (or its accounting below) fails or is skipped. The
          # closing call in particular used to sit in a fail-fast position AFTER every real removal
          # but BEFORE the $GITHUB_OUTPUT writes and the summary line, so its own failure could
          # mark a successful sweep as failed and invert the notice step's own message.
          echo "=== docker system df, before (borrowed verbatim from api-prionex's own file — costs nothing, answers the obvious review question) ==="
          docker system df || true

          REMOVED_IMAGES=0
          KEPT_IMAGES=0
          REMOVED_HOLDERS=0
          KEPT_HOLDERS=0

          # Code review L2: "at least X hours old", not "older than X" — `-lt` below removes AT
          # exactly the threshold too (an image that is precisely 168h old is not kept), so the
          # comparison text must not promise a strict inequality it does not implement.
          echo "--- Images: only ${IMAGE_REPO}, only untagged, only unreferenced, only at least ${MAX_IMAGE_AGE_HOURS}h old ---"
          # Task 5.1: enumerate by REPOSITORY, not a bare `docker images` scan — anchors the sweep
          # to exactly this project's own repository, never another tenant's.
          # 🔴 Measured, not assumed, before this file was ever pushed: `docker images --filter
          # dangling=true` does NOT match a digest-pulled image on this daemon (containerd-backed
          # image store, docker 29.4.0) — a digest pull's own `RepoTags` array contains a
          # `repo@sha256:...` pseudo-entry (confirmed via `docker inspect`), which the `dangling`
          # filter's own emptiness check does not treat as untagged, so it silently matched ZERO
          # images every time — this story's own budget model names that exact shape as failure
          # cause 5 ("the sweep's enumeration is wrong in a way that removes nothing... silent
          # no-op"), and it would have shipped invisibly since a sweep that finds nothing prints a
          # clean, plausible-looking "no images found" line. The `{{.Tag}}` DISPLAY field, unlike
          # the `dangling` filter, correctly renders `<none>` for exactly these images (also
          # measured) — so this lists every image in the repository and filters client-side on
          # that field instead of trusting the filter. `<none>` is docker's own literal for "no
          # repository tag" — every deploy pulls by digest (Task 4.2 of Story 4.3), so this
          # accumulates by design.
          # 🔴 Code review M4: distinguish "the listing command itself failed" from "it succeeded
          # and found nothing" — the previous `|| true` made a daemon-level failure here
          # indistinguishable from a healthy, empty result, the same M14 anti-pattern this file
          # already regressed elsewhere (fixed throughout this round in the same idiom).
          if ! IMAGE_LINES_RAW="$(docker images "${IMAGE_REPO}" -a --format '{{.Tag}}|{{.ID}}|{{.CreatedAt}}' 2>&1)"; then
            echo "FAIL: 'docker images ${IMAGE_REPO}' itself failed — a docker daemon problem, not"\
                 "the same thing as no untagged images existing. Refusing to guess. Its own"\
                 "output/stderr:"
            printf '%s\n' "$IMAGE_LINES_RAW"
            exit 1
          fi
          # Code review L5: deduplicate by image id BEFORE the loop — the same underlying image can
          # appear more than once in this listing (e.g. multiple digest references to one id), and
          # without this, a second iteration's own `docker rmi` fails against an already-removed id
          # and prints a misleading "raced by something else" for what is actually a duplicate.
          IMAGE_LINES="$(printf '%s\n' "$IMAGE_LINES_RAW" | awk -F'|' '$1 == "<none>" { print $2 "|" $3 }' | awk -F'|' '!seen[$1]++')"
          NOW_EPOCH="$(date -u +%s)"
          if [ -n "$IMAGE_LINES" ]; then
            IMAGE_CANDIDATE_COUNT="$(printf '%s\n' "$IMAGE_LINES" | grep -c . || true)"
            if [ "$IMAGE_CANDIDATE_COUNT" -gt "$MAX_CANDIDATES" ]; then
              echo "FAIL: ${IMAGE_CANDIDATE_COUNT} untagged ${IMAGE_REPO} images found, over the"\
                   "${MAX_CANDIDATES}-candidate blast-radius ceiling (code review L11). This is"\
                   "far more than a routine weekly cycle should ever produce — refusing to act at"\
                   "this scale. Investigate the enumeration and the host before raising the ceiling."
              exit 1
            fi
            while IFS='|' read -r IMG_ID IMG_CREATED; do
              [ -z "$IMG_ID" ] && continue
              # `docker images ... CreatedAt` renders as e.g. "2026-08-14 15:34:50 +0200 CEST" or
              # "2026-08-21 06:58:56 +0000 UTC" — Go's default layout, always
              # "<date> <time> <±HHMM> <zone-name>".
              # 🔴 Live-found on the throwaway branch (run 1072, story-4-6 code-review DN2/7.5
              # dispatch), superseding the previous L6 note: THIS runner's actual `date` binary is
              # BusyBox v1.37.0 (`deploy-base-dev-preprod:2026-08-07`, confirmed via `date --help`),
              # whose `-d` TIME grammar has NO offset syntax at all (`hh:mm[:ss]`,
              # `[YYYY.]MM.DD-hh:mm[:ss]`, `YYYY-MM-DD hh:mm[:ss]`, `@seconds` — nothing with a
              # trailing `±HHMM`) — it rejects EVERY CreatedAt value unconditionally, regardless of
              # the offset's sign or magnitude, including the zero-offset `+0000 UTC` case, not only
              # the previously-flagged unnamed-zone shape. The prior claim that "`+0200` parses and
              # honours the offset" was verified against a different BusyBox build than the one this
              # job actually runs on (Completion Note 1 tested `busybox:1.38`/GNU `date` directly on
              # the host, not inside `deploy-base-dev-preprod`) — every prior sweep run (994 onward)
              # therefore fell through this parse failure on every image, every time; harmless only
              # because the failure is fail-closed (KEEP), never a mis-removal, but it meant the
              # image half of the sweep had never actually removed anything, ever, regardless of
              # age. Fixed by never asking `date -d` to understand an offset at all: parse the
              # `±HHMM` token ourselves and apply it by arithmetic against the naive (offset-free)
              # reading, which `date -u -d` (its `YYYY-MM-DD hh:mm[:ss]` form) parses natively.
              OFFSET_TOKEN="$(printf '%s' "$IMG_CREATED" | grep -oE '[+-][0-9]{4}' | tail -n1)"
              NAIVE_CREATED="$(printf '%s' "$IMG_CREATED" | sed -E 's/ [+-][0-9]{4}.*$//')"
              if ! IMG_EPOCH_NAIVE="$(date -u -d "$NAIVE_CREATED" +%s 2>/dev/null)"; then
                echo "KEEP  image ${IMG_ID}: could not parse its own CreatedAt ('${IMG_CREATED}') — refusing to guess its age."
                KEPT_IMAGES=$((KEPT_IMAGES + 1))
                continue
              fi
              OFFSET_SECONDS=0
              if [ -n "$OFFSET_TOKEN" ]; then
                OFFSET_SIGN="$(printf '%s' "$OFFSET_TOKEN" | cut -c1)"
                OFFSET_DIGITS="${OFFSET_TOKEN#[+-]}"
                OFFSET_HH="${OFFSET_DIGITS%??}"
                OFFSET_MM="${OFFSET_DIGITS#??}"
                OFFSET_SECONDS=$(( 10#$OFFSET_HH * 3600 + 10#$OFFSET_MM * 60 ))
                if [ "$OFFSET_SIGN" = "-" ]; then
                  OFFSET_SECONDS=$(( 0 - OFFSET_SECONDS ))
                fi
              fi
              # local = UTC + offset, so UTC = local(naive, read as if it were already UTC) - offset.
              IMG_EPOCH=$(( IMG_EPOCH_NAIVE - OFFSET_SECONDS ))
              AGE_HOURS=$(( (NOW_EPOCH - IMG_EPOCH) / 3600 ))
              if [ "$AGE_HOURS" -lt "$MAX_IMAGE_AGE_HOURS" ]; then
                echo "KEEP  image ${IMG_ID}: ${AGE_HOURS}h old, under the ${MAX_IMAGE_AGE_HOURS}h threshold (Task 5.2's race window; L2's own note on why this is NOT literally 'one cycle')."
                KEPT_IMAGES=$((KEPT_IMAGES + 1))
                continue
              fi
              # Task 5.1: exclude anything referenced by ANY container, running OR stopped —
              # `docker ps -a` (not `docker ps`) against the exact image id, not a name filter.
              # 🔴 Code review M1 (M14-class): this is AC4's OWN central clause — "exclude anything
              # referenced" — so a daemon-level failure here must not silently degrade into "found
              # no references", which would let the sweep proceed to remove a referenced image.
              if ! REFS="$(docker ps -a --filter "ancestor=${IMG_ID}" --format '{{.Names}}' 2>&1)"; then
                echo "KEEP  image ${IMG_ID}: the reference check itself failed (daemon problem) —"\
                     "AC4 requires excluding anything referenced, so an unreadable answer means"\
                     "KEEP, never proceed. Its own output:"
                printf '%s\n' "$REFS"
                KEPT_IMAGES=$((KEPT_IMAGES + 1))
                continue
              fi
              if [ -n "$REFS" ]; then
                echo "KEEP  image ${IMG_ID}: still referenced by container(s): ${REFS}."
                KEPT_IMAGES=$((KEPT_IMAGES + 1))
                continue
              fi
              # Task 5.1: remove by explicit image id, ONE AT A TIME, tolerate individual failures
              # (never `xargs`, per AC4's own prohibition list) — a failure on one image must not
              # abort the sweep for the rest.
              # 🔴 Code review M5 (H6-class): capture docker's own stderr instead of discarding it
              # — `deploy-dev.yml:364-367`'s own fix for this exact shape: a destructive command's
              # failure reason was thrown away and then guessed at in the message.
              if RMI_ERR="$(docker rmi "$IMG_ID" 2>&1 >/dev/null)"; then
                echo "REMOVE image ${IMG_ID}: untagged, unreferenced, ${AGE_HOURS}h old."
                REMOVED_IMAGES=$((REMOVED_IMAGES + 1))
              else
                echo "KEEP  image ${IMG_ID}: docker rmi failed — not fatal to the sweep. Its own"\
                     "stated reason: ${RMI_ERR}"
                KEPT_IMAGES=$((KEPT_IMAGES + 1))
              fi
            done <<< "$IMAGE_LINES"
          else
            echo "No untagged ${IMAGE_REPO} images found."
          fi

          echo "--- Lock-holder debris: only ^fe-prionex-dev-deploy-lock-[0-9]+\$, only stopped, only at least ${MAX_HOLDER_AGE_HOURS}h finished ---"
          # Task 5.3: ANCHORED at both ends — never a substring filter (AC4's first amendment
          # reason: `docker ps --filter name=fe-prionex` on this host also matches the four
          # `forgejo-runner-fe-prionex*` containers, including the one this job runs inside).
          # 🔴 Code review L7: `deploy-dev.yml:1305`'s own holder-finder uses this SAME pattern but
          # UNANCHORED (a prefix match) — if a holder name ever gains a suffix, that file would
          # still find it while this sweep silently stops seeing it, the quietest possible failure
          # mode. Cross-referenced here so a future edit to either file's own pattern does not
          # diverge from the other without someone reading both.
          # `docker ps -a` lists both running and stopped; filtered to NOT running below (5.4).
          # 🔴 Code review M4 (M14-class): same failure-vs-empty distinction as the image
          # enumeration above.
          if ! HOLDER_LINES="$(docker ps -a --filter "name=^fe-prionex-dev-deploy-lock-[0-9]+\$" --format '{{.Names}}|{{.Status}}' 2>&1)"; then
            echo "FAIL: 'docker ps' itself failed enumerating lock-holder containers — a docker"\
                 "daemon problem, not the same thing as no holders existing. Refusing to guess."\
                 "Its own output:"
            printf '%s\n' "$HOLDER_LINES"
            exit 1
          fi
          if [ -n "$HOLDER_LINES" ]; then
            HOLDER_CANDIDATE_COUNT="$(printf '%s\n' "$HOLDER_LINES" | grep -c . || true)"
            if [ "$HOLDER_CANDIDATE_COUNT" -gt "$MAX_CANDIDATES" ]; then
              echo "FAIL: ${HOLDER_CANDIDATE_COUNT} lock-holder containers found, over the"\
                   "${MAX_CANDIDATES}-candidate blast-radius ceiling (code review L11). Refusing"\
                   "to act at this scale — investigate before raising the ceiling."
              exit 1
            fi
            while IFS='|' read -r HNAME HSTATUS; do
              [ -z "$HNAME" ] && continue
              # 🔴 Code review M6, the most severe finding in this round: the OLD gate compared
              # only `docker ps`'s own `{{.State}}` field against the literal "running" — but a
              # `created` (never started), `paused`, `restarting` or `removing` container ALSO
              # fails that comparison, falls through to the age check, and — because
              # `.State.FinishedAt` on a container that never ran is the Go zero-value
              # (`0001-01-01T00:00:00Z`), which THIS FILE'S OWN sed/date pipeline parses
              # SUCCESSFULLY (verified: both BusyBox and GNU date accept it) rather than failing
              # closed — computes an astronomical fabricated age, clears the threshold, and
              # `docker rm` actually SUCCEEDS against it. Task 5.4 calls "never remove a running
              # holder" structural, not advisory; this makes it so for every non-terminal state,
              # not only "running" by exact string match. Read the FULL status line (`{{.Status}}`,
              # not `{{.State}}`) and require it to start with "Exited" or "Dead" — Docker's own
              # terminal-state prefixes — before this holder is even considered for removal.
              case "$HSTATUS" in
                Exited*|Dead*) : ;;
                *)
                  echo "KEEP  holder ${HNAME}: status='${HSTATUS}' is not a terminal state (Exited/Dead) — never removed regardless of any computed age. This is the structural form of Task 5.4's rule, closing code review M6."
                  KEPT_HOLDERS=$((KEPT_HOLDERS + 1))
                  continue
                  ;;
              esac
              if ! FINISHED_RAW="$(docker inspect -f '{{.State.FinishedAt}}' "$HNAME" 2>&1)"; then
                echo "KEEP  holder ${HNAME}: could not read its own FinishedAt — refusing to guess"\
                     "its age. Its own output: ${FINISHED_RAW}"
                KEPT_HOLDERS=$((KEPT_HOLDERS + 1))
                continue
              fi
              # Code review M6: reject the Go zero-value timestamp explicitly, before it ever
              # reaches date parsing — this is the exact value a container that never started
              # reports, and both BusyBox and GNU date parse it "successfully" into a nonsense
              # epoch far in the past rather than failing, which is precisely how the old gate's
              # own "refusing to guess" branch never fired for it.
              case "$FINISHED_RAW" in
                "0001-01-01T00:00:00Z"|"")
                  echo "KEEP  holder ${HNAME}: FinishedAt is the zero-value ('${FINISHED_RAW}') —"\
                       "this container never legitimately finished. Refusing to compute an age"\
                       "from it (code review M6)."
                  KEPT_HOLDERS=$((KEPT_HOLDERS + 1))
                  continue
                  ;;
              esac
              CLEAN_FIN="$(printf '%s' "$FINISHED_RAW" | sed -E 's/\.[0-9]+Z$//; s/Z$//; s/T/ /')"
              if ! FIN_EPOCH="$(date -u -d "$CLEAN_FIN" +%s 2>/dev/null)"; then
                echo "KEEP  holder ${HNAME}: FinishedAt ('${FINISHED_RAW}') did not parse — refusing to guess its age."
                KEPT_HOLDERS=$((KEPT_HOLDERS + 1))
                continue
              fi
              AGE_HOURS=$(( (NOW_EPOCH - FIN_EPOCH) / 3600 ))
              # Code review, shape borrowed from deploy-dev.yml:1348-1352's own negative-REMAINING
              # floor: an explicit if/then, not reliant on `&&`/errexit interaction.
              if [ "$AGE_HOURS" -lt 0 ]; then
                AGE_HOURS=0
              fi
              if [ "$AGE_HOURS" -lt "$MAX_HOLDER_AGE_HOURS" ]; then
                echo "KEEP  holder ${HNAME}: finished ${AGE_HOURS}h ago, under the ${MAX_HOLDER_AGE_HOURS}h threshold."
                KEPT_HOLDERS=$((KEPT_HOLDERS + 1))
                continue
              fi
              # Code review M5 (H6-class): capture stderr instead of discarding it.
              if RM_ERR="$(docker rm "$HNAME" 2>&1 >/dev/null)"; then
                echo "REMOVE holder ${HNAME}: stopped (${HSTATUS}), finished ${AGE_HOURS}h ago."
                REMOVED_HOLDERS=$((REMOVED_HOLDERS + 1))
              else
                echo "KEEP  holder ${HNAME}: docker rm failed — not fatal to the sweep. Its own"\
                     "stated reason: ${RM_ERR}"
                KEPT_HOLDERS=$((KEPT_HOLDERS + 1))
              fi
            done <<< "$HOLDER_LINES"
          else
            echo "No lock-holder containers matching the anchored pattern found."
          fi

          echo "=== docker system df, after ==="
          docker system df || true

          # Code review L8: the four counters used to go to $GITHUB_OUTPUT, which Task 6.3 itself
          # measured to be unreadable outside a job's own live execution on this instance, and
          # nothing ever consumed them (dead code, asserted as a diagnostic that could not actually
          # be read). Removed rather than kept as decoration — the summary line immediately below,
          # printed to the step's own record, carries the same information for whatever this
          # instance's job-list view can show.
          echo "OK: sweep complete. Removed ${REMOVED_IMAGES} image(s), ${REMOVED_HOLDERS} holder(s)."\
               "Kept ${KEPT_IMAGES} image(s), ${KEPT_HOLDERS} holder(s) (see reasons above)."
        # 🔴 Code review H4: `continue-on-error` was the only untested platform assumption load-
        # bearing in this file, and its interaction with `steps.<id>.outcome` had never been
        # measured on this specific runner — this repo's only other use of `continue-on-error` is
        # in the retired GitHub pipeline, and `ci.yml:190-191` explicitly notes it is NOT used on
        # Forgejo. REMOVED rather than measured: `deploy-dev.yml:411` already proves a working,
        # simpler pattern for "run the next step regardless of this one's outcome" on this exact
        # runner — a later step's own `if: always() && steps.<id>.outcome == 'failure'` fires
        # correctly whether or not the failing step used `continue-on-error`, because `always()`
        # itself is what keeps the job moving past a failed step, not the failing step's own flag.
        # Task 5.6's own two halves are both still met: the sweep's real exit code is now VISIBLE
        # (a genuine sweep failure marks this run red, exactly like every other real failure on
        # this runner, rather than being hidden behind an unmeasured override), and the dispatch
        # below still ALWAYS runs regardless (its own `if: always()`), so a sweep failure still
        # cannot block the reset. Read directly from the DB this round, for every real dispatch so
        # far (994/1004/1019/1023/1032): the sweep step's own status was 1 (success) every time and
        # the notice step below correctly evaluated as skipped (status 4) — `outcome`-based
        # conditionals are confirmed working on this runner for the SUCCESS path; the FAILURE path
        # is exercised for the first time on the throwaway branch (DN2).

      - name: Note if the sweep failed (Task 5.6, code review H4 — deploy-dev.yml:411's own shape)
        if: ${{ always() && steps.sweep.outcome == 'failure' }}
        run: |
          set -euo pipefail
          echo "⚠️ SWEEP STEP FAILED — hygiene was skipped this cycle. This is NOT fatal to the"\
               "reset: BOTH the branch reset and the dispatch below carry 'if: always()' and run"\
               "regardless. It means only that stale images/holders were NOT cleaned this time."\
               "See the sweep step's own output above for where it broke."
          # 🔴 Code review Medium, 2026-09-21: this message used to say "the dispatch below still
          # runs unconditionally" and name only the dispatch. That was true of the dispatch and
          # FALSE of the branch reset, which had no `if:` at all and was therefore skipped by the
          # implicit `success()` exactly when this notice was printing that nothing was wrong.
          # Both now carry `always()`; the sentence names both so it cannot drift back.

      # ═══════════════════════════════════════════════════════════════════════════════════════
      # THE DESTRUCTIVE STEP. Everything above this point either reads or removes debris; this
      # step force-updates a branch, which throws commits away. `docs/dev-weekly-reset-plan.md`
      # §4.2 is its specification and the block at the top of this file is its warning label.
      #
      # ── Order of operations, and why this exact order ──────────────────────────────────────
      #   1. read both SHAs and PIN them          — everything after this uses the pinned values,
      #                                             so a push landing on `main` mid-run cannot make
      #                                             the count describe one commit and the reset
      #                                             another
      #   2. count what would be discarded        — `git cherry`, the same measure §2 of the plan
      #                                             took by hand (commits already in `main` in
      #                                             another shape are NOT counted as losses)
      #   3. refuse if over MAX_DISCARDED         — before anything is written, so a refusal costs
      #                                             nothing and changes nothing
      #   4. write the ANNOTATED archive tag      — BEFORE the branch moves. If the job dies here,
      #                                             the state is a harmless extra tag.
      #   5. move `dev` under a LEASE             — against the SHA step 1 pinned, so if `dev`
      #                                             moved after the count the server refuses,
      #                                             rather than the job silently discarding the
      #                                             commits that arrived in between
      #   6. read the branch back                 — an exit code is not evidence on this instance
      #                                             (Story 1.10)
      # The order is what makes a kill at any point safe: a tag can exist without the branch having
      # moved, and the reverse cannot happen.
      #
      # ── Why the record lives in the TAG's message ──────────────────────────────────────────
      # Not in the log, and not in `$GITHUB_STEP_SUMMARY`. Job logs are not retrievable through
      # this instance's API at all (404 on every endpoint, and there is no per-job endpoint
      # either — re-measured 2026-09-21), and no `$GITHUB_STEP_SUMMARY` content has ever been
      # found in this repository's Forgejo data for any past run. An annotated tag's message is
      # the only place a weekly, unattended, destructive job on this instance can write something
      # a human will still be able to read a month later. It costs one ref, it lives outside every
      # branch, it survives the next reset, and writing it needs no permission on `main` — so it
      # does not widen the deploy key's blast radius by one byte.
      #
      # ── Credential: a repository DEPLOY KEY, over SSH ──────────────────────────────────────
      # `DEV_RESET_SSH_KEY` is the private half of the `dev-weekly-reset` deploy key on this
      # repository (plan §3.4 A1). Chosen over a bot account's token because the EXIT PLAN is the
      # deciding property, not convenience: a deploy key is removed by a repository admin in one
      # step, immediately and completely, whereas a user token on this instance is issued
      # permanently, cannot have its scope widened after minting, and cannot be revoked by anyone
      # but its owner — not even by an instance administrator (plan §3.2). Reaching the instance
      # over SSH on port 2222 was not assumed: it was probed on THIS runner label before this step
      # was written (plan §6 phase 2.0 — `git`, `ssh`/`ssh-keyscan` and outbound TCP 2222 all
      # confirmed present/open, 2026-09-21, by three throwaway dispatches whose run status WAS the
      # answer, since no other channel here is machine-readable). The
      # `https://x-access-token:<token>@…` form used by `mirror-github.yml` is deliberately NOT
      # copied here: that remote is GitHub, and the form is GitHub's.
      #
      # 🔴 The host key is PINNED to a literal fingerprint, not trusted on first use. An unattended
      # job that runs `ssh-keyscan` and then trusts whatever came back has no host authentication
      # at all — it would hand the deploy key to whatever answers on port 2222. The literal below
      # is this instance's ED25519 host key as the operator's own workstation already holds it in
      # `known_hosts` (verified by use, not merely by a scan taken at the same moment). If the
      # instance's host key is ever rotated this step goes red saying exactly that; update the
      # literal, deliberately, rather than removing the check.
      - name: "Reset the dev branch to main (plan §4.2 — archive, count, refuse, update)"
        # 🔴 Code review Medium, 2026-09-21. Without this the step carries the IMPLICIT
        # `success()` and is therefore skipped whenever the sweep above it fails — which silently
        # reverses this file's own H4 decision. The failure mode is quiet and compounding: image
        # hygiene breaking on the runner would stop the BRANCH being reset week after week, the
        # unique-commit count would climb past MAX_DISCARDED, and from then on the job would
        # refuse on the ceiling instead — a second wrong reason stacked on the first. The sweep is
        # a chore attached to this job; it was never a gate on it, and the notice step above says
        # so in as many words.
        #
        # `always()` and not `!cancelled()`, deliberately: `always()` is proven live on this
        # runner (this file's own notice and dispatch steps), whereas `cancelled()` appears
        # nowhere in this repository and has never been exercised on this instance. This file does
        # not put an unmeasured platform function in a destructive path — that is the same rule
        # that got `continue-on-error` removed from the sweep.
        # ⚠️ The cost of that choice, named rather than hidden: `always()` also fires while a run
        # is being CANCELLED, so cancelling this job mid-flight can still let the reset execute.
        # The step is safe to interrupt at any point (the ordering note above), and a cancel
        # during the ~10s between the tag and the push is the only window where it matters.
        # Revisit if `cancelled()` is ever measured on this instance.
        if: ${{ always() }}
        id: reset
        env:
          # 🔴 Repository secret, NOT an org secret. `secrets: inherit` hands a callee every secret
          # the repository holds; an org-level private key would therefore reach every callee of
          # every workflow in the org. Plan §3.4 A1.2.
          DEV_RESET_SSH_KEY: ${{ secrets.DEV_RESET_SSH_KEY }}
          SSH_HOST: git.crm-prionex.com
          SSH_PORT: "2222"
          # The same ED25519 fingerprint the operator's workstation already trusts for this host.
          HOST_KEY_FINGERPRINT: "SHA256:QAfK8OXxclqteczzPHnOn6CsMH9r9d0jBPctTE99FD0"
          REPO_PATH: CRM/fe-prionex
          # 🔴 A blast-radius ceiling in the same sense as MAX_CANDIDATES in the sweep above — the
          # question it answers is "how much unwatched destruction is acceptable in one run", not
          # "what is a nice round number". Measured, not assigned: weekly unique-commit volume on
          # the old `dev` was 41–99 in an ordinary week (W23–W38 2026) with peaks to 279, and a
          # month of the schedule silently not running is ≈260. 150 passes every ordinary week and
          # refuses exactly where a large count means the schedule has NOT been working — which is
          # the case where acting quietly at scale is worst.
          MAX_DISCARDED: "150"
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          KEY_VAL="${DEV_RESET_SSH_KEY:-}"
          # `[ -z ]` alone is false for a whitespace-only value, which would write a key file that
          # ssh rejects with a format error and send the reader after the wrong cause — the same
          # shape already fixed on the dispatch step's token check below.
          if [ -z "$(printf '%s' "$KEY_VAL" | tr -d '[:space:]')" ]; then
            echo "FAIL: the DEV_RESET_SSH_KEY repository secret is empty, whitespace-only, or not"\
                 "set on this repository. This is the deploy key the weekly reset writes with"\
                 "(plan §3.4 A1) — without it the branch cannot be touched at all. NOTHING HAS"\
                 "BEEN CHANGED: no tag was written and dev was not moved. Fix: re-create the"\
                 "'dev-weekly-reset' deploy key and store its private half as the repository"\
                 "secret DEV_RESET_SSH_KEY."
            exit 1
          fi

          WORKDIR="$(mktemp -d)" || { echo "FAIL: mktemp -d failed. Nothing has been changed."; exit 1; }
          # Installed BEFORE the key is written, so the key file cannot outlive this step even if
          # the very next command dies — the private half never persists on this shared,
          # multi-tenant runner beyond the step that needs it.
          trap 'rm -rf "$WORKDIR"' EXIT
          KEY_FILE="${WORKDIR}/id_ed25519"
          KNOWN_HOSTS="${WORKDIR}/known_hosts"
          REPO_DIR="${WORKDIR}/repo"

          # umask first: the file must never exist, even for an instant, with a mode ssh refuses.
          umask 077
          printf '%s\n' "$KEY_VAL" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          echo "--- pinning the host key for ${SSH_HOST}:${SSH_PORT} ---"
          # 🔴 Code review Medium, 2026-09-21 — `-t ed25519` is load-bearing, not tidiness.
          # Without it `ssh-keyscan` writes EVERY key type the host offers (rsa, ecdsa, ed25519)
          # into this known_hosts, and the check below only asserts that the pinned ED25519
          # fingerprint appears SOMEWHERE in that list. The whole file is then handed to ssh. So
          # an active MITM on this port could answer the scan with the genuine ED25519 key (it is
          # public) alongside its own RSA key, pass the fingerprint check, then advertise only RSA
          # during negotiation — ssh would find the attacker's RSA key in the very known_hosts the
          # scan had just produced, and the deploy key would be offered to the attacker. The
          # comment below was right that the comparison, not the scan, is the authentication; it
          # was wrong that the comparison was load-bearing for the connection that followed.
          # Scanning one algorithm and negotiating that same one is what makes it load-bearing:
          # the only key ssh can accept is now the only key this check covers. The matching
          # `-o HostKeyAlgorithms=ssh-ed25519` is on GIT_SSH_COMMAND below — the two belong
          # together and neither works alone.
          if ! ssh-keyscan -t ed25519 -T 10 -p "$SSH_PORT" "$SSH_HOST" > "$KNOWN_HOSTS" 2>/dev/null; then
            echo "FAIL: ssh-keyscan could not reach ${SSH_HOST}:${SSH_PORT}. This is a network or"\
                 "instance problem, not a credential one. Nothing has been changed."
            exit 1
          fi
          # 🔴 The scan is NOT the authentication — this comparison is. A scan alone is
          # trust-on-first-use performed fresh on every run, which for an unattended job means no
          # host authentication whatsoever.
          # 🔴 Code review Low, 2026-09-21: `|| true` and the emptiness test below are not
          # belt-and-braces. `ssh-keyscan` exits 0 having written NOTHING when the host answers
          # but offers no key of the requested type — and then, under `set -euo pipefail`, a bare
          # `SCANNED_FPS="$(ssh-keygen -lf … | awk …)"` dies at the assignment with no output at
          # all (reproduced: exit 255, silent). The step would go red on a host-key rotation with
          # nothing said, and the "update the pinned literal deliberately" guidance below — the
          # entire reason that message exists — would never print.
          if [ ! -s "$KNOWN_HOSTS" ]; then
            echo "FAIL: ${SSH_HOST}:${SSH_PORT} answered but offered no ED25519 host key, so there"\
                 "is nothing to compare against the pinned fingerprint. If the instance's host key"\
                 "was rotated to another type deliberately, update the pinned literal AND the"\
                 "`-t`/`HostKeyAlgorithms` pair in this step together. Nothing has been changed."
            exit 1
          fi
          SCANNED_FPS="$(ssh-keygen -lf "$KNOWN_HOSTS" 2>/dev/null | awk '{print $2}' || true)"
          # With `-t ed25519` above, this file holds exactly one key, so "appears among the
          # scanned fingerprints" and "is the key ssh will use" are now the same statement.
          if ! printf '%s\n' "$SCANNED_FPS" | grep -qxF "$HOST_KEY_FINGERPRINT"; then
            echo "FAIL: the ED25519 host key offered by ${SSH_HOST}:${SSH_PORT} does not match the"\
                 "pinned fingerprint. Refusing to offer the deploy key to a host this step cannot"\
                 "identify. Nothing has been changed."
            echo "  pinned:  ${HOST_KEY_FINGERPRINT}"
            echo "  offered: ${SCANNED_FPS}"
            echo "  If the instance's SSH host key was rotated deliberately, update the pinned"\
                 "literal in this step — do not delete the check."
            exit 1
          fi
          echo "OK: host key matches the pinned fingerprint."

          # BatchMode=yes so nothing can ever block on a prompt in an unattended job;
          # IdentitiesOnly/IdentityAgent so a stray agent key on this shared runner can never be
          # offered in place of the one this job is supposed to act as.
          # 🔴 `HostKeyAlgorithms=ssh-ed25519` is the other half of the pin above (code review
          # Medium, 2026-09-21): it forbids ssh from negotiating any host key type other than the
          # one that was scanned and fingerprint-checked. Without it the check can be satisfied by
          # one key while the connection is secured by another.
          export GIT_SSH_COMMAND="ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o IdentityAgent=none -o UserKnownHostsFile=${KNOWN_HOSTS} -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o BatchMode=yes -p ${SSH_PORT}"
          REMOTE_URL="ssh://git@${SSH_HOST}:${SSH_PORT}/${REPO_PATH}.git"

          echo "--- cloning (history only, no working tree) ---"
          if ! git clone --quiet --no-checkout "$REMOTE_URL" "$REPO_DIR" 2>&1; then
            echo "FAIL: could not clone ${REMOTE_URL} with the deploy key. Either the key is not"\
                 "installed on this repository, or it was removed — which is the documented exit"\
                 "plan (§3.4 A1.4), so this is what a deliberate shutdown looks like from here."\
                 "Nothing has been changed."
            exit 1
          fi
          cd "$REPO_DIR"

          # ── 1. PIN both SHAs. Everything after this uses these values and never re-reads. ───
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          DEV_SHA="$(git rev-parse refs/remotes/origin/dev)"
          for SHA_CHECK in "$MAIN_SHA" "$DEV_SHA"; do
            if ! printf '%s' "$SHA_CHECK" | grep -q '^[0-9a-f]\{40\}$'; then
              echo "FAIL: '${SHA_CHECK}' is not a 40-hex commit id. Refusing to act on a ref this"\
                   "step could not resolve. Nothing has been changed."
              exit 1
            fi
          done
          echo "pinned main = ${MAIN_SHA}"
          echo "pinned dev  = ${DEV_SHA}"
          # 🔴 Code review Medium, 2026-09-21: `main_sha` is deliberately NOT written here.
          # A value already appended to $GITHUB_OUTPUT survives the step exiting non-zero, so
          # emitting it at this point made it a valid 40-hex string on EVERY later failure —
          # the ceiling refusal, a failed tag write, a read-back mismatch, a rejected lease. The
          # dispatch step below then took its "pinned" branch and announced a deploy of a commit
          # this run never put on `dev`, while the report step two steps earlier said the reset
          # had failed: the run's own record contradicting itself, on an instance where that
          # record is the only thing anybody can read. `main_sha` is now written at exactly the
          # two points where it is TRUE that `dev` carries it — the confirmed no-op below, and
          # after the post-push read-back succeeds.
          echo "old_dev_sha=${DEV_SHA}" >> "$GITHUB_OUTPUT"

          if [ "$MAIN_SHA" = "$DEV_SHA" ]; then
            # Not a no-op by accident — this is the steady state the schedule exists to produce,
            # and it is reached whenever nobody pushed to `dev` all week, and on every re-run of a
            # successful reset. No tag is written for a reset that discards nothing: an archive of
            # zero commits is noise in a record whose whole value is that every entry means
            # something happened.
            echo "OK: dev already equals main (${MAIN_SHA}) — nothing to archive, nothing to"\
                 "discard, no branch write. The deploy below still runs, so the stand is brought"\
                 "to this commit regardless."
            echo "discarded=0" >> "$GITHUB_OUTPUT"
            echo "reset_performed=false" >> "$GITHUB_OUTPUT"
            # True here and only here on the early-exit path: dev demonstrably carries this
            # commit, because it equals it. The dispatch below may pin it.
            echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── 2. COUNT what would be lost. ────────────────────────────────────────────────────
          # `git cherry <upstream> <head>` marks '-' for commits that already have an equivalent
          # in upstream and '+' for those that do not. Only the '+' lines are real losses — the
          # 2026-09-21 manual run measured 65 of those against 9 that were already in `main` in
          # another shape, and counting those 9 as losses would inflate every future report and
          # push the ceiling towards firing on a week that lost nothing.
          CHERRY_OUT="$(git cherry "refs/remotes/origin/main" "refs/remotes/origin/dev" 2>&1)" || {
            echo "FAIL: 'git cherry' itself failed — this is the count the refusal ceiling is"\
                 "based on, so there is no safe way to continue without it. Its own output:"
            printf '%s\n' "$CHERRY_OUT"
            echo "Nothing has been changed."
            exit 1
          }
          DISCARDED="$(printf '%s\n' "$CHERRY_OUT" | grep -c '^+' || true)"
          EQUIVALENT="$(printf '%s\n' "$CHERRY_OUT" | grep -c '^-' || true)"
          BEHIND="$(git rev-list --count "refs/remotes/origin/dev..refs/remotes/origin/main")"
          echo "dev carries ${DISCARDED} commit(s) with no equivalent in main (${EQUIVALENT} more"\
               "are already in main in another shape); main carries ${BEHIND} commit(s) dev lacks."
          echo "discarded=${DISCARDED}" >> "$GITHUB_OUTPUT"

          # ── 3. REFUSE if over the ceiling — before anything is written. ─────────────────────
          if [ "$DISCARDED" -gt "$MAX_DISCARDED" ]; then
            echo "FAIL: this reset would discard ${DISCARDED} commit(s), over the"\
                 "${MAX_DISCARDED}-commit ceiling. REFUSING AND REPORTING rather than acting"\
                 "quietly at this scale. NOTHING HAS BEEN CHANGED: no archive tag was written and"\
                 "dev was not moved."
            echo "  A count this high does not mean the week was busy — an ordinary week on this"\
                 "branch produced 41–99. It means this schedule has probably not been running,"\
                 "and a month of not running is about 260. Find out why before resetting; the"\
                 "ceiling is a decision about acceptable unwatched destruction, not a knob."
            echo "  To reset deliberately after looking: do it by hand, the way"\
                 "docs/dev-weekly-reset-plan.md §2 records, where a human sees what goes."
            exit 1
          fi

          # ── 4. ARCHIVE TAG, annotated, on the server BEFORE the branch moves. ──────────────
          TAG_DATE="$(date -u +%Y-%m-%d)"
          TAG_NAME="archive/dev-${TAG_DATE}"
          # Collision: a second run on the same UTC day. If the existing tag already points at the
          # dev commit this run is about to discard, the archive it would write already exists and
          # re-writing it is a no-op worth skipping. If it points somewhere else, that is a
          # DIFFERENT archive and overwriting it would destroy the only record of the earlier
          # reset — so this run takes a distinct name and says so, instead of overwriting the tag.
          EXISTING_PEELED="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}^{}" 2>/dev/null | awk '{print $1}' | head -n1)"
          EXISTING_ANY="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}" 2>/dev/null | awk '{print $1}' | head -n1)"
          SKIP_TAG_WRITE=0
          # 🔴 Code review Medium, 2026-09-21. The "no tag for a reset that discards nothing"
          # rule stated above only covered `dev == main`, which is the RARE case. The common
          # quiet week is `dev` strictly BEHIND `main`: everything that was on `dev` got merged,
          # nobody pushed since, so DISCARDED is 0 while the two SHAs still differ. That wrote a
          # permanent annotated tag every such week whose own message read "discarded commits: 0"
          # and "The 0 discarded commit(s) are reachable from this tag and from nowhere else" —
          # the second half flatly false, since they are on `main`. One ref per quiet week, in a
          # namespace whose entire value is that an entry means something happened. The branch
          # still moves and is still read back; not archiving an ancestor loses nothing.
          if [ "$DISCARDED" -eq 0 ]; then
            echo "NOTE: nothing is being discarded (dev is behind main, not diverged) — no"\
                 "archive tag is written. The branch move below is unaffected."
            SKIP_TAG_WRITE=1
            TAG_NAME=""
          elif [ -n "$EXISTING_ANY" ]; then
            if [ "$EXISTING_PEELED" = "$DEV_SHA" ]; then
              echo "NOTE: ${TAG_NAME} already exists and already points at ${DEV_SHA} — this run"\
                   "is redoing an archive that is already on the server. Keeping it as it is."
              SKIP_TAG_WRITE=1
            else
              TAG_NAME="archive/dev-${TAG_DATE}-run${RUN_NUMBER}"
              echo "NOTE: archive/dev-${TAG_DATE} already exists and points at a DIFFERENT commit"\
                   "(${EXISTING_PEELED:-unpeelable}). Not overwriting an earlier archive — this"\
                   "run writes ${TAG_NAME} instead."
            fi
          fi
          echo "archive_tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          if [ "$SKIP_TAG_WRITE" -eq 0 ]; then
            # 🔴 ANNOTATED (-a with -F), not lightweight. A lightweight tag carries no message, and
            # the message is the entire point: it is this run's permanent, readable record on an
            # instance where the log is not retrievable. `git tag -a` needs an identity, supplied
            # per-command so nothing is written into a config that outlives this step.
            #
            # 🔴 The heredoc body below is written FLUSH LEFT in this file, deliberately, and
            # that is not a formatting slip. A `run: |` block scalar is de-indented by YAML before
            # the shell ever sees it, so these lines arrive at column 0 — which is exactly what
            # the terminator needs and exactly how the message should read in `git show`. The
            # obvious-looking alternatives are both worse: `<<-TAGMSG` strips TABS only and this
            # file is space-indented throughout, and an indented body "fixed up" afterwards with
            # `sed -i` adds a portability dependency (BSD `sed -i` requires an argument; BusyBox's
            # does not) in exchange for nothing at all.
            TAG_MESSAGE_FILE="${WORKDIR}/tagmsg"
            cat > "$TAG_MESSAGE_FILE" <<TAGMSG
          Weekly DEV reset — dev archived before being brought to main.

          discarded commits : ${DISCARDED} (no equivalent in main)
          also dropped      : ${EQUIVALENT} already present in main in another shape
          main was ahead by : ${BEHIND} commit(s)
          old dev           : ${DEV_SHA}
          new dev           : ${MAIN_SHA}
          forgejo run id    : ${RUN_ID} (run number ${RUN_NUMBER})
          archived at       : $(date -u +%Y-%m-%dT%H:%M:%SZ)

          The ${DISCARDED} discarded commit(s) are reachable from this tag and from nowhere else.
          To recover them: git fetch origin ${TAG_NAME} && git switch -c recovered ${TAG_NAME}
          Procedure and rationale: docs/dev-weekly-reset-plan.md
          TAGMSG

            git -c user.name="Weekly DEV Reset" -c user.email="dev-weekly-reset@crm-prionex.com" \
                tag -a "$TAG_NAME" "$DEV_SHA" -F "$TAG_MESSAGE_FILE"

            if ! git push origin "refs/tags/${TAG_NAME}" 2>&1; then
              echo "FAIL: could not write the archive tag ${TAG_NAME} to the server. REFUSING TO"\
                   "TOUCH THE BRANCH — the archive is what makes this operation reversible, and a"\
                   "reset without it would discard ${DISCARDED} commit(s) with no way back. dev is"\
                   "UNCHANGED."
              exit 1
            fi
            # An exit code is not evidence on this instance (Story 1.10) — read it back.
            WRITTEN_PEELED="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}^{}" 2>/dev/null | awk '{print $1}' | head -n1)"
            if [ "$WRITTEN_PEELED" != "$DEV_SHA" ]; then
              echo "FAIL: wrote ${TAG_NAME}, but reading it back from the server peels to"\
                   "'${WRITTEN_PEELED:-nothing}', not the archived '${DEV_SHA}'. The archive is"\
                   "not confirmed, so the reset does not happen. dev is UNCHANGED."
              exit 1
            fi
            echo "OK: ${TAG_NAME} -> ${DEV_SHA} (annotated, verified by read-back)."
          fi

          # ── 5. MOVE dev, under a lease against the SHA the count was taken on. ─────────────
          # 🔴 `--force-with-lease=<ref>:<expected>` with an EXPLICIT expected value, never the
          # bare form. The bare form leases against this clone's own remote-tracking ref, which
          # this very job fetched seconds ago and which therefore always matches — it would look
          # like a safety check and be none. With the pinned SHA, a commit that landed on `dev`
          # between the count and this moment makes the server refuse, and this run goes red with
          # nothing lost, which is the correct outcome: the count this reset was authorised by no
          # longer describes what is there.
          echo "--- moving refs/heads/dev: ${DEV_SHA} -> ${MAIN_SHA} ---"
          if ! git push origin "${MAIN_SHA}:refs/heads/dev" --force-with-lease="refs/heads/dev:${DEV_SHA}" 2>&1; then
            echo "FAIL: the server refused to move dev. The two causes worth separating:"
            echo "  (a) the LEASE failed — something landed on dev after this run counted"\
                 "(${DEV_SHA}); nothing was lost, and the next run will count again and archive"\
                 "again. This is the guard doing its job."
            echo "  (b) the deploy key cannot write dev — the branch protection rule is not"\
                 "admitting deploy keys (push_whitelist_deploy_keys), or the key was removed (the"\
                 "documented exit plan, §3.4 A1.4)."
            echo "  Archive: ${TAG_NAME:-none written — this run discarded nothing}. If a tag"\
                 "was written it is on the server either way, and is harmless."
            exit 1
          fi
          NEW_DEV="$(git ls-remote origin refs/heads/dev 2>/dev/null | awk '{print $1}' | head -n1)"
          if [ "$NEW_DEV" != "$MAIN_SHA" ]; then
            echo "FAIL: the push was accepted, but dev reads back as '${NEW_DEV:-nothing}', not"\
                 "'${MAIN_SHA}'. Refusing to report a reset the server does not show."\
                 "Archive: ${TAG_NAME:-none written — this run discarded nothing}. Nothing is lost."
            exit 1
          fi

          # Written only now, after the server itself has shown that dev carries this commit.
          echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
          echo "reset_performed=true" >> "$GITHUB_OUTPUT"
          if [ "$DISCARDED" -eq 0 ]; then
            echo "OK: dev == main == ${MAIN_SHA} (verified by read-back). Nothing was discarded —"\
                 "dev was behind main, not diverged — so no archive tag was written."
          else
            echo "OK: dev == main == ${MAIN_SHA} (verified by read-back). ${DISCARDED} commit(s)"\
                 "discarded, archived at ${TAG_NAME}."
          fi

      - name: "Report what this reset discarded (plan §4.2.3 — silence is not success)"
        if: ${{ always() }}
        env:
          RESET_OUTCOME: ${{ steps.reset.outcome }}
          DISCARDED: ${{ steps.reset.outputs.discarded }}
          ARCHIVE_TAG: ${{ steps.reset.outputs.archive_tag }}
          OLD_DEV: ${{ steps.reset.outputs.old_dev_sha }}
          NEW_DEV: ${{ steps.reset.outputs.main_sha }}
          PERFORMED: ${{ steps.reset.outputs.reset_performed }}
        run: |
          set -euo pipefail
          # 🔴 This step cannot fail the run, deliberately: it reports, it does not judge. Its
          # value is that the run's own record names what was destroyed, in one place, instead of
          # leaving it to be reconstructed from the step above. The DURABLE copy is the annotated
          # tag's message — this is the convenience copy.
          #
          # Plan §4.2.3: until Story 4.5 restores failure notifications, the compensating control
          # for this whole job is a human reading it on Monday. The tag makes that cheap — it is
          # enough to check that a tag for the right date exists and to read its message.
          # **Removal trigger: when Story 4.5 lands, its failure notification closes this gap and
          # the Monday read stands down.**
          echo "=== weekly DEV reset — what happened to the BRANCH ==="
          case "${RESET_OUTCOME:-}" in
            success)
              if [ "${PERFORMED:-}" = "true" ]; then
                echo "dev was reset:     ${OLD_DEV} -> ${NEW_DEV}"
                echo "commits discarded: ${DISCARDED:-unknown}"
                echo "recoverable from:  ${ARCHIVE_TAG:-<no tag recorded>}"
              else
                echo "dev already equalled main (${NEW_DEV:-unknown}) — nothing discarded, no tag written."
              fi
              ;;
            *)
              echo "the branch reset did NOT succeed (outcome: ${RESET_OUTCOME:-unknown})."
              echo "Read the reset step's own output above for which of its guards refused —"
              echo "every one of them states whether anything was changed before it stopped."
              ;;
          esac

      - name: Dispatch deploy-dev.yml with the commit this run pinned (Task 4, AC3, AC6)
        if: always()
        # Code review H4/Task 5.6: unconditional — this step must run whether the sweep above
        # succeeded, failed, or was itself skipped for any reason. The reset's whole purpose is the
        # deploy; hygiene is the chore attached to it, never a gate on it.
        id: dispatch
        env:
          FJ_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPO_SLUG: ${{ github.repository }}
          # The commit the reset step pinned and put on `dev`. Empty when that step refused,
          # failed, or was skipped — this step runs `if: always()`, so it must cope with that, and
          # the body below says how and why.
          PINNED_SHA: ${{ steps.reset.outputs.main_sha }}
        run: |
          set -euo pipefail
          # PR A's own probe-window disarm mechanism (Task 6.2) lived here while the temporary
          # frequent cron was armed on `main`; it is REMOVED (PR B, Task 6.5), not merely toggled —
          # scoped as probe-window scaffolding, not a permanent regression hook in the
          # `simulate_bad_credential`/`hold_lock_seconds` shape. Task 2.8, settled live (runs
          # 1004→1005): the automatic job token CAN call this endpoint — no fallback needed.

          # Code review M7: `[ -z ]` alone is false for a whitespace-only value, which would build
          # a header of `Authorization: token <spaces>`, get a real 401, and be misdiagnosed as a
          # scope problem rather than an empty/corrupt token — `deploy-dev.yml:492-493`'s own fix
          # for this exact shape (code review L8 there), carried here.
          FJ_TOKEN_VAL="${FJ_TOKEN:-}"
          if [ -z "$(printf '%s' "$FJ_TOKEN_VAL" | tr -d '[:space:]')" ]; then
            echo "FAIL: github.token is empty or whitespace-only. This is Forgejo's own automatic"\
                 "per-job token — this value here is a runner/instance-level problem, not"\
                 "something this workflow controls. The stand has not been touched."
            exit 1
          fi

          # 🔴 DN1(b)'s own read-back (the next step) needs a pre-dispatch baseline to compare
          # against — code review round 4 (composition dispatch run 1094): after `.title`
          # (round 2) and RFC3339 offsets (round 3) were both fixed and BOTH confirmed correct live
          # in the exact failing response, a `jq`-based whole-document parse-then-select still
          # failed a FOURTH time, on a response this repository's own history has made genuinely
          # large (~90 runs match `event=workflow_dispatch` alone, each carrying a full nested
          # `repository`/`owner` object) — reproducible complexity a toy-scale fixture could not
          # replicate, but real enough to fail live, four times, each a NEW cause. Per the standing
          # instruction after that fourth failure: stop patching this exact mechanism, simplify
          # radically instead. `jq` is removed from the read-back path entirely — no whole-document
          # parse of any kind, so there is nothing conditional on response size or shape left to
          # break. In its place: a plain `grep` for the literal, structurally stable
          # `"id":NNN,"title":"Deploy DEV Stand"` byte adjacency (observed identically, byte for
          # byte, across every one of this story's own live responses, both here and inside
          # `deploy-dev.yml`'s own JSON handling elsewhere) compared against a run id banked HERE,
          # before the dispatch, as a monotonic floor — `action_run.id` is a single, globally
          # increasing sequence for this whole Forgejo instance (confirmed by direct query
          # throughout this story), so "an id greater than whatever was the newest run a moment
          # ago" is a complete, sufficient proof that something NEW showed up, with no date parsing
          # and no field-name assumption of any kind left in the comparison.
          PRE_DISPATCH_MAX_ID="$(printf 'header = "Authorization: token %s"\n' "$FJ_TOKEN_VAL" \
            | curl -sS --config - --retry 2 --retry-delay 2 --retry-connrefused --max-time 10 \
                "${SERVER_URL}/api/v1/repos/${REPO_SLUG}/actions/runs?limit=1" 2>/dev/null \
            | grep -oE '"id":[0-9]+' | head -n1 | grep -oE '[0-9]+' || true)"
          if [ -z "$PRE_DISPATCH_MAX_ID" ]; then
            echo "FAIL: could not bank a pre-dispatch baseline run id (the banking GET itself"\
                 "failed, or its response carried no recognisable \"id\" field at all) — refusing"\
                 "to guess a floor for the read-back step that follows. The stand has not been"\
                 "touched; this dispatch has not even been attempted yet."
            exit 1
          fi
          echo "pre_dispatch_max_id=${PRE_DISPATCH_MAX_ID}" >> "$GITHUB_OUTPUT"

          # Task 4.2: credential never on argv. curl's --config (stdin) form, the same pattern
          # `deploy-dev.yml` already uses for the registry credential and the OpenBao token in
          # `build.yml` — never `-H "Authorization: ..."` on the command line, which would put the
          # token in this job's own `ps auxww` on this shared, multi-tenant runner.
          HEADERS_FILE="$(mktemp)" || { echo "FAIL: mktemp failed for the response headers file. The stand has not been touched."; exit 1; }
          BODY_FILE="$(mktemp)" || { echo "FAIL: mktemp failed for the response body file. The stand has not been touched."; rm -f "$HEADERS_FILE"; exit 1; }
          # Code review L3: guard EACH mktemp individually, before the trap is installed — under
          # `set -e` a bare `HEADERS_FILE="$(mktemp)"` with no `||` dies at the assignment with no
          # message at all if mktemp fails, and if the SECOND one then fails, the first file leaks
          # because the trap that would clean it up is not registered yet.
          trap 'rm -f "$HEADERS_FILE" "$BODY_FILE"' EXIT

          DISPATCH_URL="${SERVER_URL}/api/v1/repos/${REPO_SLUG}/actions/workflows/deploy-dev.yml/dispatches"
          # Task 4.1: outer "ref" (in the JSON body) is the branch dev-reset.yml itself reads its
          # own workflow list from (main, always, since this file only ever lives there once
          # merged); the "inputs.ref" is deploy-dev.yml's own REQUIRED input — its own fail-closed
          # guard rejects an empty one, so this can never silently deploy nothing. That guard is
          # also why the fallback below names a ref rather than sending an empty one: an empty
          # inputs.ref returns HTTP 400 and consumes no run row, which would be reported here as
          # a dispatch failure nobody could explain.
          #
          # 🔴 2026-09-21 (plan §6 phase 3.4). The OUTER "ref" is unchanged and stays the literal
          # `main` — that is the branch Forgejo reads the deploy-dev.yml FILE from, and this file
          # only ever lives on main once merged. What changed is the INNER `inputs.ref`: the exact
          # commit this run pinned and just put on `dev`, instead of the literal `main`.
          #
          # Why the SHA and not the branch name, when they are equal by construction the moment
          # this line runs: they are equal AT THIS INSTANT, and the deploy resolves its ref later,
          # in its own run, which cannot start until this job leaves the shared concurrency group.
          # A merge to `main` inside that window would make `ref=main` deploy a commit this run
          # never reset to, never counted, and never archived against. The SHA closes that window,
          # and it is what the 2026-09-21 manual procedure used for the same reason.
          #
          # It also lands on a better tag: `deploy-stand.yml` maps a bare 40-hex ref straight to
          # `sha-<12>-dev`, the per-commit tag build-main.yml published, rather than through the
          # generic sanitizer to the mutable `main-dev`.
          #
          # ⚠️ Expected, and not a defect: from the moment the reset step moves `dev`, a WEEKLY RUN
          # PRODUCES TWO DEPLOYS. The branch push triggers `dev-branch-autodeploy.yml`, and this
          # step then dispatches `deploy-dev.yml` as it always has. Both carry the shared
          # concurrency group `deploy-dev-fe-prionex-dev`, which this job is holding, so neither
          # can start until this job exits — they queue, then run one after the other, and both
          # put the SAME image on the stand (autodeploy reuses the published one rather than
          # rebuilding it, which is what phase 1 of the plan is for). The cost is one redundant
          # pull→up -d; the benefit is that neither path depends on the other existing. The
          # dispatch is deliberately NOT dropped in favour of the push trigger: this file's own
          # read-back is the only confirmation any of this happened, and it can only confirm a run
          # it asked for.
          # 🚨 And this job still must not WAIT for either of them — it holds the group they need.
          # See the self-deadlock warning in this file's header.
          DEPLOY_REF="${PINNED_SHA:-}"
          if printf '%s' "$DEPLOY_REF" | grep -q '^[0-9a-f]\{40\}$'; then
            echo "Deploy target: the pinned commit ${DEPLOY_REF}."
          else
            # The reset step refused or failed, so there is no pinned SHA. Falling back to the
            # literal `main` is NOT a workaround — it is exactly what this file did before the
            # branch half existed, so the stand still gets main's image and the reset's own
            # failure is reported by its own red step rather than by also skipping the deploy.
            # The branch and the stand are independently useful; one failing does not make the
            # other worthless.
            DEPLOY_REF="main"
            echo "NOTE: no pinned SHA available from the reset step (it refused, failed, or was"\
                 "skipped) — falling back to ref=main, which is what this file dispatched before"\
                 "the branch reset existed. The stand will be brought to main; the BRANCH may not"\
                 "have been reset. See the reset step's own output for which."
          fi
          # Only ever a validated 40-hex string or the literal `main` reaches this interpolation.
          REQUEST_BODY="{\"ref\":\"main\",\"inputs\":{\"ref\":\"${DEPLOY_REF}\"}}"

          # Code review M3: `--retry`/`--max-time`, the same shape `deploy-dev.yml:711-714`/`:897-
          # 900` already carry, with the same reason written beside them there — a transient
          # 429/503 from the Forgejo front end must not fail identically to a permanent
          # misconfiguration, and a hung connection must not burn this job's full 5-minute budget
          # while holding the shared concurrency group. `-L` follows a redirect instead of the
          # dispatch route's own 3xx falling through to the unclassified `*)` arm unexamined.
          # Code review H1 idiom (Task 3.7): `|| true` so a transport-level failure becomes DATA
          # the `case` below classifies, not a step-aborting failure with no message.
          DISPATCH_START_EPOCH="$(date -u +%s)"
          HTTP_CODE="$(printf 'header = "Authorization: token %s"\n' "$FJ_TOKEN_VAL" \
            | curl -sS -X POST --config - -L --retry 2 --retry-delay 2 --retry-connrefused --max-time 20 \
                -H "Content-Type: application/json" \
                -D "$HEADERS_FILE" -o "$BODY_FILE" -w '%{http_code}' \
                -d "$REQUEST_BODY" \
                "$DISPATCH_URL" || true)"
          echo "POST .../workflows/deploy-dev.yml/dispatches -> HTTP ${HTTP_CODE}"

          # Task 4.3: classify like deploy-dev.yml classifies the registry's response — a real
          # cause, not a generic failure.
          case "$HTTP_CODE" in
            2??)
              # A successful dispatch's own response body is empty on this route (v15.0.5,
              # measured against the endpoint's own live use, Story 1.8) — no run id to extract
              # from the body itself. Recorded honestly rather than invented.
              echo "OK: dispatch accepted (HTTP ${HTTP_CODE}). This means the deploy was"\
                   "successfully REQUESTED — it does NOT mean the deploy itself succeeded"\
                   "(AC6, narrowed — code review DN1). deploy-dev.yml's own run reports its own"\
                   "result; AC5 reads the stand's digest, not this run's status."
              echo "dispatch_start_epoch=${DISPATCH_START_EPOCH}" >> "$GITHUB_OUTPUT"
              ;;
            401|403)
              # Code review L1: the previous message opened with an editing artifact ("registry —
              # no, WRONG TARGET —") that also collided with deploy-dev.yml's own genuine
              # "FAIL: registry" prefix, and called a token failure "Task 2.8's own anticipated
              # finding" — an expectation run 1004 later FALSIFIED (the token works). Rewritten
              # clean, and without a prediction this file's own history has already disproved.
              echo "FAIL: the DISPATCH ENDPOINT returned ${HTTP_CODE}. This means the TOKEN cannot"\
                   "dispatch (github.token lacks write:repository scope and/or write permission on"\
                   "this repo's Actions unit) — NOT that the image is missing and NOT that"\
                   "deploy-dev.yml itself failed. The stand has not been touched. Fix: see Dev"\
                   "Notes §3's fallback order (a repo/org Actions-write token, or re-opening the"\
                   "workflow_call design) — this is Oleg's decision, not a silent workaround."
              cat "$BODY_FILE" 2>/dev/null || true
              exit 1
              ;;
            3??)
              # Code review L4: 3xx used to be unclassified and fall to the generic `*)` arm even
              # though `-L` (added this round) already follows it — a redirect this curl invocation
              # itself resolved should not additionally masquerade as "unclassified". Named
              # separately so a 3xx that -L did NOT resolve (e.g. curl gave up after too many hops)
              # is still visible as its own cause, with the response's own headers printed — the
              # `Location`/`Retry-After` this capture was for and never read before this round.
              echo "FAIL: HTTP ${HTTP_CODE} dispatching deploy-dev.yml, after following redirects"\
                   "(-L). The final response is still a redirect this client did not resolve. The"\
                   "stand has not been touched. Captured response headers (may carry Location/"\
                   "Retry-After):"
              cat "$HEADERS_FILE" 2>/dev/null || true
              cat "$BODY_FILE" 2>/dev/null || true
              exit 1
              ;;
            404)
              echo "FAIL: HTTP 404 dispatching deploy-dev.yml. This means the WORKFLOW FILE or"\
                   "the ENDPOINT itself is not where this step expects — the path parameter is"\
                   "the workflow FILE NAME (Forgejo v13.0.0+), not a numeric id. Check that"\
                   "deploy-dev.yml still exists at this exact path on main, and that this"\
                   "instance's API shape has not changed. The stand has not been touched."
              cat "$BODY_FILE" 2>/dev/null || true
              exit 1
              ;;
            400)
              echo "FAIL: HTTP 400 — the dispatch INPUTS were rejected by the API itself (e.g. an"\
                   "empty ref returns 400 'ref is empty', routers/api/v1/repo/action.go:822)."\
                   "This request always sends a non-empty ref; a 400 here means the request body"\
                   "shape itself no longer matches what this instance expects. The stand has not"\
                   "been touched."
              cat "$BODY_FILE" 2>/dev/null || true
              exit 1
              ;;
            000)
              echo "FAIL: transport-level failure dispatching deploy-dev.yml — not an HTTP"\
                   "response at all (DNS, TLS, connection refused, or timeout, even after"\
                   "--retry). The stand has not been touched."
              exit 1
              ;;
            *)
              echo "FAIL: unexpected HTTP ${HTTP_CODE} dispatching deploy-dev.yml. Raw status"\
                   "only — not classified as a known cause. The stand has not been touched."\
                   "Captured response headers:"
              cat "$HEADERS_FILE" 2>/dev/null || true
              cat "$BODY_FILE" 2>/dev/null || true
              exit 1
              ;;
          esac

      - name: "Confirm a deploy-dev.yml run was actually created (AC6/DN1(b), code review M2 — non-blocking, does not wait for that run's own outcome)"
        if: steps.dispatch.outcome == 'success'
        env:
          FJ_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPO_SLUG: ${{ github.repository }}
          PRE_DISPATCH_MAX_ID: ${{ steps.dispatch.outputs.pre_dispatch_max_id }}
        run: |
          set -euo pipefail
          # AC6, narrowed by Oleg's decision (DN1(a)): this file's own status reports the DISPATCH
          # LAYER only. A `2xx` from the endpoint (previous step) is necessary but not sufficient —
          # M2's own finding is that a `2xx` from a proxy, or against a since-disabled workflow, or
          # an API shape drift, would all still read as accepted here with nothing downstream ever
          # existing. This ONE read GET call closes that gap without polling the spawned run to
          # completion (no wait on the concurrency group, cannot self-deadlock, per this file's
          # own header).
          #
          # 🔴 This mechanism's history, in full, because every one of the first four attempts
          # taught something the fifth needed: **(1)** the field is `.title`, not `.name`
          # (composition run 1080). **(2)** Forgejo's `created_at` is RFC3339 and this runner's
          # BusyBox `date -d` cannot parse an offset at all (also run 1080, a latent bug closed
          # before its own first trigger). **(3)** an unfiltered, unretried single GET is fragile —
          # added `event=workflow_dispatch` and a 5-attempt/10s retry loop (run 1089). **(4)** even
          # with all three fixes live and independently CONFIRMED correct against the exact failing
          # response (the target run's own `"id":NNN,"title":"Deploy DEV Stand"` was hex-dumped,
          # byte-for-byte correct, and a SEPARATE, simpler `jq` call parsed the SAME response file
          # and printed it cleanly), a `jq`-based whole-document parse-then-`select()` STILL failed
          # a fourth time (run 1094), on a response this repository's own history has made
          # genuinely large — `event=workflow_dispatch` alone matches ~90 runs going back to this
          # story's own earliest probes, each carrying a full nested `repository`/`owner` object —
          # complexity a toy-scale reproduction could not replicate but real enough to fail live,
          # four times, each a NEW and different cause. **Per the standing instruction after that
          # fourth failure: stop patching this exact mechanism, simplify radically instead.**
          #
          # `jq` is removed from this step ENTIRELY — no whole-document JSON parse of any kind, so
          # there is nothing conditional on response size, nesting depth or field shape left to
          # break. In its place: a plain `grep` for the literal, structurally stable
          # `"id":NNN,"title":"Deploy DEV Stand"` byte adjacency — observed identically, byte for
          # byte, across every one of this story's own live responses so far — compared against
          # `PRE_DISPATCH_MAX_ID`, banked by the dispatch step just before the dispatch. Since
          # `action_run.id` is a single, globally increasing sequence for this whole Forgejo
          # instance (confirmed by direct query throughout this story), "an id greater than
          # whatever was newest a moment ago" is complete, sufficient proof that something NEW
          # showed up — no `created_at` field, no date parsing, no timezone offset, no name/title
          # ambiguity, and nothing to break if grep never finds a single required field: grep
          # either finds the pattern or it doesn't, and cannot itself fail on malformed input the
          # way a parser can. The 5-attempt/10s retry loop (3) is kept — it was never the problem,
          # it correctly ran all 5 attempts on run 1094 too — as cheap insurance regardless of root
          # cause. Every failed attempt still dumps compact diagnostics (raw grep matches, not a
          # jq-rendered list, and never the full body).
          if [ -z "${PRE_DISPATCH_MAX_ID:-}" ]; then
            echo "FAIL: no pre-dispatch baseline run id was passed from the dispatch step —"\
                 "cannot tell a NEW run from an old one without it. The dispatch above DID"\
                 "succeed; only this confirmation step could not run."
            exit 1
          fi
          FJ_TOKEN_VAL="${FJ_TOKEN:-}"
          RUNS_URL="${SERVER_URL}/api/v1/repos/${REPO_SLUG}/actions/runs?limit=5&event=workflow_dispatch"
          MAX_ATTEMPTS=5
          RETRY_DELAY_SECONDS=10
          FOUND_NEW_RUN_ID=""
          ATTEMPT=1
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            RUNS_BODY_FILE="$(mktemp)" || { echo "FAIL: mktemp failed for the read-back response (attempt ${ATTEMPT}/${MAX_ATTEMPTS}). Dispatch itself already succeeded above; only this confirmation step could not run."; exit 1; }
            RUNS_HTTP_CODE="$(printf 'header = "Authorization: token %s"\n' "$FJ_TOKEN_VAL" \
              | curl -sS --config - --retry 2 --retry-delay 2 --retry-connrefused --max-time 10 \
                  -o "$RUNS_BODY_FILE" -w '%{http_code}' \
                  "$RUNS_URL" 2>/dev/null || echo "000")"
            MATCHING_IDS=""
            if [ "$RUNS_HTTP_CODE" = "200" ]; then
              # No jq. `grep -oE` on the literal byte pattern only — cannot itself throw on
              # anything ELSE in the document, well-formed or not, because it never attempts to
              # understand the document as a whole; it only ever looks at the bytes that match.
              MATCHING_IDS="$(grep -oE '"id":[0-9]+,"title":"Deploy DEV Stand"' "$RUNS_BODY_FILE" 2>/dev/null | grep -oE '[0-9]+' || true)"
              if [ -n "$MATCHING_IDS" ]; then
                NEWEST_MATCH_ID="$(printf '%s\n' "$MATCHING_IDS" | sort -rn | head -n1)"
                if [ "$NEWEST_MATCH_ID" -gt "$PRE_DISPATCH_MAX_ID" ]; then
                  FOUND_NEW_RUN_ID="$NEWEST_MATCH_ID"
                  rm -f "$RUNS_BODY_FILE"
                  break
                fi
              fi
            fi
            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}: no 'Deploy DEV Stand' run newer than the"\
                 "pre-dispatch baseline (id ${PRE_DISPATCH_MAX_ID}) found yet (HTTP"\
                 "${RUNS_HTTP_CODE}). Matching 'Deploy DEV Stand' ids seen this attempt:"\
                 "${MATCHING_IDS:-none}."
            rm -f "$RUNS_BODY_FILE"
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$RETRY_DELAY_SECONDS"
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          if [ -z "$FOUND_NEW_RUN_ID" ]; then
            echo "FAIL: after ${MAX_ATTEMPTS} attempts over ~$(( (MAX_ATTEMPTS - 1) * RETRY_DELAY_SECONDS ))s,"\
                 "no run titled 'Deploy DEV Stand' with an id greater than the pre-dispatch"\
                 "baseline (${PRE_DISPATCH_MAX_ID}) was found — the dispatch may have been"\
                 "silently swallowed (proxy, a since-disabled workflow, or a response shape this"\
                 "step does not recognise). See the per-attempt diagnostics above for what WAS"\
                 "visible each time."
            exit 1
          fi
          echo "OK: confirmed a NEW deploy-dev.yml run was created (id=${FOUND_NEW_RUN_ID}, above"\
               "the pre-dispatch baseline id ${PRE_DISPATCH_MAX_ID}) — the dispatch reached a"\
               "real, queued run, not just a 2xx from a proxy or a disabled-workflow acceptance."\
               "This does NOT wait for or report that run's own outcome (AC6 is narrowed to the"\
               "dispatch layer, DN1(a) — the residual gap is named and accepted, H2)."
