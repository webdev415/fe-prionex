name: Deploy PROD Stand

# Story 6.4, FR15/FR17/FR24. The production deploy caller: dispatch-only, two paths, and the
# first caller in this repository that is NOT a single `uses:`.
#
# ── The two paths ───────────────────────────────────────────────────────────────────────
#   rollback: true   -> pull an existing sha-<12hex>-prod and start it. NO BUILD RUNS.
#   rollback: false  -> rebuild the commit at `environment: prod` FIRST, then deploy. Option C
#                       bakes the production VITE_* values into the bundle, so a PRE-PROD
#                       artifact cannot be promoted -- it has the wrong URLs baked in (NFR11).
#
# ── 🔴 WHY THIS FILE HAS THREE JOBS AND NOT TWO ─────────────────────────────────────────
# `deploy-dev.yml` and `deploy-preprod.yml` are each ONE job, one `uses:`. This file cannot be,
# for two independent reasons:
#
#  (1) `deploy-stand.yml` BUILDS NOTHING. It deploys an image that already exists. The release
#      path therefore needs `build.yml` as a second callee.
#  (2) 🔴 A `uses:` job's `with:` accepts EXPRESSIONS ONLY, and this expression language has no
#      substring operation. The commit cannot be sliced out of `image_tag` inside `with:`. So a
#      plain job has to do it in shell and publish it as an output -- hence `derive`.
#
# Order: derive -> build (skipped on rollback) -> deploy.
#
# ── 🔴 THE `needs:` + `if:` TRAP, AND WHY THE DEPLOY JOB'S `if:` LOOKS LIKE THAT ────────
# A skipped `needs:` dependency normally makes the dependent job skip too. The deploy job MUST
# run on BOTH paths, so its `if:` admits "build succeeded OR build was skipped" explicitly, and
# is wrapped in `always()` so the expression is evaluated at all after a skip.
# Get this wrong and the ROLLBACK PATH SILENTLY DOES NOTHING while the run reports green -- the
# worst outcome available to a production workflow, because nothing fails.
# ⚠️ `#d21` established that a `uses:` job's `if:` is copied down into the callee and
# re-evaluated there. This is verified by observation (Story 6.4 AC6), not by reasoning.
#
# ── 🔴 THE TAG IS DERIVED TWICE, AND THE TWO MUST AGREE BYTE FOR BYTE ───────────────────
# `build.yml` declares NO `workflow_call` outputs -- measured. A caller cannot learn which tag
# the build published. So `derive` below computes `sha-<12hex>-prod` independently, and
# `build.yml` computes its own from `git rev-parse HEAD`. If the two ever diverge the failure
# surfaces as a 404 on the pull, which reads as "the image was never built" rather than "you
# asked for the wrong name". `deploy-stand.yml`'s own `image_env` input documents the same
# hazard for its own sanitizer.
# The short SHA is TWELVE characters. `#d18` §3 binds Stories 5.4, 6.3, 6.5 and 6.6 to that
# number: "если любая выведет тег из полного 40-символьного SHA, цель отката и гейт разойдутся
# молча". Do not "simplify" it.
#
# ── The dispatch contract ───────────────────────────────────────────────────────────────
# `image_tag` NAMES THE COMMIT, in `sha-<12hex>-<env>` form, on both paths:
#   release path : the validated PRE-PROD candidate, e.g. sha-28f7fd36b75e-preprod
#   rollback path: an existing PROD tag,             e.g. sha-a99ccd44c5a3-prod
# `derive` extracts the twelve hex characters and always hands `deploy-stand.yml` the `-prod`
# form. `deploy-stand.yml` refuses any tag that does not end in `-prod` (its own
# tag<->environment guard), which is why the `-prod` form is derived rather than passed through.
#
# 🔴 `prod-current` and `prod-<12hex>` are NOT accepted here and never will be. They are records,
# not deployable references, and that same guard refuses them. Story 6.9 dispatches
# `sha-<12hex>-prod`.
#
# ── 🔴 WHERE STORY 6.5's PROMOTION GUARD LANDS, AND WHY IT IS NOT HERE ──────────────────
# `derive` is the seam: it already extracts the commit, which is exactly what 6.5's guard needs
# in order to require `preprod-<sha>` in the registry and refuse otherwise -- and to SKIP that
# check entirely when `rollback` is true. **This story builds none of it** (Story 6.4 §12).
# The extraction is a separate named step precisely so 6.5 has somewhere obvious to land.
#
# ── `secrets: inherit`, decided rather than inherited by habit (Story 6.4 AC8) ──────────
# `deploy-stand.yml` CANNOT declare `on.workflow_call.secrets` -- the parser rejects it (`#d21`)
# -- so a caller passes `inherit` or the callee gets nothing. Both shipped callers use it.
# The cost, named: `inherit` hands the callee EVERY org secret, including REGISTRY_TOKEN_RW, a
# write:package credential over a namespace that holds another team's production packages.
#   build  : needs it -- the OpenBao AppRole pair and the RW push credential are both required.
#   deploy : its callee references only the RO pair, but the same parser limitation applies, and
#            a narrower block cannot be expressed on the callee side. `inherit` on both, with the
#            RW exposure recorded as accepted, matching deploy-dev.yml and deploy-preprod.yml.
#
# ── Values, and the two that would be copied WRONG from the siblings ────────────────────
# 🔴 frontend_port is BARE `8080`, not `127.0.0.1:8080`. DEV and PRE-PROD bind loopback because
#    nothing outside their host reaches them. PROD traffic arrives FROM THE HYPERVISOR, so a
#    loopback binding makes the stand unreachable by construction -- and the health check, which
#    probes the container itself, would still report success.
# 🔴 runner_label is `e1-rung3-prod-deploy`, NEVER `s10`/`e1-rung3`. Those belong to the
#    CI-shaped runner on the same host whose jobs execute in its dind and can never reach the
#    host's stand. The deploy runner is a HOST PROCESS with the `:host` executor and
#    `docker_host: unix:///var/run/docker.sock` (Story 6.10).
# ⚠️ frontend_network is `crm-prod-network`, and this is the axis where a wrong value fails
#    SILENTLY: nginx resolves Kong lazily and the healthcheck probes itself, so a stand on the
#    wrong network reports `healthy` and serves 200. `crm-prod-kong-gateway` carries the alias
#    `crm-kong-gateway` that the image's nginx.conf actually resolves -- verified on the host.
#
# ── Not here, deliberately ──────────────────────────────────────────────────────────────
#   Story 6.5 the promotion guard · 6.6 the prod-current/prod-<sha> retag after deploy ·
#   6.7 the smoke check (the callee's health and Kong probes are NOT it) · 6.8 rollback proven
#   with measured timing · 6.9 the cutover · 4.5 Slack, deferred 2026-08-14 and explicitly NOT
#   gating this story: "the production deploy must work, and must be provable, without any
#   notification".
#
# ── Every input reaches a `run:` body through `env:`, never through an expression (`#d21`) ──

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "The image tag naming the commit, in sha-<12hex>-<env> form. RELEASE: the validated PRE-PROD candidate (e.g. sha-28f7fd36b75e-preprod). ROLLBACK: an existing PROD tag (e.g. sha-a99ccd44c5a3-prod). NOT prod-current and NOT prod-<hex> — those are records, not deployable references."
        required: true
        type: string
      rollback:
        description: "true = pull the existing PROD tag and start it, NO build. false = rebuild the commit at environment=prod first (Option C), then deploy."
        required: false
        type: boolean
        default: false

# Its own literal group, shared with no other stand and containing no expression.
# Story 5.3's Prohibition 7: never copy another stand's group. DEV's and PRE-PROD's groups guard
# THEIR stands; this one guards the production stand on s10.
concurrency:
  group: deploy-prod-fe-prionex-prod
  cancel-in-progress: false

jobs:
  # ── derive ────────────────────────────────────────────────────────────────────────────
  # Shape-checks the dispatch and produces the two values the callees need. Does no network
  # I/O, touches no host, and is the seam Story 6.5's guard lands on.
  derive:
    name: "Derive the commit and the PROD tag, and refuse anything else"
    runs-on: node-20
    timeout-minutes: 5
    outputs:
      hex: ${{ steps.d.outputs.hex }}
      deploy_tag: ${{ steps.d.outputs.deploy_tag }}
      is_rollback: ${{ steps.d.outputs.is_rollback }}
    steps:
      - name: "Derive and validate"
        id: d
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          set -euo pipefail

          # A dispatch boolean can arrive as a real boolean or as the string "true" depending on
          # how the dispatch was made. Normalise ONCE, here, and let every later decision read
          # this single output instead of re-deciding it in an expression.
          case "$ROLLBACK" in
            true|True|TRUE) IS_ROLLBACK=true ;;
            *)              IS_ROLLBACK=false ;;
          esac

          case "$IMAGE_TAG" in
            *$'\n'*|*$'\r'*|*' '*|*$'\t'*)
              echo "FAIL: image_tag contains whitespace or a newline. Refusing before any shape check."
              exit 1 ;;
          esac

          # prod-current / prod-<hex> are records, not deployable references, and
          # deploy-stand.yml's own tag<->environment guard would refuse them anyway. Refusing
          # here means the operator gets a message that explains WHY instead of a suffix
          # mismatch four jobs later.
          case "$IMAGE_TAG" in
            prod-current|prod-*)
              echo "FAIL: image_tag='${IMAGE_TAG}' is a RECORD, not a deployable reference."
              echo "  prod-current names what production is meant to be running and prod-<12hex> is"
              echo "  history. Neither ends in '-prod', so deploy-stand.yml refuses both by design."
              echo "  Dispatch the sha-<12hex>-prod tag instead."
              exit 1 ;;
          esac

          if ! printf '%s' "$IMAGE_TAG" | grep -qE '^sha-[0-9a-f]{7,64}-(prod|preprod)$'; then
            echo "FAIL: image_tag='${IMAGE_TAG}' does not match ^sha-<hex>-(prod|preprod)\$."
            echo "  This workflow names the commit through the tag; see the file header."
            exit 1
          fi

          HEX="${IMAGE_TAG#sha-}"
          HEX="${HEX%-prod}"
          HEX="${HEX%-preprod}"

          # EXACTLY twelve. build.yml pins its short SHA at 12 and Story 6.5's guard compares
          # these strings byte for byte. A 40-character SHA here would derive sha-<40hex>-prod,
          # which build.yml never publishes -- the pull would 404 and read as "never built",
          # and the rollback target and the gate would diverge silently (#d18 §3).
          if ! printf '%s' "$HEX" | grep -qE '^[0-9a-f]{12}$'; then
            echo "FAIL: the hex part of '${IMAGE_TAG}' is '${HEX}' (${#HEX} characters), not exactly 12."
            echo "  build.yml pins the short SHA at 12; deriving any other length produces a tag"
            echo "  nothing ever published. Refusing (#d18 §3)."
            exit 1
          fi

          # On the ROLLBACK path the operator must name a PROD tag. Accepting a -preprod tag
          # here would mean 'rolling back' to an artifact production never ran, whose bundle
          # carries the PRE-PROD API URLs baked in at build time (Option C, NFR11) -- green
          # everywhere and dead in the browser.
          if [ "$IS_ROLLBACK" = true ]; then
            case "$IMAGE_TAG" in
              *-preprod)
                echo "FAIL: rollback=true but image_tag='${IMAGE_TAG}' names the PRE-PROD environment."
                echo "  A rollback restores something production actually ran. A -preprod artifact"
                echo "  has PRE-PROD's API URLs baked into its bundle and was never a PROD image."
                exit 1 ;;
            esac
          fi

          DEPLOY_TAG="sha-${HEX}-prod"
          {
            echo "hex=${HEX}"
            echo "deploy_tag=${DEPLOY_TAG}"
            echo "is_rollback=${IS_ROLLBACK}"
          } >> "$GITHUB_OUTPUT"

          echo "commit (12 hex): ${HEX}"
          echo "deploy tag:      ${DEPLOY_TAG}"
          echo "rollback:        ${IS_ROLLBACK}"

      - name: "State which path this run takes, and what that means"
        env:
          IS_ROLLBACK: ${{ steps.d.outputs.is_rollback }}
          DEPLOY_TAG: ${{ steps.d.outputs.deploy_tag }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          {
            if [ "$IS_ROLLBACK" = true ]; then
              echo "### ROLLBACK — no build will run"
              echo
              echo "Pulling the existing \`${DEPLOY_TAG}\` and starting it. **No image is produced by"
              echo "this run.** The build job is skipped; the deploy job still runs."
            else
              echo "### RELEASE — this is a REBUILD, not a promotion"
              echo
              echo "🔴 The image deployed by this run is **built here**, from the commit named by"
              echo "\`${IMAGE_TAG}\`. It is **NOT** the artifact validated on PRE-PROD and is **not"
              echo "byte-identical** to it: under Option C the production \`VITE_API_BASE_URL\` and"
              echo "\`VITE_WS_URL\` are baked into the bundle at build time, so a PRE-PROD artifact"
              echo "cannot be promoted — it carries the wrong URLs (NFR11, \`#d2\`)."
              echo
              echo "What PRE-PROD validation proves is that **this commit** passed. It proves nothing"
              echo "about **these bytes**. Nobody attests to the bytes."
              echo
              echo "Deploying \`${DEPLOY_TAG}\`."
            fi
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

  # ── build ─────────────────────────────────────────────────────────────────────────────
  # Release path only. Publishes sha-<12hex>-prod (permanent) and <sanitized-ref>-prod (14 days).
  # 🔴 build.yml's own "Enforce AC2" refuses to repoint an existing sha-<12hex>-prod, and
  # vite.config.ts's Date.now() makes every rebuild differ -- so a release dispatch of a commit
  # ALREADY built at prod goes red, by construction and not by defect (#d24 §2b, #d46).
  build:
    name: "Rebuild the commit at environment: prod"
    needs: derive
    if: needs.derive.outputs.is_rollback != 'true'
    uses: ./.forgejo/workflows/build.yml
    with:
      ref: ${{ needs.derive.outputs.hex }}
      environment: prod
    secrets: inherit

  # ── deploy ────────────────────────────────────────────────────────────────────────────
  # Runs on BOTH paths. See the header: `always()` plus an explicit success-or-skipped test is
  # what keeps the rollback path from silently doing nothing.
  deploy:
    name: "Deploy to the PROD stand on s10"
    needs: [derive, build]
    if: >-
      always() &&
      needs.derive.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    uses: ./.forgejo/workflows/deploy-stand.yml
    with:
      runner_label: e1-rung3-prod-deploy
      compose_project_name: fe-prionex-prod
      container_name: fe-prionex-prod
      frontend_port: "8080"
      frontend_network: crm-prod-network
      stand_dir: /root/crm-prionex/fe-prionex-prod
      image_env: prod
      image_tag: ${{ needs.derive.outputs.deploy_tag }}
      lock_wait_seconds: "240"
      lock_ttl_seconds: "720"
      health_timeout_seconds: "120"
      expect_unrouted_api: "false"
    secrets: inherit
