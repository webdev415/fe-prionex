# Frontend Production Docker Compose 
# For production deployment with nginx

name: fe-prionex

services:
  frontend:
    # Use image from registry (built by CI/CD) instead of building locally
    image: ${DOCKER_IMAGE:-ghcr.io/crm-prionex/fe-prionex:latest}
    # Uncomment below if you need to build locally instead
    # build:
    #   context: .
    #   dockerfile: Dockerfile.prod
    #   args:
    #     - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://api.crm-prionex.online}
    container_name: fe-prionex-prod
    ports:
      # Use port 8080 to avoid conflict with backend Kong on port 80
      # In production, use a reverse proxy (nginx/traefik) to route traffic
      - "8080:80"
      # Optional: HTTPS port (uncomment if using SSL)
      # - "8443:443"
    networks:
      - crm-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  crm-network:
    external: true
    name: crm-prod-network

