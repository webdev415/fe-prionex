# Frontend Production Docker Compose
# For production deployment with nginx

name: fe-prionex

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        # ⚠️ IMPORTANT: This URL is used by browsers, not Docker containers!
        # Use server IP/domain that browsers can access, NOT Docker service names
        # Examples:
        # - http://YOUR_SERVER_IP:80 (if Kong is on port 80)
        # - https://api.yourdomain.com (if using domain)
        # - https://yourdomain.com/api (if using reverse proxy)
        # ❌ DO NOT USE: http://kong:8000 (browsers can't resolve this!)
        # In production, default to the public API domain behind Nginx.
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://api.crm-prionex.com}
    container_name: fe-prionex-prod
    ports:
      # Use port 8080 to avoid conflict with backend Kong on port 80
      # In production, use a reverse proxy (nginx/traefik) to route traffic
      - "8080:80"
      # Optional: HTTPS port (uncomment if using SSL)
      # - "8443:443"
    networks:
      - crm-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  crm-network:
    external: true
    name: crm-network

