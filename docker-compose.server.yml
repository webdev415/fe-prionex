# Frontend - Unified Server Deployment
# Usage: docker compose -f docker-compose.server.yml --env-file .env up -d

name: fe-prionex

services:
  frontend:
    image: ${DOCKER_IMAGE:-ghcr.io/crm-prionex/fe-prionex:latest}
    container_name: fe-prionex
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - crm-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  crm-network:
    external: true
    name: crm-network
