name: CD

on:
  push:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - dev

# Deploys to the same ref queue up (cancel-in-progress: false), so two quick
# merges never race down/rm/up against each other. Same pattern as api-prionex.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Docker image name must be lowercase; hard-code repo path to avoid case issues
  IMAGE_NAME: crm-prionex/fe-prionex

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Determine API, WebSocket and operator-phone URLs for build
        id: set-api-url
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Production environment
            API_URL="${{ secrets.VITE_API_BASE_URL_PROD }}"
            if [ -z "$API_URL" ]; then
              API_URL="https://api.crm-prionex.online"
            fi
            WS_URL="${{ secrets.VITE_WS_URL_PROD }}"
            if [ -z "$WS_URL" ]; then
              WS_URL="wss://api.crm-prionex.online"
            fi
            # No prod softphone deployment yet. When the secret is unset, build with the
            # operator-phone feature DISABLED (empty URL) rather than failing the release.
            # Do NOT fall back to the dev softphone (webrtc.crm-prionex.online): it is built
            # with VITE_CRM_PARENT_ORIGIN pointing at the dev CRM, so it rejects prod
            # postMessage and would ship a phone stuck on "Connecting". constants.ts treats
            # an empty URL as OPERATOR_PHONE_CONFIGURED=false — the panel renders nothing and
            # the hook no-ops. Set VITE_OPERATOR_PHONE_URL_PROD (a real prod softphone) to
            # enable it, no code change needed.
            PHONE_URL="${{ secrets.VITE_OPERATOR_PHONE_URL_PROD }}"
            if [ -z "$PHONE_URL" ]; then
              echo "⚠️  VITE_OPERATOR_PHONE_URL_PROD not set — building prod with operator phone disabled"
              PHONE_URL=""
            fi
          elif [ "${{ github.ref }}" == "refs/heads/development" ]; then
            # Development environment
            API_URL="${{ secrets.VITE_API_BASE_URL_DEV }}"
            if [ -z "$API_URL" ]; then
              API_URL="https://api.dev.crm-prionex.online"
            fi
            WS_URL="${{ secrets.VITE_WS_URL_DEV }}"
            if [ -z "$WS_URL" ]; then
              WS_URL="wss://api.dev.crm-prionex.online"
            fi
            # There is no separate dev softphone host; the single deployment at
            # webrtc.crm-prionex.online is built with VITE_CRM_PARENT_ORIGIN set
            # to the dev CRM, so it is the correct target here. The secret exists
            # to repoint dev once a second deployment lands.
            PHONE_URL="${{ secrets.VITE_OPERATOR_PHONE_URL_DEV }}"
            if [ -z "$PHONE_URL" ]; then
              PHONE_URL="https://webrtc.crm-prionex.online"
            fi
          else
            # Default to production for tags or other branches
            API_URL="${{ secrets.VITE_API_BASE_URL_PROD }}"
            if [ -z "$API_URL" ]; then
              API_URL="https://api.crm-prionex.online"
            fi
            WS_URL="${{ secrets.VITE_WS_URL_PROD }}"
            if [ -z "$WS_URL" ]; then
              WS_URL="wss://api.crm-prionex.online"
            fi
            # No prod softphone deployment yet. When the secret is unset, build with the
            # operator-phone feature DISABLED (empty URL) rather than failing the release.
            # Do NOT fall back to the dev softphone (webrtc.crm-prionex.online): it is built
            # with VITE_CRM_PARENT_ORIGIN pointing at the dev CRM, so it rejects prod
            # postMessage and would ship a phone stuck on "Connecting". constants.ts treats
            # an empty URL as OPERATOR_PHONE_CONFIGURED=false — the panel renders nothing and
            # the hook no-ops. Set VITE_OPERATOR_PHONE_URL_PROD (a real prod softphone) to
            # enable it, no code change needed.
            PHONE_URL="${{ secrets.VITE_OPERATOR_PHONE_URL_PROD }}"
            if [ -z "$PHONE_URL" ]; then
              echo "⚠️  VITE_OPERATOR_PHONE_URL_PROD not set — building prod with operator phone disabled"
              PHONE_URL=""
            fi
          fi
          echo "API_URL=$API_URL" >> $GITHUB_OUTPUT
          echo "WS_URL=$WS_URL" >> $GITHUB_OUTPUT
          echo "PHONE_URL=$PHONE_URL" >> $GITHUB_OUTPUT
          echo "📋 Building with API URL: $API_URL"
          echo "📋 Building with WS URL: $WS_URL"
          echo "📋 Building with operator phone URL: $PHONE_URL"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # VITE_ASSISTANT_REPORT_TABLES_ENABLED — feature flag for the assistant's
      # report tables (heat map + attention rows). Vite inlines it at build
      # time, so it has to be a build-arg. The repository variable is normally
      # unset: it then expands to an empty string and the feature stays off;
      # set it to "true" to ship the feature.
      #
      # 🔴 NO `VITE_OPENREPLAY_*` HERE, AND THAT IS LOAD-BEARING (KAN-KB-54,
      # step 8.3). This is the SECOND build path — `.forgejo/workflows/build.yml`
      # is the first — and it passes no OpenReplay arguments at all, so a bundle
      # built here carries no project key and the tracker never starts. That is
      # why the prod gate, which lived only in `build.yml`, was never a gate on
      # this path: there was nothing here to gate.
      #
      # Whoever adds an OpenReplay build-arg to this file is switching session
      # recording on for whatever it deploys. Before doing it, read
      # `docs/openreplay-pii-markup.md`: the PII markup is what makes that safe,
      # and `npm run pii-audit -- --check` in the `lint` job of BOTH CI files is
      # what keeps it so.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ steps.set-api-url.outputs.API_URL }}
            VITE_WS_URL=${{ steps.set-api-url.outputs.WS_URL }}
            VITE_ASSISTANT_REPORT_TABLES_ENABLED=${{ vars.VITE_ASSISTANT_REPORT_TABLES_ENABLED }}
            VITE_OPERATOR_PHONE_URL=${{ steps.set-api-url.outputs.PHONE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Frontend
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/development' && 'dev' || 'production') }}

    steps:
      - name: Notify Slack - Deployment Started
        if: always()
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_CD_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": ":rocket: *Deployment Started*\nRepo: fe-prionex\nEnvironment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/development' && 'dev' || 'production') }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"}
        continue-on-error: true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Determine deployment environment
        id: set-env
        run: |
          # Mirrors the `environment:` expression on this job exactly — same first
          # condition, same single discriminator, same default. Keep them in step:
          # if they diverge, the approval gate and the deploy target disagree.
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            DEPLOY_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/development" ]; then
            DEPLOY_ENV="dev"
          else
            DEPLOY_ENV="production"
          fi
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> $GITHUB_OUTPUT
          echo "📋 Determined environment: $DEPLOY_ENV"

      - name: Copy docker-compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_HOST || secrets.DEV_SSH_HOST }}
          username: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_USER || secrets.DEV_SSH_USER }}
          key: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_KEY || secrets.DEV_SSH_KEY }}
          port: 22
          source: "docker-compose.server.yml"
          target: "~/crm-prionex/fe-prionex/"

      - name: Deploy to server
        env:
          DEPLOY_ENV: ${{ steps.set-env.outputs.DEPLOY_ENV }}
          GITHUB_REF: ${{ github.ref }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_HOST || secrets.DEV_SSH_HOST }}
          username: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_USER || secrets.DEV_SSH_USER }}
          key: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_KEY || secrets.DEV_SSH_KEY }}
          port: 22
          envs: DEPLOY_ENV,GITHUB_REF
          script: |
            cd ~/crm-prionex/fe-prionex

            echo "📋 Branch: $GITHUB_REF"
            echo "📋 Deploying to: $DEPLOY_ENV"

            COMPOSE_FILE="docker-compose.server.yml"
            ENV_FILE=".env"

            # Ensure crm-network exists
            docker network create crm-network 2>/dev/null || true

            # Pull the branch-specific image; fail fast if it is missing.
            # No fallback to :latest — that could silently deploy a prod image to dev.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            BRANCH_NAME=$(echo "$GITHUB_REF" | sed 's/refs\/heads\///')
            if docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$BRANCH_NAME; then
              export DOCKER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$BRANCH_NAME"
              echo "✅ Using branch-specific image: $DOCKER_IMAGE"
            else
              echo "❌ Image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$BRANCH_NAME not found — aborting deploy (fail fast, no :latest fallback)"
              exit 1
            fi

            # Stop and remove existing container to avoid name conflict
            docker compose -f $COMPOSE_FILE down --remove-orphans 2>/dev/null || true
            docker rm -f fe-prionex 2>/dev/null || true

            # Deploy
            if [ -f "$ENV_FILE" ]; then
              echo "Using env file: $ENV_FILE"
              docker compose --env-file $ENV_FILE -f $COMPOSE_FILE up -d
            else
              echo "Warning: Env file $ENV_FILE not found, using defaults from compose file"
              DOCKER_IMAGE=$DOCKER_IMAGE docker compose -f $COMPOSE_FILE up -d
            fi

      - name: Post-deploy frontend health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_HOST || secrets.DEV_SSH_HOST }}
          username: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_USER || secrets.DEV_SSH_USER }}
          key: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_KEY || secrets.DEV_SSH_KEY }}
          port: 22
          script: |
            # Check the fe-prionex container itself (compose healthcheck: wget 127.0.0.1:80),
            # not localhost:3000 (that is Metabase, a different container).
            echo "Waiting for frontend to be healthy (up to 5 minutes)..."
            for i in $(seq 1 60); do
              STATUS=$(docker inspect -f '{{.State.Health.Status}}' fe-prionex 2>/dev/null || echo "not-found")
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ Frontend container is healthy"
                exit 0
              fi
              echo "  Attempt $i/60 - container status: $STATUS - waiting 5s..."
              sleep 5
            done
            # Fallback: container healthcheck inconclusive — probe the published port directly
            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "✅ Frontend responds on :8080 (container healthcheck inconclusive)"
              exit 0
            fi
            echo "❌ Frontend failed to become healthy within 5 minutes"
            exit 1

      - name: Deploy notification
        if: always()
        run: |
          echo "Deployment completed for ${{ github.ref }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Notify Slack - Deployment Succeeded
        if: success()
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_CD_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": ":white_check_mark: *Deployment Succeeded*\nRepo: fe-prionex\nEnvironment: ${{ steps.set-env.outputs.DEPLOY_ENV }}\nBranch: ${{ github.ref_name }}"}
        continue-on-error: true

      - name: Notify Slack - Deployment Failed
        if: failure()
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_CD_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": ":x: *Deployment FAILED*\nRepo: fe-prionex\nEnvironment: ${{ steps.set-env.outputs.DEPLOY_ENV }}\nBranch: ${{ github.ref_name }}\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        continue-on-error: true
