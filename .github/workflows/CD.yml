name: CD

on:
  push:
    branches: [main, staging, development]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - dev

env:
  REGISTRY: ghcr.io
  # Docker image name must be lowercase; hard-code repo path to avoid case issues
  IMAGE_NAME: crm-prionex/fe-prionex

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine API and WebSocket URLs for build
        id: set-api-url
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Production environment
            API_URL="${{ secrets.VITE_API_BASE_URL_PROD }}"
            if [ -z "$API_URL" ]; then
              API_URL="${{ secrets.VITE_API_BASE_URL }}"
            fi
            if [ -z "$API_URL" ]; then
              API_URL="https://api.crm-prionex.online"
            fi
            WS_URL="${{ secrets.VITE_WS_URL_PROD }}"
            if [ -z "$WS_URL" ]; then
              WS_URL="wss://api.crm-prionex.online"
            fi
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            # Staging environment
            API_URL="${{ secrets.VITE_API_BASE_URL_STAGING }}"
            if [ -z "$API_URL" ]; then
              API_URL="https://api.staging.crm-prionex.online"
            fi
            WS_URL="${{ secrets.VITE_WS_URL_STAGING }}"
            if [ -z "$WS_URL" ]; then
              WS_URL="wss://api.staging.crm-prionex.online"
            fi
          elif [ "${{ github.ref }}" == "refs/heads/development" ]; then
            # Development environment
            API_URL="${{ secrets.VITE_API_BASE_URL_DEV }}"
            if [ -z "$API_URL" ]; then
              API_URL="https://api.dev.crm-prionex.online"
            fi
            WS_URL="${{ secrets.VITE_WS_URL_DEV }}"
            if [ -z "$WS_URL" ]; then
              WS_URL="wss://api.dev.crm-prionex.online"
            fi
          else
            # Default to production for tags or other branches
            API_URL="${{ secrets.VITE_API_BASE_URL_PROD }}"
            if [ -z "$API_URL" ]; then
              API_URL="${{ secrets.VITE_API_BASE_URL }}"
            fi
            if [ -z "$API_URL" ]; then
              API_URL="https://api.crm-prionex.online"
            fi
            WS_URL="${{ secrets.VITE_WS_URL_PROD }}"
            if [ -z "$WS_URL" ]; then
              WS_URL="wss://api.crm-prionex.online"
            fi
          fi
          echo "API_URL=$API_URL" >> $GITHUB_OUTPUT
          echo "WS_URL=$WS_URL" >> $GITHUB_OUTPUT
          echo "📋 Building with API URL: $API_URL"
          echo "📋 Building with WS URL: $WS_URL"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ steps.set-api-url.outputs.API_URL }}
            VITE_WS_URL=${{ steps.set-api-url.outputs.WS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Frontend
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/staging' && 'staging' || github.ref == 'refs/heads/development' && 'dev' || 'production') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: "docker-compose.prod.yml,docker-compose.staging.yml,docker-compose.dev-env.yml"
          target: "~/crm-prionex/fe-prionex/"

      - name: Deploy to server
        env:
          DEPLOY_ENV: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/staging' && 'staging' || github.ref == 'refs/heads/development' && 'dev' || 'production') }}
          GITHUB_REF: ${{ github.ref }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_ENV,GITHUB_REF
          script: |
            cd ~/crm-prionex/fe-prionex
            
            # Use environment from GitHub Actions
            ENV_TYPE="$DEPLOY_ENV"
            
            echo "📋 Branch: $GITHUB_REF"
            echo "📋 Deploying to: $ENV_TYPE"
            
            # Set compose file and env file based on environment
            if [ "$ENV_TYPE" == "production" ]; then
              COMPOSE_FILE="docker-compose.prod.yml"
              # Try multiple possible env file names
              ENV_FILE=".env.prod"
              if [ ! -f "$ENV_FILE" ]; then
                ENV_FILE=".env.production"
              fi
            elif [ "$ENV_TYPE" == "staging" ]; then
              COMPOSE_FILE="docker-compose.staging.yml"
              ENV_FILE=".env.staging"
            elif [ "$ENV_TYPE" == "dev" ]; then
              COMPOSE_FILE="docker-compose.dev-env.yml"
              ENV_FILE=".env.dev"
            else
              echo "Unknown environment: $ENV_TYPE"
              exit 1
            fi
            
            # Pull the latest image (use branch-specific tag if available, otherwise latest)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            # Try to pull branch-specific image first, fallback to latest
            BRANCH_NAME=$(echo "$GITHUB_REF" | sed 's/refs\/heads\///')
            if docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$BRANCH_NAME 2>/dev/null; then
              export DOCKER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$BRANCH_NAME"
              echo "✅ Using branch-specific image: $DOCKER_IMAGE"
            else
              docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
              export DOCKER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
              echo "✅ Using latest image: $DOCKER_IMAGE"
            fi
            
            # DOCKER_IMAGE is already set above
            
            # Use docker compose to deploy
            # Only use --env-file if the file exists, otherwise use defaults from compose file
            if [ -f "$ENV_FILE" ]; then
              echo "Using env file: $ENV_FILE"
              docker compose --env-file $ENV_FILE -f $COMPOSE_FILE up -d
            else
              echo "Warning: Env file $ENV_FILE not found, using defaults from compose file"
              docker compose -f $COMPOSE_FILE up -d
            fi

      - name: Deploy notification
        if: always()
        run: |
          echo "Deployment completed for ${{ github.ref }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

