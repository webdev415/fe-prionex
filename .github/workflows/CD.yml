name: CD

on:
  push:
    branches: [main, development]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - dev

env:
  REGISTRY: ghcr.io
  # Docker image name must be lowercase; hard-code repo path to avoid case issues
  IMAGE_NAME: crm-prionex/fe-prionex

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine API and WebSocket URLs for build
        id: set-api-url
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Production environment
            API_URL="${{ secrets.VITE_API_BASE_URL_PROD }}"
            if [ -z "$API_URL" ]; then
              API_URL="https://api.crm-prionex.online"
            fi
            WS_URL="${{ secrets.VITE_WS_URL_PROD }}"
            if [ -z "$WS_URL" ]; then
              WS_URL="wss://api.crm-prionex.online"
            fi
          elif [ "${{ github.ref }}" == "refs/heads/development" ]; then
            # Development environment
            API_URL="${{ secrets.VITE_API_BASE_URL_DEV }}"
            if [ -z "$API_URL" ]; then
              API_URL="https://api.dev.crm-prionex.online"
            fi
            WS_URL="${{ secrets.VITE_WS_URL_DEV }}"
            if [ -z "$WS_URL" ]; then
              WS_URL="wss://api.dev.crm-prionex.online"
            fi
          else
            # Default to production for tags or other branches
            API_URL="${{ secrets.VITE_API_BASE_URL_PROD }}"
            if [ -z "$API_URL" ]; then
              API_URL="https://api.crm-prionex.online"
            fi
            WS_URL="${{ secrets.VITE_WS_URL_PROD }}"
            if [ -z "$WS_URL" ]; then
              WS_URL="wss://api.crm-prionex.online"
            fi
          fi
          echo "API_URL=$API_URL" >> $GITHUB_OUTPUT
          echo "WS_URL=$WS_URL" >> $GITHUB_OUTPUT
          echo "📋 Building with API URL: $API_URL"
          echo "📋 Building with WS URL: $WS_URL"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ steps.set-api-url.outputs.API_URL }}
            VITE_WS_URL=${{ steps.set-api-url.outputs.WS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Frontend
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'dev') }}

    steps:
      - name: Notify Slack - Deployment Started
        if: always()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_CD_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": ":rocket: *Deployment Started*\nRepo: fe-prionex\nEnvironment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'dev') }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"}
        continue-on-error: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine deployment environment
        id: set-env
        run: |
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            DEPLOY_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            DEPLOY_ENV="production"
          elif [ "${{ github.ref }}" == "refs/heads/development" ]; then
            DEPLOY_ENV="dev"
          else
            DEPLOY_ENV="production"
          fi
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> $GITHUB_OUTPUT
          echo "📋 Determined environment: $DEPLOY_ENV"

      - name: Copy docker-compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_HOST || secrets.DEV_SSH_HOST }}
          username: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_USER || secrets.DEV_SSH_USER }}
          key: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_KEY || secrets.DEV_SSH_KEY }}
          port: 22
          source: "docker-compose.server.yml"
          target: "~/crm-prionex/fe-prionex/"

      - name: Deploy to server
        env:
          DEPLOY_ENV: ${{ steps.set-env.outputs.DEPLOY_ENV }}
          GITHUB_REF: ${{ github.ref }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_HOST || secrets.DEV_SSH_HOST }}
          username: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_USER || secrets.DEV_SSH_USER }}
          key: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_KEY || secrets.DEV_SSH_KEY }}
          port: 22
          envs: DEPLOY_ENV,GITHUB_REF
          script: |
            cd ~/crm-prionex/fe-prionex

            echo "📋 Branch: $GITHUB_REF"
            echo "📋 Deploying to: $DEPLOY_ENV"

            COMPOSE_FILE="docker-compose.server.yml"
            ENV_FILE=".env"

            # Ensure crm-network exists
            docker network create crm-network 2>/dev/null || true

            # Pull the latest image (use branch-specific tag if available, otherwise latest)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            # Try to pull branch-specific image first, fallback to latest
            BRANCH_NAME=$(echo "$GITHUB_REF" | sed 's/refs\/heads\///')
            if docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$BRANCH_NAME 2>/dev/null; then
              export DOCKER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$BRANCH_NAME"
              echo "✅ Using branch-specific image: $DOCKER_IMAGE"
            else
              docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
              export DOCKER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
              echo "✅ Using latest image: $DOCKER_IMAGE"
            fi

            # Stop and remove existing container to avoid name conflict
            docker compose -f $COMPOSE_FILE down --remove-orphans 2>/dev/null || true
            docker rm -f fe-prionex 2>/dev/null || true

            # Deploy
            if [ -f "$ENV_FILE" ]; then
              echo "Using env file: $ENV_FILE"
              docker compose --env-file $ENV_FILE -f $COMPOSE_FILE up -d
            else
              echo "Warning: Env file $ENV_FILE not found, using defaults from compose file"
              DOCKER_IMAGE=$DOCKER_IMAGE docker compose -f $COMPOSE_FILE up -d
            fi

      - name: Post-deploy frontend health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_HOST || secrets.DEV_SSH_HOST }}
          username: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_USER || secrets.DEV_SSH_USER }}
          key: ${{ steps.set-env.outputs.DEPLOY_ENV == 'production' && secrets.PROD_SSH_KEY || secrets.DEV_SSH_KEY }}
          port: 22
          script: |
            echo "Waiting for frontend to be healthy (up to 5 minutes)..."
            for i in $(seq 1 60); do
              if curl -sf http://localhost:3000 > /dev/null 2>&1; then
                echo "✅ Frontend is healthy"
                exit 0
              fi
              echo "  Attempt $i/60 - waiting 5s..."
              sleep 5
            done
            echo "❌ Frontend failed to respond within 5 minutes"
            exit 1

      - name: Deploy notification
        if: always()
        run: |
          echo "Deployment completed for ${{ github.ref }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Notify Slack - Deployment Succeeded
        if: success()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_CD_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": ":white_check_mark: *Deployment Succeeded*\nRepo: fe-prionex\nEnvironment: ${{ steps.set-env.outputs.DEPLOY_ENV }}\nBranch: ${{ github.ref_name }}"}
        continue-on-error: true

      - name: Notify Slack - Deployment Failed
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_CD_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": ":x: *Deployment FAILED*\nRepo: fe-prionex\nEnvironment: ${{ steps.set-env.outputs.DEPLOY_ENV }}\nBranch: ${{ github.ref_name }}\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        continue-on-error: true
