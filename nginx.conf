server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Character encoding (required for emoji flags)
    charset utf-8;
    source_charset utf-8;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # HTML files - ensure UTF-8 charset and no caching (required for emoji flags)
    location ~* \.html$ {
        charset utf-8;
        expires -1;
        add_header Content-Type "text/html; charset=utf-8" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # Proxy API requests to Kong gateway.
    # Variable upstream + resolver = lazy DNS: nginx starts and serves static
    # files even when Kong is down (no "[emerg] host not found" crash-loop),
    # and re-resolves the name every 10s so it recovers without a restart.
    # proxy_pass with a variable and no URI part forwards the original request
    # URI unchanged (/api/... -> /api/...), same as the previous
    # "proxy_pass http://crm-kong-gateway:8000/api/;" with the /api/ prefix.
    location /api/ {
        # Allow document uploads up to 50 MB (legal-office PDFs/ZIPs). Without
        # this nginx's 1 MB default rejects them with 413 before Kong/backend
        # (services cap uploads themselves, e.g. email-service at 25 MB).
        client_max_body_size 50m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kong_upstream http://crm-kong-gateway:8000;
        proxy_pass $kong_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket connections (same lazy-upstream pattern, /ws/ -> /ws/)
    location /ws/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kong_upstream http://crm-kong-gateway:8000;
        proxy_pass $kong_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Handle React Router (SPA routing)
    location / {
        charset utf-8;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        charset utf-8;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
